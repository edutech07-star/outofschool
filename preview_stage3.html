<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Escape Room School — 2D Pixel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a18; --fg:#e8e8ee; --accent:#7af0a0; --dream:#9b8aff;
    --warn:#f06070; --muted:#6a6a78; --border:#2a2a36;
  }
  *,*:before,*:after { box-sizing:border-box; image-rendering:pixelated; image-rendering:crisp-edges; }
  html, body { margin:0; padding:0; background:#000; color:var(--fg);
    font-family:'VT323', monospace; font-size:18px; overflow:hidden; height:100%; }
  h1,h2,h3 { font-family:'Press Start 2P', monospace; letter-spacing:1px; }
  h1 { font-size:16px !important; line-height:1.4; margin:0 0 16px; }
  h2 { font-size:12px !important; line-height:1.4; margin:18px 0 10px; color:var(--accent); }
  h3 { font-size:11px !important; margin:0 0 6px; color:var(--accent); }
  input, button, .panel, .difficulty-card, #bottom-map, #gamepad-status {
    border-radius: 0 !important;
  }
  #c { display:block; width:100vw; height:100vh; image-rendering:pixelated; background:#000; }

  /* 몽환적 로그인 배경 */
  #photo-bg {
    position:fixed; inset:0; z-index:40; overflow:hidden;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(120,80,180,0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 70%, rgba(80,160,200,0.15) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 60%, rgba(140,100,80,0.20) 0%, rgba(10,8,18,0.96) 78%),
      linear-gradient(180deg, #2a2240 0%, #1a1828 45%, #0a0814 100%);
    animation: dreamShift 12s infinite ease-in-out;
  }
  @keyframes dreamShift {
    0%,100% { filter: hue-rotate(0deg) brightness(1); }
    50% { filter: hue-rotate(20deg) brightness(1.1); }
  }
  #photo-bg::before {
    content:""; position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px),
      radial-gradient(circle at 20% 10%, rgba(200,160,255,0.18), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(140,220,255,0.12), transparent 50%);
    mix-blend-mode:overlay; pointer-events:none; animation:flicker 4s infinite;
  }
  #photo-bg::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,0.65) 100%);
  }
  @keyframes flicker { 0%,100%{opacity:1} 47%{opacity:0.85} 50%{opacity:0.78} 53%{opacity:0.92} }

  /* 떠다니는 빛 파티클 */
  .dream-orb {
    position:absolute; border-radius:50%; pointer-events:none;
    background: radial-gradient(circle, rgba(200,180,255,0.9) 0%, rgba(120,100,200,0.4) 40%, transparent 70%);
    mix-blend-mode:screen;
  }
  @keyframes float1 {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    20%  { opacity: 1; }
    50%  { transform: translate(40px, -80px) scale(1.3); opacity: 0.9; }
    80%  { opacity: 0.6; }
    100% { transform: translate(-20px, -200px) scale(0.6); opacity: 0; }
  }
  @keyframes float2 {
    0%   { transform: translate(0, 0) scale(0.8); opacity: 0; }
    25%  { opacity: 0.8; }
    50%  { transform: translate(-60px, -120px) scale(1.1); opacity: 1; }
    75%  { opacity: 0.5; }
    100% { transform: translate(30px, -240px) scale(0.5); opacity: 0; }
  }
  @keyframes float3 {
    0%   { transform: translate(0, 0) scale(1.2); opacity: 0; }
    30%  { opacity: 1; }
    60%  { transform: translate(80px, -100px) scale(0.9); opacity: 0.7; }
    100% { transform: translate(-40px, -260px) scale(0.4); opacity: 0; }
  }

  .photo-school {
    position:absolute; left:50%; top:30%; transform:translate(-50%,-50%);
    width:70vmin; max-width:800px; height:auto; opacity:0.55; color:#c8b0e8;
    filter:blur(0.4px) drop-shadow(0 0 12px rgba(180,140,240,0.4));
    pointer-events:none;
    animation: schoolBreathe 8s infinite ease-in-out;
  }
  @keyframes schoolBreathe {
    0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.55; }
    50% { transform: translate(-50%,-52%) scale(1.02); opacity: 0.75; }
  }
  .photo-title {
    position:absolute; left:50%; top:9%; transform:translateX(-50%);
    color:#e8d8ff; font-size:22px; letter-spacing:10px;
    font-family:'Press Start 2P', monospace;
    text-shadow:
      0 0 10px rgba(180,140,240,0.9),
      0 0 20px rgba(120,90,200,0.6),
      0 0 30px rgba(80,160,220,0.4);
    animation: titleGlow 4s infinite ease-in-out;
  }
  @keyframes titleGlow {
    0%,100% { text-shadow:
      0 0 10px rgba(180,140,240,0.9),
      0 0 20px rgba(120,90,200,0.6),
      0 0 30px rgba(80,160,220,0.4); }
    50% { text-shadow:
      0 0 14px rgba(220,180,255,1),
      0 0 28px rgba(160,120,240,0.8),
      0 0 42px rgba(100,180,240,0.5); }
  }
  .photo-date { position:absolute; right:28px; bottom:22px; color:#c8b0e8;
    font-size:14px; opacity:0.6; letter-spacing:3px; font-style:italic;
    text-shadow: 0 0 6px rgba(180,140,240,0.5); }
  .photo-tagline {
    position: absolute; left: 50%; top: 17%; transform: translateX(-50%);
    color: #b8a0d8; font-size: 14px; letter-spacing: 4px; opacity: 0.7;
    font-family: 'VT323', monospace;
    text-shadow: 0 0 8px rgba(180,140,240,0.6);
  }

  .overlay {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:50; padding:24px; background:rgba(10,10,18,0.85);
  }
  .overlay.transparent { background:transparent; }
  .panel {
    background:rgba(18,18,26,0.94); border:3px solid var(--border);
    padding:24px; max-width:720px; width:100%; max-height:90vh; overflow:auto;
    box-shadow:8px 8px 0 #000, 0 0 40px rgba(122,240,160,0.06);
  }
  .panel.login {
    background:rgba(28,20,42,0.88); border-color:#6a4a96; color:#e8d8ff;
    box-shadow:
      8px 8px 0 #000,
      0 0 60px rgba(160,120,240,0.35),
      inset 0 0 30px rgba(120,90,200,0.15);
    max-width:460px;
    backdrop-filter: blur(2px);
    animation: panelGlow 5s infinite ease-in-out;
  }
  @keyframes panelGlow {
    0%,100% { box-shadow: 8px 8px 0 #000, 0 0 60px rgba(160,120,240,0.35), inset 0 0 30px rgba(120,90,200,0.15); }
    50%     { box-shadow: 8px 8px 0 #000, 0 0 90px rgba(180,140,255,0.55), inset 0 0 40px rgba(140,100,220,0.25); }
  }
  .panel.login h1 { color:#f0e0ff; text-shadow: 0 0 12px rgba(200,160,255,0.7); }
  .panel.login label { color:#c8b0e8; }
  .panel.login input {
    background:rgba(40,28,60,0.78); border-color:#6a4a96; color:#f0e0ff;
    box-shadow: inset 0 0 8px rgba(120,90,200,0.2);
  }
  .panel.login input:focus { border-color:#c8a0ff; box-shadow: 0 0 12px rgba(200,160,255,0.6); }
  .panel.login button {
    background:rgba(60,40,90,0.78); border-color:#8a6ac6; color:#f0e0ff;
    text-shadow: 0 0 6px rgba(180,140,240,0.5);
  }
  .panel.login button.primary {
    background:#a88adc; color:#1a1228; border-color:#d4b8ff;
    box-shadow: 0 0 16px rgba(180,140,255,0.6), 4px 4px 0 #000;
  }
  .panel.login button.primary:hover { background:#c8a8ff; box-shadow: 0 0 24px rgba(220,180,255,0.9), 4px 4px 0 #000; }
  .grade-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin:4px 0; }
  .grade-grid button { width:100%; margin:0; padding:10px 0; text-align:center; }
  .panel.login .grade-grid button.sel {
    background:#a88adc; color:#1a1228; border-color:#d4b8ff;
    box-shadow: 0 0 14px rgba(180,140,255,0.7), 2px 2px 0 #000;
  }
  .auth-msg { color:var(--warn); font-size:14px; min-height:1em; margin:8px 0 0;
    text-shadow:0 0 6px rgba(240,96,112,0.4); }
  .auth-switch { font-size:14px; color:#a89ac8; margin:10px 0 0; }
  .panel.login button.linkbtn {
    background:transparent; border:none; box-shadow:none; padding:0 4px;
    color:#d4b8ff; text-decoration:underline; font-size:15px;
    text-shadow:0 0 8px rgba(200,160,255,0.5);
  }
  .panel.login button.linkbtn:hover { background:transparent; color:#f0e0ff; }

  label { display:block; margin:10px 0 4px; font-size:14px; color:var(--muted); }
  input { width:100%; padding:8px 10px; background:#15151c; border:2px solid var(--border);
    color:var(--fg); font-family:'VT323', monospace; font-size:18px; }
  input:focus { border-color:var(--accent); outline:none; }
  button {
    padding:8px 16px; margin:4px 4px 4px 0; background:#15151c;
    border:2px solid var(--border); border-bottom-width:4px; border-right-width:4px;
    color:var(--fg); font-family:'VT323', monospace; font-size:18px; cursor:pointer;
  }
  button:hover { background:#1f1f28; border-color:var(--accent); }
  button:active { border-bottom-width:2px; border-right-width:2px; transform:translate(2px,2px); }
  button.primary { background:var(--accent); color:#0a0a10; border-color:#5dd886; font-weight:bold; }
  button.primary:hover { background:#5dd886; }
  .difficulty-card {
    border:2px solid var(--border); padding:14px; margin:8px 0; cursor:pointer; background:#15151c;
  }
  .difficulty-card.selected { border-color:var(--accent); background:#1a2a1f; }
  .difficulty-card ul { margin:4px 0; padding-left:20px; font-size:14px; color:var(--muted); }
  .lock-badge { display:inline-block; padding:2px 8px; background:var(--warn); color:#fff;
    font-size:11px; margin-left:8px; font-family:'Press Start 2P', monospace; }
  .keyboard-hint { font-size:14px; color:var(--muted); margin-top:8px; }

  /* HUD */
  #hud { position:fixed; top:0; left:0; right:0; padding:12px 16px;
    color:var(--fg); font-size:16px; pointer-events:none; z-index:5;
    text-shadow:2px 2px 0 #000; }
  #hud .row { display:flex; justify-content:space-between; }
  #hud .title { font-family:'Press Start 2P', monospace; font-size:11px; }
  #bottom-map {
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
    width:360px; height:160px; background:rgba(8,8,12,0.85);
    border:2px solid var(--border); border-bottom-width:4px; border-right-width:4px;
    padding:6px; z-index:5; pointer-events:none; color:var(--muted); font-size:12px;
  }
  #bottom-map .label { display:flex; justify-content:space-between; margin-bottom:4px; font-size:12px; }
  #bottom-map .canvas { position:relative; width:100%; height:calc(100% - 18px); background:#000;
    border:1px solid #1a1a22; overflow:hidden; }
  #bottom-map canvas { display:block; image-rendering:pixelated; }
  #gamepad-status { position:fixed; left:16px; bottom:16px; padding:4px 8px;
    background:rgba(8,8,12,0.85); border:2px solid var(--border);
    font-size:12px; color:var(--muted); z-index:5; pointer-events:none; }
  #gamepad-status.on { color:var(--accent); border-color:var(--accent); }
  #quit-btn {
    position:fixed; right:16px; bottom:16px; z-index:6; cursor:pointer;
    background:rgba(8,8,12,0.85); border:2px solid var(--border);
    border-bottom-width:4px; border-right-width:4px;
    color:var(--muted); font-family:'VT323', monospace; font-size:16px; padding:6px 14px;
  }
  #quit-btn:hover { color:var(--warn); border-color:var(--warn); }
  #interact-hint { position:fixed; left:50%; top:60%; transform:translateX(-50%);
    color:var(--accent); font-size:16px; pointer-events:none; z-index:4;
    text-shadow:2px 2px 0 #000; display:none;
    font-family:'VT323', monospace;
    background:rgba(0,0,0,0.7); padding:6px 14px; border:2px solid var(--accent); }
  #glitch-overlay { position:fixed; inset:0; pointer-events:none; z-index:3;
    background:transparent; mix-blend-mode:screen; }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%); }

  /* 토스트 알림 */
  #toast {
    position:fixed; left:50%; top:80px; transform:translateX(-50%);
    background:rgba(8,8,12,0.94); border:2px solid var(--accent);
    color:var(--accent); padding:12px 24px; z-index:6;
    font-family:'VT323', monospace; font-size:20px;
    box-shadow:4px 4px 0 #000; pointer-events:none;
    display:none; text-align:center; white-space:pre-line; max-width:80vw;
    line-height:1.4;
  }
  #toast.warn { border-color:var(--warn); color:var(--warn); }

  /* 열쇠 조각 인벤토리 */
  #key-inv {
    position:fixed; right:16px; top:80px;
    background:rgba(8,8,12,0.85); border:2px solid var(--accent);
    border-bottom-width:4px; border-right-width:4px;
    padding:8px 12px; z-index:5; pointer-events:none;
    font-family:'VT323', monospace; font-size:16px; color:var(--accent);
    display:none;
  }
  #key-inv .title { font-family:'Press Start 2P', monospace; font-size:9px; color:var(--muted); margin-bottom:4px; }
  #key-inv .frags { display:flex; flex-wrap:wrap; gap:4px; max-width:200px; }
  #key-inv .frag {
    width:18px; height:18px; background:#333; border:1px solid #555;
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  #key-inv .frag.got { background:#5a4020; border-color:#ffaa44; color:#ffe080; }

  .question-card { background:#15151c; border:2px solid var(--border); padding:20px; }
  .choices button { display:block; width:100%; text-align:left; margin:6px 0; }
  .hint-text { color:var(--accent); font-size:15px; margin-top:8px; }
  .status { font-size:15px; color:var(--muted); margin-top:12px; min-height:1em; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="interact-hint">[E] 조사하기</div>
<div id="glitch-overlay"></div>

<div id="photo-bg" style="display:none">
  <div class="photo-title">追憶 · 학 교</div>
  <div class="photo-tagline">잊혀진 기억의 학교에 어서오세요</div>
  <!-- 떠다니는 빛 파티클 -->
  <div class="dream-orb" style="left:8%; top:78%; width:14px; height:14px; animation: float1 9s infinite ease-out;"></div>
  <div class="dream-orb" style="left:18%; top:88%; width:8px; height:8px; animation: float2 11s infinite ease-out 1.5s;"></div>
  <div class="dream-orb" style="left:32%; top:82%; width:12px; height:12px; animation: float3 13s infinite ease-out 3s;"></div>
  <div class="dream-orb" style="left:48%; top:92%; width:10px; height:10px; animation: float1 10s infinite ease-out 4.5s;"></div>
  <div class="dream-orb" style="left:62%; top:80%; width:16px; height:16px; animation: float2 14s infinite ease-out 2s;"></div>
  <div class="dream-orb" style="left:74%; top:88%; width:7px; height:7px; animation: float3 12s infinite ease-out 5.5s;"></div>
  <div class="dream-orb" style="left:84%; top:84%; width:11px; height:11px; animation: float1 11s infinite ease-out 6s;"></div>
  <div class="dream-orb" style="left:92%; top:78%; width:9px; height:9px; animation: float2 13s infinite ease-out 0.5s;"></div>
  <div class="dream-orb" style="left:25%; top:94%; width:6px; height:6px; animation: float3 15s infinite ease-out 7s;"></div>
  <div class="dream-orb" style="left:55%; top:90%; width:13px; height:13px; animation: float1 12s infinite ease-out 8s;"></div>
  <svg class="photo-school" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.4">
    <line x1="0" y1="320" x2="800" y2="320" stroke-width="1.5"/>
    <polygon points="180,120 620,120 580,80 220,80"/>
    <rect x="200" y="120" width="400" height="200"/>
    <line x1="400" y1="120" x2="400" y2="320" stroke-width="1.2" opacity="0.5"/>
    <line x1="200" y1="220" x2="600" y2="220" stroke-width="1.2" opacity="0.5"/>
    <rect x="230" y="150" width="50" height="60"/>
    <rect x="310" y="150" width="50" height="60"/>
    <rect x="450" y="150" width="50" height="60"/>
    <rect x="530" y="150" width="50" height="60"/>
    <rect x="230" y="230" width="50" height="60"/>
    <rect x="310" y="230" width="50" height="60"/>
    <rect x="450" y="230" width="50" height="60"/>
    <rect x="530" y="230" width="50" height="60"/>
    <rect x="385" y="240" width="40" height="80"/>
    <polyline points="380,235 425,235 430,225 380,225"/>
    <circle cx="110" cy="270" r="50"/>
    <line x1="110" y1="320" x2="110" y2="280" stroke-width="3"/>
    <circle cx="700" cy="280" r="35"/>
    <line x1="700" y1="320" x2="700" y2="290" stroke-width="3"/>
    <line x1="660" y1="320" x2="660" y2="120" stroke-width="1.5"/>
    <path d="M660 120 L700 135 L660 150 Z" stroke-width="1.5"/>
    <circle cx="500" cy="60" r="22" opacity="0.4"/>
    <circle cx="500" cy="60" r="14" opacity="0.6"/>
  </svg>
  <div class="photo-date">19XX · 6월</div>
</div>

<div id="hud" style="display:none">
  <div class="row">
    <div>
      <div class="title" id="hud-title">학교 탐험</div>
      <div id="hud-progress" style="color:var(--muted)"></div>
    </div>
    <div style="text-align:right">
      <div class="title" id="hud-area">운동장</div>
      <div id="hud-diff" style="color:var(--muted)"></div>
    </div>
  </div>
</div>

<div id="bottom-map" style="display:none">
  <div class="label">
    <span id="bm-floor">1F</span>
    <span id="bm-progress"></span>
  </div>
  <div class="canvas"><canvas id="bm-canvas"></canvas></div>
</div>

<div id="gamepad-status" style="display:none">게임패드 미연결</div>

<button id="quit-btn" style="display:none">⏻ 종료</button>

<div id="key-inv">
  <div class="title">열쇠 조각 <span id="key-count">0/0</span></div>
  <div class="frags" id="key-frags"></div>
</div>

<div id="toast"></div>

<div id="overlay" class="overlay"><div class="panel" id="panel"></div></div>

<script>
"use strict";

// ──────────────────────────────────────────
// 난이도
// ──────────────────────────────────────────
const DIFFICULTY = {
  EASY: { label:"EASY", description:"스토리와 탐험 중심 난이도", recommended:"처음 플레이",
    features:["쉬운 문제","힌트 자주","공간 왜곡 약함","해설 자세히","이상 현상 적음","퍼즐 단순"],
    space_distortion:0.2, hint_frequency:1.0, anomaly_frequency:0.1,
    lighting_glitch_rate:0.05, phantom_rate:0.0, fog:0.0,
    question_difficulty:"easy" },
  NORMAL: { label:"NORMAL", description:"기본 권장", recommended:"기본 플레이",
    features:["일반 수준 문제","힌트 제한적","공간 왜곡 중간","복도 반복 연출","복합 퍼즐","분위기 강화"],
    space_distortion:0.5, hint_frequency:0.5, anomaly_frequency:0.4,
    lighting_glitch_rate:0.2, phantom_rate:0.1, fog:0.3,
    question_difficulty:"normal" },
  HARD: { label:"HARD", description:"심리적 긴장감 강화", recommended:"숙련자",
    features:["어려운 문제","힌트 최소","공간 왜곡 강함","복도 변경","조명 이상↑","방송 노이즈↑","환영↑","퍼즐 복잡","맵 변화"],
    extra:["음악 중단","문 위치 변경","뒤돌아보면 변화"],
    space_distortion:0.9, hint_frequency:0.15, anomaly_frequency:0.8,
    lighting_glitch_rate:0.6, phantom_rate:0.5, fog:0.55,
    question_difficulty:"hard" },
};

const PHASE = { LOGIN:0, SUBJECT:1, DIFFICULTY:2, COUNT:3, NEW_OR_CONTINUE:4, SCHOOL_ENTRY:5, EXPLORATION:6, PUZZLE:7 };

// 회원가입 때 선택하는 학년 (중1~고3) — 문제 수준과 분위기 난이도를 결정

const RECENT_LIMIT = 30;
function addRecent(q) {
  if (!q) return;
  if (q.question) {
    state.recent_questions.push(String(q.question));
    while (state.recent_questions.length > RECENT_LIMIT) state.recent_questions.shift();
  }
  if (Array.isArray(q.choices) && q.choices.length > 0) {
    const idx = Number(q.answer_index) || 0;
    if (q.choices[idx] != null) {
      state.recent_answers.push(String(q.choices[idx]));
      while (state.recent_answers.length > RECENT_LIMIT) state.recent_answers.shift();
    }
    state.recent_choice_sets.push(q.choices.map(String).join(" / "));
    while (state.recent_choice_sets.length > RECENT_LIMIT) state.recent_choice_sets.shift();
  }
}
function clearRecent() {
  state.recent_questions = [];
  state.recent_answers = [];
  state.recent_choice_sets = [];
}

function buildPrompt(grade, subject) {
  let avoid = "";
  if (state.recent_questions.length || state.recent_answers.length || state.recent_choice_sets.length) {
    avoid = "\n[중복 절대 금지]\n";
    if (state.recent_questions.length) {
      avoid += "아래 문제 본문과 의미·구조·소재가 같거나 비슷한 문제 금지:\n"
        + state.recent_questions.map(q => "- " + q).join("\n") + "\n";
    }
    if (state.recent_answers.length) {
      avoid += "아래 정답들과 본질적으로 같은 정답이 나오는 문제 금지:\n"
        + state.recent_answers.map(a => "- " + a).join("\n") + "\n";
    }
    if (state.recent_choice_sets.length) {
      avoid += "아래 보기 묶음 중 어떤 것과도 보기 단어·표현이 겹치면 안 됨:\n"
        + state.recent_choice_sets.map(c => "- " + c).join("\n") + "\n";
    }
    avoid += "위 목록과 완전히 다른 새 문제 1개만 출제.\n";
  }
  const angle = ANGLES[Math.floor(Math.random() * ANGLES.length)];
  const material = MATERIALS[Math.floor(Math.random() * MATERIALS.length)];
  const ans = ANS_POS[Math.floor(Math.random() * ANS_POS.length)];
  const nonce = Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e6).toString(36);
  const variation = `\n[변형 시드] ${nonce}\n[출제 각도] ${angle}\n[소재 성격] ${material}\n[정답 위치] ${ans}\n[필수] 직전 문제와 표현·소재·정답·보기 어느 것도 겹치지 말 것.\n`;

  return `[학년]\n${grade} (한국 교육과정 ${grade} 수준)\n\n[과목]\n${subject}\n\n[지시] 위 학년·과목의 한국 교육과정 범위 안에서 객관식 4지선다 문제 1개 출제. 난이도는 ${grade} 학생 수준에 정확히 맞춰라 — 그 학년이 배우지 않은 개념은 쓰지 말고, 너무 쉽지도 않게.\n${avoid}${variation}\n반드시 아래 JSON 한 덩어리만 출력 (코드블록 금지):\n{"question":"문제","choices":["a","b","c","d"],"answer_index":0,"explanation":"해설","hint":"힌트"}`;
}

async function requestQuestion(subject) {
  if (!canSpawnQuestion()) throw new Error("탐험 단계 이전 - 문제 생성 금지");
  const key = getApiKey();
  if (!key) return fallbackQuestion(subject);
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"x-api-key":key,"anthropic-version":"2023-06-01",
        "content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({
        model:"claude-opus-4-7",
        max_tokens:1024,
        temperature: 1.0,
        system: SYSTEM_PROMPT,
        messages:[{role:"user", content: buildPrompt(state.grade, subject)}]
      }),
    });
    if (!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    let t = j.content[0].text.trim();
    if (t.startsWith("```")) t = t.replace(/^```[a-z]*\n?/, "").replace(/```$/, "").trim();
    return JSON.parse(t);
  } catch(e) { console.warn("API 실패:", e); return fallbackQuestion(subject); }
}

// 과목+난이도별 출제 순번 - 풀 안의 모든 문제를 한 번씩 다 낼 때까지 반복 없음.
const bankRotation = {};
function pickFromBank(subject, difficulty) {
  const subj = QUESTION_BANK[subject] || QUESTION_BANK["수학"];
  const pool = subj[difficulty] || subj.NORMAL || [];
  if (!pool.length) return null;
  const key = subject + "|" + difficulty;
  // 순번이 비었으면 풀 전체를 새로 섞어 채운다 (한 바퀴 다 돌아야 재등장).
  if (!Array.isArray(bankRotation[key]) || bankRotation[key].length === 0) {
    const order = pool.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    bankRotation[key] = order;
  }
  const picked = pool[bankRotation[key].pop()];
  // 보기 셔플 - 매번 정답 위치가 달라지게.
  const indexed = picked.choices.map((c, i) => ({ c, isAnswer: i === picked.answer_index }));
  for (let i = indexed.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
  }
  const newChoices = indexed.map(o => o.c);
  const newAns = indexed.findIndex(o => o.isAnswer);
  return {
    question: picked.question,
    choices: newChoices,
    answer_index: newAns,
    explanation: picked.explanation,
    hint: picked.hint || "",
  };
}

function fallbackQuestion(subject) {
  return pickFromBank(subject, state.difficulty) || {
    question: `[${subject}] 문제 풀이 데이터가 부족합니다. API 키를 입력하면 새 문제가 생성됩니다.`,
    choices: ["계속","API 키 등록","로그아웃","무시"], answer_index: 0,
    explanation: "샘플 모드: 풍부한 문제를 원하면 로그인 화면에서 Anthropic API 키를 등록하세요.",
    hint: ""
  };
}

const overlay = document.getElementById("overlay");

function showOverlay(show, opts={}) {
  overlay.style.display = show ? "flex" : "none";
  hud.style.display = show ? "none" : "block";
  document.getElementById("bottom-map").style.display = show ? "none" : "block";
  document.getElementById("gamepad-status").style.display = show ? "none" : "block";

// ── 계정 저장 (localStorage) ──
function getAccounts() {
  try { return JSON.parse(localStorage.getItem("accounts") || "{}"); }
  catch (e) { return {}; }
}
function saveAccounts(a) { localStorage.setItem("accounts", JSON.stringify(a)); }
function setAuthMsg(m) { const el = document.getElementById("auth-msg"); if (el) el.textContent = m || ""; }

// 로그인 화면 - 기존 계정으로 입장
function renderLogin() {
  state.phase = PHASE.LOGIN;
  showOverlay(true, { photo:true });
  panel.className = "panel login";
  panel.innerHTML = `
    <h1>로 그 인</h1>
    <p style="font-size:14px;color:#c8b48a;letter-spacing:2px">오래된 학교의 기록을 다시 펼칩니다</p>
    <label>아이디</label>
    <input id="uid" placeholder="아이디" value="${state.userId}" />
    <label>비밀번호</label>
    <input type="password" id="pw" placeholder="비밀번호" />
    <p class="auth-msg" id="auth-msg"></p>
    <p><button class="primary" id="login-btn">로 그 인</button></p>
    <p class="auth-switch">처음이신가요? <button class="linkbtn" id="to-signup">회원가입</button></p>`;
  const doLogin = () => {
    const id = document.getElementById("uid").value.trim();
    const pw = document.getElementById("pw").value;
    if (!id) { setAuthMsg("아이디를 입력하세요."); return; }
    const accs = getAccounts();
    const acc = accs[id];
    if (!acc) { setAuthMsg("존재하지 않는 아이디입니다. 회원가입을 해주세요."); return; }
    if (acc.pw !== pw) { setAuthMsg("비밀번호가 일치하지 않습니다."); return; }
    state.userId = id;
    state.grade = acc.grade || "중1";
    state.difficulty = GRADE_DIFF[state.grade] || "NORMAL";
    setApiKey(acc.apiKey || "");
    advancePhase(PHASE.NEW_OR_CONTINUE); renderNewOrContinue();
  };
  document.getElementById("login-btn").onclick = doLogin;
  document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  document.getElementById("to-signup").onclick = renderSignup;
  document.getElementById("uid").focus();
}

// 회원가입 화면 - 새 계정 만들기 (아이디·비밀번호·학년)
function renderSignup() {
  state.phase = PHASE.LOGIN;
  showOverlay(true, { photo:true });
  panel.className = "panel login";
  const grades = GRADES.map(g =>
    `<button class="grade-btn ${state.grade === g ? "sel" : ""}" data-g="${g}">${g}</button>`).join("");
  panel.innerHTML = `
    <h1>회 원 가 입</h1>
    <p style="font-size:14px;color:#c8b48a;letter-spacing:2px">학년을 정하고 학교의 기록에 이름을 올립니다</p>
    <label>아이디</label>
    <input id="uid" placeholder="사용할 아이디" value="${state.userId}" />
    <label>비밀번호</label>
    <input type="password" id="pw" placeholder="비밀번호" />
    <label>학년 (중1 ~ 고3)</label>
    <div class="grade-grid">${grades}</div>
    <label>Anthropic API Key (선택)</label>
    <input type="password" id="api" placeholder="sk-ant-... (비우면 샘플 문제)" value="${getApiKey()}" />
    <p style="font-size:13px;color:#a89ac8;margin:10px 0 0;line-height:1.5">
      · 과목은 입장할 때마다 무작위로 정해집니다.<br>
      · 모아야 할 열쇠 개수도 무작위입니다 (문제 1개 = 열쇠 1개).</p>
    <p class="auth-msg" id="auth-msg"></p>
    <p><button class="primary" id="signup-btn">가 입 하 고 입 장</button></p>
    <p class="auth-switch">이미 계정이 있나요? <button class="linkbtn" id="to-login">로그인</button></p>`;
  panel.querySelectorAll(".grade-btn").forEach(b => {
    b.onclick = () => {
      state.grade = b.dataset.g;
      panel.querySelectorAll(".grade-btn").forEach(x => x.classList.toggle("sel", x.dataset.g === state.grade));
    };
  });
  document.getElementById("signup-btn").onclick = () => {
    const id = document.getElementById("uid").value.trim();
    const pw = document.getElementById("pw").value;
    if (!id) { setAuthMsg("아이디를 입력하세요."); return; }
    if (!pw) { setAuthMsg("비밀번호를 입력하세요."); return; }
    const accs = getAccounts();
    if (accs[id]) { setAuthMsg("이미 사용 중인 아이디입니다. 다른 아이디를 쓰거나 로그인하세요."); return; }
    const api = document.getElementById("api").value.trim();
    accs[id] = { pw, grade: state.grade, apiKey: api };
    saveAccounts(accs);
    state.userId = id;
    state.difficulty = GRADE_DIFF[state.grade] || "NORMAL";
    setApiKey(api);
    advancePhase(PHASE.NEW_OR_CONTINUE); renderNewOrContinue();
  };
  document.getElementById("to-login").onclick = renderLogin;
  document.getElementById("uid").focus();
}

function rollGameParams() {
  state.subject = SUBJECTS[Math.floor(Math.random() * SUBJECTS.length)];
  state.difficulty = GRADE_DIFF[state.grade] || "NORMAL";
}

// 진행 상황 저장 (스테이지 + 스테이지 내부 진행까지 - 이어하기로 그대로 재개)
function saveGame() {
  if (!state.userId) return;
  localStorage.setItem("save_" + state.userId, JSON.stringify({
    grade: state.grade, subject: state.subject, difficulty: state.difficulty,
    stage: state.stage, solved: state.solved,
    fragments: state.keyFragments.length, total: state.totalRequired,
    floor: state.currentFloor,
    px: player.x, py: player.y,            // 마지막 위치 - 그 자리에서 재개
    recent: state.recent_questions.slice(-40),  // 최근 문제 - 이어하기 후에도 중복 방지
  }));
}

function renderQuitConfirm() {
  if (!state.userId) return;

function renderNewOrContinue() {
  showOverlay(true);
  panel.className = "panel";
  const hasSave = !!localStorage.getItem("save_" + state.userId);
  panel.innerHTML = `<h1>${state.userId} 님, 어서오세요</h1>
    <p style="font-size:16px">무엇을 하시겠습니까?</p>
    <p>
      <button class="primary" id="new-btn">★ 새 게 임</button>
      <button id="cont-btn" ${hasSave?"":"disabled"}>이어하기</button>
    </p>
    <p><button id="howto-btn">하는 법 보기</button><button id="logout-btn">← 로그아웃</button></p>`;
  document.getElementById("new-btn").onclick = renderHowToPlay;
  document.getElementById("cont-btn").onclick = () => {
    const saved = localStorage.getItem("save_" + state.userId);
    let ok = false;
    state.pendingResume = null;
    if (saved) {
      try {
        const s = JSON.parse(saved);
        if (s.grade) state.grade = s.grade;
        if (s.stage) state.stage = Math.min(state.maxStage, Math.max(1, s.stage));  // 저장된 스테이지부터 재개
        state.difficulty = GRADE_DIFF[state.grade] || s.difficulty || "NORMAL";
        if (s.subject) state.subject = s.subject;
        if (Array.isArray(s.recent)) state.recent_questions = s.recent.slice(-40);  // 최근 문제 복원 (중복 방지 유지)
        state.pendingResume = s;   // 스테이지 내부 진행(열쇠·위치)은 initGame 에서 복원
        ok = true;
      } catch(e) {}
    }
    if (!ok || !state.subject) rollGameParams();
    enterSchool();
  };
  document.getElementById("howto-btn").onclick = renderHowToPlay;
  document.getElementById("logout-btn").onclick = () => { state.userId = ""; advancePhase(PHASE.LOGIN); renderLogin(); };
}

function enterSchool() {
  advancePhase(PHASE.SCHOOL_ENTRY);
  advancePhase(PHASE.EXPLORATION);
  showOverlay(false);
  initGame();
}

// ──────────────────────────────────────────
// 2D 픽셀 게임
// ──────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const off = document.createElement("canvas");
const offCtx = off.getContext("2d");
offCtx.imageSmoothingEnabled = false;

const TILE = 64;        // 타일 해상도 (픽셀을 더 잘게: 32→64, 출력 1배)
const SCALE = 1;        // 화면 픽셀 / 소스 픽셀
const T_SCREEN = TILE * SCALE;

// 타일 종류
const TILE_VOID=0, TILE_GRASS=1, TILE_SAND=2, TILE_FLOOR=3, TILE_WALL=4,
      TILE_LOCKER=5, TILE_LOCKER_GLOW=6, TILE_DESK=7, TILE_DOOR=8,
      TILE_CHALK=9, TILE_BATH=10, TILE_PUDDLE=11, TILE_MIRROR=12,
      TILE_TOILET=13, TILE_SINK=14, TILE_STAIRS_UP=15, TILE_STAIRS_DOWN=16,
      TILE_PULLUP=17, TILE_FENCE=18, TILE_TRACK=19, TILE_GOAL=20,
      TILE_BENCH=21, TILE_ENTRANCE=22, TILE_LOCKED_DOOR=23,
      // 장식 타일 (교실/복도/중앙홀 꾸미기)
      TILE_WINDOW=24, TILE_BOOKSHELF=25, TILE_PLANT=26, TILE_BOARD=27,
      TILE_CLOCK=28, TILE_PODIUM=29, TILE_PAPER=30, TILE_VENDING=31,
      TILE_FOUNTAIN=32, TILE_EXTING=33, TILE_STATUE=34, TILE_RUG=35,
      TILE_INFODESK=36, TILE_MARBLE=37, TILE_PILLAR=38, TILE_TROPHY=39,
      // 복도 원목 벽/문 (레퍼런스 스타일)
      TILE_WOODWALL=40, TILE_WOODDOOR=41;

// 충돌 가능한 타일 (DOOR, PUDDLE, BENCH, GOAL, PAPER, RUG 는 통과 가능)
const SOLID = new Set([TILE_VOID, TILE_WALL, TILE_LOCKER, TILE_LOCKER_GLOW,
  TILE_DESK, TILE_CHALK, TILE_MIRROR, TILE_TOILET,
  TILE_SINK, TILE_PULLUP, TILE_FENCE, TILE_LOCKED_DOOR,
  TILE_WINDOW, TILE_BOOKSHELF, TILE_PLANT, TILE_BOARD, TILE_CLOCK,
  TILE_PODIUM, TILE_VENDING, TILE_FOUNTAIN, TILE_EXTING, TILE_STATUE,
  TILE_INFODESK, TILE_PILLAR, TILE_TROPHY, TILE_WOODWALL, TILE_WOODDOOR]);

// 바닥 위에 얹히는 장식물 - 바닥을 먼저 깔고 그 위에 그림
const OVERLAY_TILES = new Set([TILE_DESK, TILE_PLANT, TILE_PAPER, TILE_PODIUM,
  TILE_BENCH, TILE_STATUE, TILE_INFODESK, TILE_PILLAR, TILE_VENDING,
  TILE_PUDDLE, TILE_RUG]);

const MAP_W = 50, MAP_H = 32;
let map1, map2;
const triggers = []; // {tx, ty, floor, type, label, used}
const stairLinks = []; // {tx, ty, floor, target:{floor,tx,ty}}

// 플레이어 (월드 픽셀)
const player = {
  x: 25 * TILE + TILE/2,
  y: 22 * TILE + TILE/2,
  dir: 'up',
  speed: 440,  // 타일 64px에 맞춰 월드픽셀/초 비례 - 체감 속도 동일
  size: 12,    // 64px 타일 대비 작은 충돌 박스 → 통로 잘 통과
};

// ──────────────────────────────────────────
// 타일 스프라이트 (32x32 픽셀, 캔버스에 직접 그림)
// ──────────────────────────────────────────
const sprites = {};
const floorVariants = [];      // 회청색 마룻바닥 (복도)
const classFloorVariants = []; // 따뜻한 원목 마룻바닥 (교실 - 레퍼런스 스타일)
const marbleVariants = [];     // 대리석 바닥 변형 (중앙홀, 체크무늬)
// 기존 32px 아트를 64 타일에 2배로 그림 (호환 - 출력은 종전과 동일)
function makeSprite(drawFn) {
  const c = document.createElement("canvas");
  c.width = TILE; c.height = TILE;
  const cx = c.getContext("2d");
  cx.imageSmoothingEnabled = false;
  cx.save(); cx.scale(2, 2); drawFn(cx); cx.restore();
  return c;
}
// 네이티브 64px 아트 (픽셀을 더 잘게 - 바닥/벽/플레이어 등 큰 면)
function makeSpriteHi(drawFn) {
  const c = document.createElement("canvas");
  c.width = TILE; c.height = TILE;
  const cx = c.getContext("2d");
  cx.imageSmoothingEnabled = false;
  drawFn(cx);
  return c;
}
// 픽셀 찍기 헬퍼
function P(cx, color, x, y, w, h) {
  cx.fillStyle = color;
  cx.fillRect(x, y, w == null ? 1 : w, h == null ? 1 : h);
}
// 구형 16px 스프라이트를 확대해 쓰는 래퍼 (현재 스테이지에서 안 쓰는 타일용)
function makeLegacySprite(drawFn) {
  return makeSprite(cx => { cx.save(); cx.scale(2, 2); drawFn(cx, 16); cx.restore(); });
}

function buildSprites() {
  // ── 기본 바닥/벽 (다른 스프라이트의 베이스가 되므로 가장 먼저) ──

  // 복도 바닥 - 매끈한 회청색 비닐장판, 64px 세밀
  function drawVinyl(cx, seed) {
    P(cx,"#565c6a",0,0,64,64);
    P(cx,"#5e6472",0,0,64,1);                      // 미세한 반사 띠
    P(cx,"#4c5160",0,63,64,1);
    // 큰 장판 줄눈 (아주 옅게, 타일 경계)
    P(cx,"#4e5462",(seed%2)*32,0,1,64);
    P(cx,"#525868",0,(seed%2)*32,64,1);
    // 은은한 광택 / 얼룩
    P(cx,"rgba(255,255,255,0.05)",10,12,28,14);
    P(cx,"rgba(0,0,0,0.05)",36+(seed*7)%10,38,18,12);
    // 미세 점박이 (1px = 더 잘게)
    const dots = [[14,44],[44,18],[26,28],[52,50],[8,34],[58,12],[34,56],[20,8],[48,36],[12,22]];
    dots.forEach(([x,y],i)=>P(cx, i%2 ? "#505664" : "#606676", (x+seed*3)%62, (y+seed*5)%62, 1,1));
  }
  floorVariants.length = 0;
  floorVariants.push(
    makeSpriteHi(cx => drawVinyl(cx, 0)),
    makeSpriteHi(cx => drawVinyl(cx, 1)),
    makeSpriteHi(cx => drawVinyl(cx, 2)),
    makeSpriteHi(cx => drawVinyl(cx, 3))
  );
  sprites[TILE_FLOOR] = floorVariants[0];

  // 따뜻한 원목 마룻바닥 (교실) - 64px 세밀, 가로 판자
  function drawWarmFloor(cx, seed) {
    P(cx,"#5c4632",0,0,64,64);
    for (let i = 0; i < 4; i++) {
      const y = i * 16;
      P(cx,"#96704c",0,y,64,14);                   // 판자 본면
      P(cx,"#a87e56",0,y,64,1);                    // 윗면 하이라이트
      P(cx,"#8a6440",0,y+1,64,1);                  // 부드러운 결
      P(cx,"#6e5236",0,y+14,64,2);                 // 판자 사이 틈
      const off = ((i + seed) % 2) * 32 + 16;      // 이음새 엇갈림
      P(cx,"#6e5236",off,y,1,14);
      // 나뭇결 (가는 줄 여러개)
      P(cx,"#876446",(seed*7+i*11)%44+4, y+5, 14,1);
      P(cx,"#9e7850",(seed*13+i*5)%40+8, y+9, 10,1);
      P(cx,"#82603e",(seed*5+i*7)%48+6, y+12, 8,1);
    }
  }
  classFloorVariants.length = 0;
  classFloorVariants.push(
    makeSpriteHi(cx => drawWarmFloor(cx, 0)),
    makeSpriteHi(cx => drawWarmFloor(cx, 1)),
    makeSpriteHi(cx => { drawWarmFloor(cx, 2);
      P(cx,"#6e5236",12,20,24,1); P(cx,"#6e5236",34,22,14,1);  // 긁힌 자국
    }),
    makeSpriteHi(cx => { drawWarmFloor(cx, 1);
      P(cx,"rgba(40,26,14,0.28)",34,34,22,18);                 // 햇빛 닳은 얼룩
    })
  );

  // 대리석 바닥 (중앙홀) - 밝음/어두움 체크무늬, 64px 세밀
  function drawMarble(cx, light) {
    const base = light ? "#4a4a5a" : "#3a3a48";
    P(cx, base, 0,0,64,64);
    P(cx, light ? "#565666" : "#444452", 0,0,64,1);
    P(cx, light ? "#565666" : "#444452", 0,0,1,64);
    P(cx,"#2a2a36",63,0,1,64); P(cx,"#2a2a36",0,63,64,1);
    // 대리석 결 (가는 사선 줄무늬 - 여러 갈래)
    const vein = light ? "#5c5c6e" : "#46465a";
    P(cx, vein, 8,12,22,1); P(cx, vein, 16,15,26,1); P(cx, vein, 36,18,18,1);
    P(cx, vein, 12,38,18,1); P(cx, vein, 24,41,30,1); P(cx, vein, 40,54,20,1);
    const vein2 = light ? "#525262" : "#404052";
    P(cx, vein2, 28,26,26,1); P(cx, vein2, 4,50,22,1); P(cx, vein2, 44,8,14,1);
    // 잔결 (더 가늘게)
    const vein3 = light ? "#54546a" : "#42425a";
    P(cx, vein3, 10,28,8,1); P(cx, vein3, 50,44,10,1); P(cx, vein3, 32,48,12,1);
    P(cx, vein3, 18,6,9,1); P(cx, vein3, 6,20,7,1);
  }
  marbleVariants.length = 0;
  marbleVariants.push(
    makeSpriteHi(cx => drawMarble(cx, true)),
    makeSpriteHi(cx => drawMarble(cx, false))
  );
  sprites[TILE_MARBLE] = marbleVariants[0];

  // 벽 - 패널 + 몰딩 + 굽도리
  sprites[TILE_WALL] = makeSprite(cx => {
    P(cx,"#3e3e4a",0,0,32,32);
    P(cx,"#5a5a68",0,0,32,3);                      // 천장 몰딩
    P(cx,"#4a4a58",0,3,32,1);
    // 벽 패널 가로선
    P(cx,"#34343e",0,11,32,1); P(cx,"#34343e",0,21,32,1);
    // 패널 세로선 (벽돌처럼 엇갈림)
    P(cx,"#34343e",16,4,1,7); P(cx,"#34343e",8,12,1,9); P(cx,"#34343e",24,12,1,9);
    P(cx,"#34343e",16,22,1,6);
    // 미세한 얼룩
    P(cx,"#383844",4,7,3,1); P(cx,"#444452",20,16,4,1);
    // 굽도리(베이스보드)
    P(cx,"#2c2c36",0,28,32,4);
    P(cx,"#383844",0,28,32,1);
    P(cx,"#1a1a24",0,31,32,1);
  });

  sprites[TILE_VOID] = makeSprite(cx => { P(cx,"#0a0a14",0,0,32,32); });

  // ── 사물함 (단서 사물함은 빛이 새어나옴) ──
  sprites[TILE_LOCKER] = makeSprite(cx => drawLocker(cx, false));
  sprites[TILE_LOCKER_GLOW] = makeSprite(cx => drawLocker(cx, true));

  // ── 책상 (의자 + 교과서 + 공책) ──
  // 책상 - 레퍼런스 스타일: 위에서 본 원목 책상 + 아래 의자, 칠판(북쪽)을 향함

function makeEmptyMap(fill) {
  const m = [];
  for (let r = 0; r < MAP_H; r++) {
    const row = [];
    for (let c = 0; c < MAP_W; c++) row.push(fill);
    m.push(row);
  }
  return m;
}
function fillRect(m, x1, y1, x2, y2, tile) {
  for (let r = y1; r <= y2; r++) for (let c = x1; c <= x2; c++)
    if (r >= 0 && r < MAP_H && c >= 0 && c < MAP_W) m[r][c] = tile;
}
function rectBorder(m, x1, y1, x2, y2, tile) {
  for (let c = x1; c <= x2; c++) { m[y1][c] = tile; m[y2][c] = tile; }
  for (let r = y1; r <= y2; r++) { m[r][x1] = tile; m[r][x2] = tile; }
}

// 교실 5종 구조 변형
function buildClassroomVariant(m, yOffset, cStart, variant) {
  // variant 0: 표준 줄 책상 (4개)
  // variant 1: 원형 배치 (벽 따라)
  // variant 2: 흐트러진 배치 (혼돈)
  // variant 3: 미술실 (책상 + 칠판 이젤)
  // variant 4: 과학실 (긴 실험대)
  const r2 = yOffset;
  if (variant === 0) {
    // 줄 - 2x2
    for (let r = 4; r <= 6; r += 2)
      for (let c = cStart+2; c <= cStart+6; c += 2)
        m[r+r2][c] = TILE_DESK;
  } else if (variant === 1) {
    // 원형 (가장자리)
    m[3+r2][cStart+2] = TILE_DESK; m[3+r2][cStart+6] = TILE_DESK;
    m[7+r2][cStart+2] = TILE_DESK; m[7+r2][cStart+6] = TILE_DESK;
    m[5+r2][cStart+1] = TILE_DESK; m[5+r2][cStart+7] = TILE_DESK;
  } else if (variant === 2) {
    // 혼돈 - 흩어진 배치
    m[3+r2][cStart+4] = TILE_DESK;
    m[4+r2][cStart+2] = TILE_DESK;
    m[5+r2][cStart+5] = TILE_DESK;
    m[6+r2][cStart+3] = TILE_DESK;
    m[7+r2][cStart+6] = TILE_DESK;
    m[7+r2][cStart+1] = TILE_DESK;
  } else if (variant === 3) {
    // 미술실 - 이젤(칠판)이 가운데에
    m[4+r2][cStart+3] = TILE_CHALK;
    m[4+r2][cStart+5] = TILE_CHALK;
    m[6+r2][cStart+2] = TILE_CHALK;
    m[6+r2][cStart+6] = TILE_CHALK;
    m[5+r2][cStart+4] = TILE_DESK;
  } else if (variant === 4) {
    // 과학실 - 긴 실험대 2줄
    for (let c = cStart+2; c <= cStart+6; c++) m[4+r2][c] = TILE_DESK;
    for (let c = cStart+2; c <= cStart+6; c++) m[7+r2][c] = TILE_DESK;
  }
}

const gamepadState = { connected:false, prevButtons:{} };
window.addEventListener("gamepadconnected", e => {
  gamepadState.connected = true;
  const el = document.getElementById("gamepad-status");
  el.textContent = "🎮 " + e.gamepad.id; el.classList.add("on");
});
window.addEventListener("gamepaddisconnected", () => {
  gamepadState.connected = false;
  const el = document.getElementById("gamepad-status");
  el.textContent = "게임패드 미연결"; el.classList.remove("on");
});

function pollGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let lx=0, ly=0, interact=false;
  const dz = 0.18;
  for (const p of pads) {
    if (!p) continue;
    lx += Math.abs(p.axes[0]||0) < dz ? 0 : p.axes[0];
    ly += Math.abs(p.axes[1]||0) < dz ? 0 : p.axes[1];
    for (const i of [0,1,2,3,5,7]) {
      const b = p.buttons[i]; if (!b) continue;
      const key = `${p.index}_${i}`;
      const was = gamepadState.prevButtons[key];
      if (b.pressed && !was) interact = true;
      gamepadState.prevButtons[key] = b.pressed;
    }
  }
  return { lx, ly, interact };
}

function isSolidAt(map, wx, wy) {
  const tx = Math.floor(wx / TILE), ty = Math.floor(wy / TILE);
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return true;
  return SOLID.has(map[ty][tx]);
}

function tryMove(dx, dy) {
  const m = currentMap();
  const r = player.size;
  // X
  const newX = player.x + dx;
  if (!isSolidAt(m, newX - r, player.y - r) &&
      !isSolidAt(m, newX + r, player.y - r) &&
      !isSolidAt(m, newX - r, player.y + r) &&
      !isSolidAt(m, newX + r, player.y + r)) {
    player.x = newX;
  }
  // Y
  const newY = player.y + dy;
  if (!isSolidAt(m, player.x - r, newY - r) &&
      !isSolidAt(m, player.x + r, newY - r) &&
      !isSolidAt(m, player.x - r, newY + r) &&
      !isSolidAt(m, player.x + r, newY + r)) {
    player.y = newY;
  }
  // 운동장 / 화장실 입구의 ENTRANCE / DOOR 는 통과 (solid 아님)
  // 계단 자동 트리거
  checkStairAuto();
}

function checkStairAuto() {
  const tx = Math.floor(player.x / TILE), ty = Math.floor(player.y / TILE);
  const tile = currentMap()[ty][tx];
  if (tile === TILE_STAIRS_UP || tile === TILE_STAIRS_DOWN) {
    const link = stairLinks.find(s => s.floor === state.currentFloor && s.tx === tx && s.ty === ty);
    if (link) {
      state.currentFloor = link.target.floor;
      player.x = link.target.tx * TILE + TILE/2;
      // 항상 계단 남쪽(row+1) = 복도 바닥에 떨어진다.
      // 북쪽(row-1)은 1F에서 사물함 줄이라 끼임 발생.
      player.y = (link.target.ty + 1) * TILE + TILE/2;
    }
  }
}

function tryInteract() {
  if (state.phase !== PHASE.EXPLORATION) return;
  const tx = Math.floor(player.x / TILE), ty = Math.floor(player.y / TILE);
  const m = currentMap();
  // 1) 인접 잠긴 문 검사
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const nx = tx + dx, ny = ty + dy;
      if (ny < 0 || ny >= MAP_H || nx < 0 || nx >= MAP_W) continue;
      const t = m[ny][nx];
      if (t === TILE_LOCKED_DOOR) {
        showToast(`잠긴 정문 — 열쇠 조각 ${state.keyFragments.length}/${state.totalRequired}`, { warn: true });
        return;
      }
    }
  }
  // 2) 트리거 검사
  for (const t of triggers) {
    if (t.used) continue;
    if (t.floor !== state.currentFloor) continue;
    const d = Math.max(Math.abs(t.tx - tx), Math.abs(t.ty - ty));
    if (d <= 1) {
      t.used = true; openPuzzle(t); return;
    }
  }
}

// 학교 내부 진입 감지 → 정문 자동 잠금
function checkEnterAndEscape() {
  if (state.phase !== PHASE.EXPLORATION) return;
  if (!state.exitUnlocked) return;
  const tx = Math.floor(player.x / TILE);
  const ty = Math.floor(player.y / TILE);
  // 스테이지 출구 타일 중 하나에 도달했는가?
  const onExit = stageExitDoors.some(d => d.tx === tx && d.ty === ty);
  if (!onExit) return;
  // renderEnd 가 마지막/중간 스테이지를 알아서 분기 처리.
  renderEnd();
}

// ──────────────────────────────────────────
// 이상 현상
// ──────────────────────────────────────────
let lastAnomaly = 0;
let phantomActive = null; // {x, y, life}
let lightingDim = 0;      // 0 ~ 1 (currently dimming)
let lightingDimTimer = 0;

function updateAnomalies(dt) {
  const d = cfg();
  // 조명 회복
  if (lightingDim > 0) {
    lightingDimTimer -= dt;
    if (lightingDimTimer <= 0) lightingDim = 0;
  }
  // 환영 회복
  if (phantomActive) {
    phantomActive.life -= dt;
    if (phantomActive.life <= 0) phantomActive = null;
  }
  // 새 이상 현상
  if (Math.random() < d.lighting_glitch_rate * dt * 0.3) {
    lightingDim = 0.3 + Math.random() * 0.4;
    lightingDimTimer = 0.15 + Math.random() * 0.2;
  }
  if (Math.random() < d.phantom_rate * dt * 0.15) {
    // 플레이어 근처 랜덤 위치 (타일 크기에 비례)
    phantomActive = {
      x: player.x + (Math.random() - 0.5) * TILE * 12,
      y: player.y + (Math.random() - 0.5) * TILE * 12,
      life: 0.6 + Math.random() * 0.4,
    };
  }
  if (Math.random() < d.anomaly_frequency * dt * 0.05) {
    const ov = document.getElementById("glitch-overlay");
    ov.style.background = "rgba(220,80,80,0.08)";
    setTimeout(() => ov.style.background = "transparent", 200);
  }
}

// 렌더링
// ──────────────────────────────────────────
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  off.width = Math.ceil(canvas.width / SCALE);
  off.height = Math.ceil(canvas.height / SCALE);
}
window.addEventListener("resize", resizeCanvas);

function render() {
  const w = off.width, h = off.height;
  offCtx.fillStyle = "#000";
  offCtx.fillRect(0, 0, w, h);

  // 카메라 (플레이어 중앙) - 흔들림 없음
  const camX = player.x - w / 2;
  const camY = player.y - h / 2;

  const map = currentMap();
  const startC = Math.max(0, Math.floor(camX / TILE));
  const endC = Math.min(MAP_W, Math.ceil((camX + w) / TILE) + 1);
  const startR = Math.max(0, Math.floor(camY / TILE));
  const endR = Math.min(MAP_H, Math.ceil((camY + h) / TILE) + 1);

  // 스테이지별 색조 필터 - 교실/복도가 스테이지마다 한눈에 다르게 보이게.
  const isCentral = stageCfg().zone === "central";
  const isClassroom = stageCfg().zone === "classroom";
  // 교실은 따뜻한 원목, 복도는 회청색 마룻바닥
  const woodSet = isClassroom ? classFloorVariants : floorVariants;
  const woodAt = (r, c) => woodSet[(r * 31 + c * 17) % woodSet.length];
  // 스테이지 색감은 캔버스 CSS 필터(GPU)로 처리 - 여기서 2D 필터를 쓰면 고해상도에서 심하게 느려짐
  for (let r = startR; r < endR; r++) {
    for (let c = startC; c < endC; c++) {
      const tile = map[r][c];
      const fdx = Math.floor(c * TILE - camX);
      const fdy = Math.floor(r * TILE - camY);
      // 바닥은 위치에 따라 변형 스프라이트 사용 (단조로움 제거)
      let sp;
      if (tile === TILE_FLOOR) sp = woodAt(r, c);
      else if (tile === TILE_MARBLE) sp = marbleVariants[(r + c) % 2];   // 체크무늬
      else sp = sprites[tile];
      if (!sp) continue;
      // 바닥 위 장식물(책상/화분/종이 등)은 바닥을 먼저 깔고 그 위에 그림
      if (OVERLAY_TILES.has(tile)) {
        const base = isCentral ? marbleVariants[(r + c) % 2] : woodAt(r, c);
        offCtx.drawImage(base, fdx, fdy);
      }
      offCtx.drawImage(sp, fdx, fdy);
    }
  }

  // 트리거 마커 (아직 안 푼 것만 반짝임 - 풀었거나 이미 출구가 열렸으면 표시 안 함)
  for (const t of triggers) {
    if (state.exitUnlocked) break;   // 열쇠 다 모음 → 남은 트리거 반짝임 모두 끔
    if (t.used) continue;
    if (t.floor !== state.currentFloor) continue;
    const wx = t.tx * TILE + TILE/2, wy = t.ty * TILE + TILE/2;
    const dx = Math.floor(wx - camX), dy = Math.floor(wy - camY);
    // 작은 별/반짝임
    const blink = (Date.now() / 280) % 2 < 1;      // 깜빡임도 느긋하게
    if (blink) {
      offCtx.fillStyle = "#d8c88e";
      offCtx.fillRect(dx - 1, dy - 27, 4, 4);
      offCtx.fillStyle = "#e8dcae";
      offCtx.fillRect(dx - 4, dy - 26, 2, 2);
      offCtx.fillRect(dx + 4, dy - 26, 2, 2);
      offCtx.fillRect(dx, dy - 31, 2, 2);
      offCtx.fillRect(dx, dy - 22, 2, 2);
    }
  }

  // 환영
  if (phantomActive && phantomSprite) {
    const dx = Math.floor(phantomActive.x - camX) - TILE/2;
    const dy = Math.floor(phantomActive.y - camY) - TILE/2;
    offCtx.globalAlpha = Math.min(1, phantomActive.life * 1.5);
    offCtx.drawImage(phantomSprite, dx, dy);
    offCtx.globalAlpha = 1;
  }

  // 플레이어
  const pSp = playerSprites[player.dir];
  if (pSp) {
    const dx = Math.floor(player.x - camX) - TILE/2;
    const dy = Math.floor(player.y - camY) - TILE/2;
    offCtx.drawImage(pSp, dx, dy);
  }

  // 안개 (난이도별) - 그라데이션은 캐시 (매 프레임 생성하면 고해상도에서 느림)
  const fog = cfg().fog;
  if (fog > 0) {
    if (!fogCache || fogCache.w !== w || fogCache.h !== h || fogCache.fog !== fog) {
      const grd = offCtx.createRadialGradient(w/2, h/2, 20, w/2, h/2, Math.max(w, h)*0.6);
      grd.addColorStop(0, "rgba(0,0,0,0)");
      grd.addColorStop(1, `rgba(8,4,16,${fog})`);
      fogCache = { w, h, fog, grd };
    }
    offCtx.fillStyle = fogCache.grd;
    offCtx.fillRect(0, 0, w, h);
  }

  // 몽환적 색감 (스테이지 별 톤) + 시간에 따른 미세한 색조 펄스
  const pulse = 0.85 + 0.15 * Math.sin(Date.now() / 1500);
  const stageOverlay = stageCfg().overlay;
  offCtx.globalAlpha = pulse;
  offCtx.fillStyle = stageOverlay;
  offCtx.fillRect(0, 0, w, h);
  offCtx.globalAlpha = 1;

  // 조명 깜빡임 (이상 현상)
  if (lightingDim > 0) {
    offCtx.fillStyle = `rgba(0,0,0,${lightingDim})`;
    offCtx.fillRect(0, 0, w, h);
  }

  // 먼지 입자
  offCtx.fillStyle = "rgba(200,180,255,0.45)";
  for (let i = 0; i < 22; i++) {
    const x = Math.floor(((Date.now() / 80 + i * 137) % w));
    const y = Math.floor(((Date.now() / 100 + i * 73) % h));
    offCtx.fillRect(x, y, 1, 1);
  }
  // 떠다니는 몽환 오브 (천천히) - 미리 만든 글로우 스프라이트를 위치만 옮겨 blit (그라데이션 매 프레임 생성 안 함)
  const now2 = Date.now() / 1000;
  offCtx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 6; i++) {
    const t = now2 + i * 1.7;
    const ox = (Math.sin(t * 0.3 + i) * 0.45 + 0.5) * w;
    const oy = (Math.cos(t * 0.25 + i * 1.3) * 0.4 + 0.5) * h;
    const sc2 = 0.8 + 0.25 * Math.sin(t + i);
    const sp = orbSprites[i % orbSprites.length];
    const d = sp.width * sc2;
    offCtx.drawImage(sp, ox - d/2, oy - d/2, d, d);
  }
  offCtx.globalCompositeOperation = "source-over";

  // 화면에 업스케일
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(off, 0, 0, off.width, off.height, 0, 0, canvas.width, canvas.height);
}

// ──────────────────────────────────────────
// HUD + 미니맵
// ──────────────────────────────────────────
const bmCanvas = document.getElementById("bm-canvas");
const bmCtx = bmCanvas.getContext("2d");
bmCtx.imageSmoothingEnabled = false;

function renderMinimap() {
  const w = 360 - 12, h = 160 - 30;
  bmCanvas.width = w; bmCanvas.height = h;
  const m = currentMap();
  const sx = w / MAP_W, sy = h / MAP_H;
  bmCtx.fillStyle = "#0a0a14";
  bmCtx.fillRect(0, 0, w, h);
  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      const t = m[r][c];
      let col = null;
      if (t === TILE_GRASS) col = "#2c3820";
      else if (t === TILE_SAND) col = "#c8a878";
      else if (t === TILE_FLOOR || t === TILE_PAPER || t === TILE_PUDDLE) col = "#3a3a42";
      else if (t === TILE_MARBLE) col = "#444450";
      else if (t === TILE_RUG) col = "#7a2030";
      else if (t === TILE_BATH) col = "#6a7080";
      else if (t === TILE_WALL || t === TILE_WINDOW) col = "#1a1a24";
      else if (t === TILE_WOODWALL) col = "#5a3e26";
      else if (t === TILE_LOCKER || t === TILE_LOCKER_GLOW) col = "#4a6a82";
      else if (t === TILE_DOOR || t === TILE_LOCKED_DOOR || t === TILE_WOODDOOR) col = "#7a5636";
      else if (t === TILE_ENTRANCE) col = "#c8b878";
      else if (t === TILE_STAIRS_UP || t === TILE_STAIRS_DOWN) col = "#7af0a0";
      else if (t === TILE_FENCE) col = "#4a4a55";
      else if (t === TILE_TRACK) col = "#6b3a2a";
      else if (t === TILE_DESK) col = "#a07050";
      else if (t === TILE_CHALK) col = "#1a3a28";
      else if (t === TILE_MIRROR) col = "#aab4c4";
      else if (t === TILE_BENCH) col = "#6a4a2a";
      else if (t === TILE_PLANT) col = "#3a7a40";
      else if (t === TILE_VENDING || t === TILE_EXTING) col = "#8a2a32";
      else if (t === TILE_STATUE || t === TILE_PILLAR) col = "#5a5a6a";
      else if (t === TILE_BOOKSHELF || t === TILE_PODIUM || t === TILE_INFODESK) col = "#5a4430";
      else if (t === TILE_BOARD || t === TILE_TROPHY || t === TILE_CLOCK) col = "#7a6038";
      else if (t === TILE_FOUNTAIN) col = "#9aa4ae";
      else if (t === TILE_VOID) col = "#000";
      if (col) {
        bmCtx.fillStyle = col;
        bmCtx.fillRect(Math.floor(c*sx), Math.floor(r*sy), Math.ceil(sx), Math.ceil(sy));
      }
    }
  }
  // 트리거 (푼 것/출구 열린 뒤는 회색 - 더 이상 안내 안 함)
  for (const t of triggers) {
    if (t.floor !== state.currentFloor) continue;
    bmCtx.fillStyle = (t.used || state.exitUnlocked) ? "#444" : "#ffaa44";
    bmCtx.fillRect(Math.floor(t.tx*sx)-1, Math.floor(t.ty*sy)-1, 3, 3);
  }
  // 플레이어 (흔들림 없음)
  const px = (player.x / TILE) * sx;
  const py = (player.y / TILE) * sy;
  bmCtx.fillStyle = "#7af0a0";
  bmCtx.fillRect(Math.floor(px)-1, Math.floor(py)-1, 3, 3);
}

function updateHud() {
  const tx = Math.floor(player.x / TILE), ty = Math.floor(player.y / TILE);
  // 스테이지별 영역 라벨 - 더 이상 운동장은 없음.
  const sc = stageCfg();
  let area = sc.name || "학교";
  if (sc.zone === "corridor") area = "복도";
  else if (sc.zone === "central") area = "1층 중앙홀";
  else if (sc.zone === "classroom") area = "교실";

  document.getElementById("hud-title").textContent = `STAGE ${state.stage} — ${stageCfg().name}`;
  document.getElementById("hud-progress").textContent = `조각 ${state.keyFragments.length}/${state.totalRequired}`;
  document.getElementById("hud-area").textContent = area;
  document.getElementById("hud-diff").textContent = `${state.grade} · 여러 과목`;
  document.getElementById("bm-floor").textContent = state.currentFloor + "F";
  document.getElementById("bm-progress").textContent = `${state.solved}/${state.totalRequired}`;

  // 인터랙트 힌트
  const hint = document.getElementById("interact-hint");
  let near = null;
  for (const t of triggers) {
    if (t.used || t.floor !== state.currentFloor) continue;
    const d = Math.max(Math.abs(t.tx - tx), Math.abs(t.ty - ty));
    if (d <= 1) { near = t; break; }
  }
  if (near) {
    hint.style.display = "block";
    const k = gamepadState.connected ? "[E / A]" : "[E]";
    hint.textContent = `${k} 조사 — ${near.label}`;
  } else hint.style.display = "none";
}

// ──────────────────────────────────────────
// 메인 루프
// ──────────────────────────────────────────
let lastTime = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastTime) / 1000) || 0;
  lastTime = now;

  if (state.phase === PHASE.EXPLORATION) {
    checkEnterAndEscape();
    let dx = 0, dy = 0;
    if (keys["w"] || keys["arrowup"]) dy -= 1;
    if (keys["s"] || keys["arrowdown"]) dy += 1;
    if (keys["a"] || keys["arrowleft"]) dx -= 1;
    if (keys["d"] || keys["arrowright"]) dx += 1;
    const gp = pollGamepad();
    if (gp.lx !== 0 || gp.ly !== 0) { dx += gp.lx; dy += gp.ly; }
    // 정규화
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len > 0) {
      dx /= len; dy /= len;
      tryMove(dx * player.speed * dt, dy * player.speed * dt);
      // 방향 갱신
      if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? 'right' : 'left';
      else player.dir = dy > 0 ? 'down' : 'up';
    }
    if (gp.interact) tryInteract();

    updateAnomalies(dt);
    updateHud();
    renderMinimap();
  }

  render();
}

// 퍼즐
// ──────────────────────────────────────────
// 토스트 알림
let toastTimer = null;
function showToast(msg, opts={}) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("warn", !!opts.warn);
  t.style.display = "block";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, opts.duration || 2800);
}

function updateKeyInventory() {
  const need = state.totalRequired;
  const got = state.keyFragments.length;
  document.getElementById("key-count").textContent = `${got}/${need}`;
  const frags = document.getElementById("key-frags");
  frags.innerHTML = "";
  for (let i = 0; i < need; i++) {
    const f = document.createElement("div");
    f.className = "frag" + (i < got ? " got" : "");
    f.textContent = i < got ? "🗝" : "·";
    frags.appendChild(f);
  }
}

function unlockExit() {
  if (state.exitUnlocked) return;
  state.exitUnlocked = true;
  // 스테이지별 출구 타일만 해제. 장식용 잠긴 문은 계속 잠겨 있음.
  for (const d of stageExitDoors) {
    if (map1[d.ty] && map1[d.ty][d.tx] === TILE_LOCKED_DOOR) {
      map1[d.ty][d.tx] = TILE_ENTRANCE;
    }
  }
  const msgs = {
    1: "✨ 교실 문이 열렸다! 남쪽 문으로 나가 복도로 향하세요",
    2: "✨ 동쪽 계단의 잠금이 풀렸다! 계단을 내려가세요",
    3: "✨ 정문이 열렸다! 남쪽 정문으로 탈출하세요",
  };
  showToast(msgs[state.stage] || "✨ 출구가 열렸다!", { duration: 4500 });
}

let answeredThisPuzzle = false;   // 연타 방지 - 퍼즐 1개당 정답 처리 1회

async function openPuzzle(trigger) {
  if (!canSpawnQuestion()) return;
  state.currentTrigger = trigger;
  state.phase = PHASE.PUZZLE;
  answeredThisPuzzle = false;      // 새 퍼즐 - 답안 잠금 해제
  // 문제마다 과목을 새로 무작위 (한 과목만 반복되지 않게 섞기)
  const subj = SUBJECTS[Math.floor(Math.random() * SUBJECTS.length)];
  state.subject = subj;
  showOverlay(true);
  panel.className = "panel";
  panel.innerHTML = `<h1>퍼즐 — ${trigger.label}</h1>
    <div class="question-card"><p class="status" id="status">문제 생성 중...</p></div>`;

  let q;
  try { q = await requestQuestion(subj); }
  catch (e) { document.getElementById("status").textContent = "실패: "+e.message; return; }
  addRecent(q);

  const d = cfg();
  const showHint = Math.random() < d.hint_frequency;
  panel.innerHTML = `<h1>퍼즐 — ${trigger.label} <span class="lock-badge">${escapeHtml(subj)}</span></h1>
    <div class="question-card">
      <p style="white-space:pre-wrap;font-size:16px">${escapeHtml(q.question)}</p>
      <div class="choices">
        ${q.choices.map((c,i)=>`<button data-i="${i}">${escapeHtml(c)}</button>`).join("")}
      </div>
      ${showHint ? `<p><button id="hint-btn">힌트 보기</button></p><p class="hint-text" id="hint-text" style="display:none"></p>` : ""}
      <p class="status" id="status"></p>
    </div>`;
  document.querySelectorAll(".choices button").forEach(b => {
    b.onclick = () => answer(parseInt(b.dataset.i, 10), q);
  });
  if (showHint) {
    document.getElementById("hint-btn").onclick = () => {
      const ht = document.getElementById("hint-text");
      ht.style.display = "block"; ht.textContent = q.hint || "(힌트 없음)";
    };
  }
}

function answer(picked, q) {
  // 연타 방지: 한 퍼즐에서 최초 1회만 처리 (정답 연타로 열쇠 다중 획득 차단)
  if (answeredThisPuzzle) return;
  answeredThisPuzzle = true;
  document.querySelectorAll(".choices button").forEach(b => {
    b.disabled = true; b.style.opacity = "0.55"; b.style.cursor = "default";
  });
  const correct = picked === q.answer_index;
  const d = cfg();
  const status = document.getElementById("status");
  if (correct) {
    state.solved++;
    // 열쇠 조각 획득
    if (state.currentTrigger) {
      state.keyFragments.push({ label: state.currentTrigger.label });
    }
    status.textContent = `정답!  🗝 열쇠 조각 +1  (${state.keyFragments.length}/${state.totalRequired})`;
    status.style.color = "var(--accent)";
  } else {
    // 오답 시 트리거 재사용 가능하게 (단, 같은 트리거에 또 도전)
    if (state.currentTrigger) state.currentTrigger.used = false;
    status.textContent = "오답. 다시 도전할 수 있습니다.";
    status.style.color = "var(--warn)";
  }
  if (d.question_difficulty === "easy" || !correct) {
    status.textContent += "  해설: " + q.explanation;
  }
  saveGame();
  setTimeout(() => {
    state.phase = PHASE.EXPLORATION;
    showOverlay(false);
    updateKeyInventory();
    // 모든 조각을 모았으면 잠금 해제
    if (state.keyFragments.length >= state.totalRequired && !state.exitUnlocked) {
      unlockExit();
    } else if (correct) {
      showToast(`🗝 열쇠 조각 +1 (${state.keyFragments.length}/${state.totalRequired})`);
    }
  }, 2400);
}

let escapeShown = false;
function renderEnd() {
  if (escapeShown) return;
  escapeShown = true;
  state.phase = PHASE.PUZZLE;
  showOverlay(true);
  panel.className = "panel";
  const isFinal = state.stage >= state.maxStage;
  const sc = stageCfg();
  if (isFinal) {
    panel.innerHTML = `<h1>★ 최 종 탈 출 ★</h1>
      <p style="font-size:18px">${state.userId} 님,<br>
      ${state.maxStage}개의 스테이지를 모두 빠져나왔다.</p>
      <p style="color:var(--muted);font-size:14px">"꿈에서 깨어났다. 학교는 더 이상 그곳에 없었다..."</p>
      <p><button class="primary" onclick="location.reload()">처음으로</button></p>`;
  } else {
    const next = STAGES[state.stage + 1];
    panel.innerHTML = `<h1>STAGE ${state.stage} CLEAR</h1>
      <p style="font-size:18px">${sc.name} 을(를) 탈출했다.<br>
      ${state.keyFragments.length}개의 열쇠 조각을 모두 모았다.</p>
      <p style="color:var(--muted);font-size:14px">"하지만 정문 너머로 또 다른 학교가 보인다..."</p>
      <h2>NEXT — STAGE ${state.stage + 1}: ${next.name}</h2>
      <p style="font-size:14px;color:#c8b0e8">${next.subtitle}</p>
      <p><button class="primary" id="next-stage-btn">다음 스테이지 →</button></p>`;
    document.getElementById("next-stage-btn").onclick = () => startNextStage();
  }
  document.getElementById("key-inv").style.display = "none";
}

function startNextStage() {
  state.stage++;
  escapeShown = false;
  // 회피 목록은 스테이지가 바뀌어도 유지 - 게임 내내 같은 문제 반복 방지.
  showOverlay(false);
  initGame();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

// ──────────────────────────────────────────
// 시작
// ──────────────────────────────────────────
let gameInitialized = false;
let loopStarted = false;   // 게임 루프는 앱 전체에서 딱 한 번만 시작 (중복 방지)
function initGame() {
  resizeCanvas();
  if (!gameInitialized) {
    buildSprites();
    gameInitialized = true;
  }
  // 매번 새로 빌드 (재시작 대응)
  triggers.length = 0;
  stairLinks.length = 0;
  buildMaps();
  // 열쇠 개수는 스테이지마다 무작위 (문제 1개당 열쇠 1개). 최소 3 ~ 최대 트리거 수
  const avail = triggers.length;
  state.totalRequired = avail <= 3 ? avail
    : 3 + Math.floor(Math.random() * (avail - 2));
  state.keyFragments = [];
  state.exitUnlocked = false;  // 시작부터 잠긴 상태 (스테이지마다 다른 출구)
  state.entered = true;         // 이미 학교 안 - 운동장 진입 시퀀스 없음
  state.solved = 0;
  state.currentFloor = 1;
  escapeShown = false;
  // 스테이지별 스폰 위치
  const sc = stageCfg();
  const spawn = sc.spawn || { tx: 25, ty: 16 };
  player.x = spawn.tx * TILE + TILE/2;
  player.y = spawn.ty * TILE + TILE/2;
  player.dir = 'down';
  // 스테이지 색감 - 캔버스 요소에 CSS 필터로 한 번만 적용 (GPU 가속, 매 프레임 비용 없음)
  canvas.style.filter = sc.tile_filter ? sc.tile_filter : "none";
  state.phase = PHASE.EXPLORATION;   // 스테이지 전환 후 반드시 탐험 단계로 복귀 (없으면 못 움직임)

  // 이어하기: 저장된 스테이지 내부 진행(모은 열쇠·위치)을 그대로 복원
  if (state.pendingResume) {
    const pr = state.pendingResume;
    state.pendingResume = null;
    if (typeof pr.total === "number" && pr.total > 0) {
      state.totalRequired = triggers.length ? Math.min(pr.total, triggers.length) : pr.total;
    }
    // 모았던 열쇠 개수만큼 앞쪽 트리거를 '이미 푼' 상태로 표시하고 조각 복원
    const fragCount = Math.max(0, Math.min(pr.fragments | 0, state.totalRequired));
    let marked = 0;
    for (const t of triggers) {
      if (marked >= fragCount) break;
      t.used = true;
      state.keyFragments.push({ label: t.label });
      marked++;
    }
    state.solved = pr.solved | 0;
    if (typeof pr.px === "number" && typeof pr.py === "number") { player.x = pr.px; player.y = pr.py; }
    // 모든 조각을 이미 모았던 상태면 출구를 열어 둔 채로 재개
    if (state.keyFragments.length >= state.totalRequired) unlockExit();
  }

  document.getElementById("key-inv").style.display = "block";
  updateKeyInventory();
  saveGame();   // 스테이지 시작 시점 저장 - 이어하기가 이 스테이지를 가리키게
  showToast(`★ STAGE ${state.stage} — ${sc.name} ★\n${sc.subtitle}\n${sc.intro_toast || ""}`, { duration: 6000 });
  setTimeout(() => {
    showToast("노란 ✦ 반짝임에 다가가 [E] 를 누르세요", { duration: 4000 });
  }, 6500);
  lastTime = performance.now();
  // 루프는 한 번만 시작 - 스테이지 전환마다 중복 등록되면 입력이 여러 번 처리돼 버벅임/릴레이 발생
  if (!loopStarted) { loopStarted = true; requestAnimationFrame(loop); }
}

// 종료 버튼 → 확인창
document.getElementById("quit-btn").onclick = () => renderQuitConfirm();

// 창/탭을 닫기 직전 자동 저장 + 떠날지 확인 (탐험 중일 때만)
window.addEventListener("beforeunload", (e) => {
  if (state.userId && state.phase >= PHASE.EXPLORATION) {
    saveGame();
    e.preventDefault();
    e.returnValue = "";   // 브라우저 기본 "나가시겠습니까?" 확인 표시
  }
});

// 첫 화면 = 로그인 (오래된 사진 배경)
// ===== STAGE 3 바로 입장 (미리보기 사본) =====
state.userId='미리보기';
state.grade='중2';
state.difficulty='EASY';
state.stage=3;
state.pendingResume=null;
enterSchool();

</script>
