<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>DAYDREAM SCHOOL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a18; --fg:#e8e8ee; --accent:#7af0a0; --dream:#9b8aff;
    --warn:#f06070; --muted:#6a6a78; --border:#2a2a36;
  }
  *,*:before,*:after { box-sizing:border-box; image-rendering:pixelated; image-rendering:crisp-edges; }
  html, body { margin:0; padding:0; background:#000; color:var(--fg);
    font-family:'VT323', monospace; font-size:18px; overflow:hidden; height:100%; }
  h1,h2,h3 { font-family:'Press Start 2P', monospace; letter-spacing:1px; }
  h1 { font-size:16px !important; line-height:1.4; margin:0 0 16px; }
  h2 { font-size:12px !important; line-height:1.4; margin:18px 0 10px; color:var(--accent); }
  h3 { font-size:11px !important; margin:0 0 6px; color:var(--accent); }
  input, button, .panel, .difficulty-card, #bottom-map, #gamepad-status {
    border-radius: 0 !important;
  }
  #c { display:block; width:100vw; height:100vh; image-rendering:pixelated; background:#000; }

  /* 몽환적 로그인 배경 */
  #photo-bg {
    position:fixed; inset:0; z-index:40; overflow:hidden;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(120,80,180,0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 70%, rgba(80,160,200,0.15) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 60%, rgba(140,100,80,0.20) 0%, rgba(10,8,18,0.96) 78%),
      linear-gradient(180deg, #2a2240 0%, #1a1828 45%, #0a0814 100%);
    animation: dreamShift 12s infinite ease-in-out;
  }
  @keyframes dreamShift {
    0%,100% { filter: hue-rotate(0deg) brightness(1); }
    50% { filter: hue-rotate(20deg) brightness(1.1); }
  }
  #photo-bg::before {
    content:""; position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px),
      radial-gradient(circle at 20% 10%, rgba(200,160,255,0.18), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(140,220,255,0.12), transparent 50%);
    mix-blend-mode:overlay; pointer-events:none; animation:flicker 4s infinite;
  }
  #photo-bg::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,0.65) 100%);
  }
  @keyframes flicker { 0%,100%{opacity:1} 47%{opacity:0.85} 50%{opacity:0.78} 53%{opacity:0.92} }

  /* 떠다니는 빛 파티클 */
  .dream-orb {
    position:absolute; border-radius:50%; pointer-events:none;
    background: radial-gradient(circle, rgba(200,180,255,0.9) 0%, rgba(120,100,200,0.4) 40%, transparent 70%);
    mix-blend-mode:screen;
  }
  @keyframes float1 {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    20%  { opacity: 1; }
    50%  { transform: translate(40px, -80px) scale(1.3); opacity: 0.9; }
    80%  { opacity: 0.6; }
    100% { transform: translate(-20px, -200px) scale(0.6); opacity: 0; }
  }
  @keyframes float2 {
    0%   { transform: translate(0, 0) scale(0.8); opacity: 0; }
    25%  { opacity: 0.8; }
    50%  { transform: translate(-60px, -120px) scale(1.1); opacity: 1; }
    75%  { opacity: 0.5; }
    100% { transform: translate(30px, -240px) scale(0.5); opacity: 0; }
  }
  @keyframes float3 {
    0%   { transform: translate(0, 0) scale(1.2); opacity: 0; }
    30%  { opacity: 1; }
    60%  { transform: translate(80px, -100px) scale(0.9); opacity: 0.7; }
    100% { transform: translate(-40px, -260px) scale(0.4); opacity: 0; }
  }

  .photo-school {
    position:absolute; left:50%; top:30%; transform:translate(-50%,-50%);
    width:70vmin; max-width:800px; height:auto; opacity:0.55; color:#c8b0e8;
    filter:blur(0.4px) drop-shadow(0 0 12px rgba(180,140,240,0.4));
    pointer-events:none;
    animation: schoolBreathe 8s infinite ease-in-out;
  }
  @keyframes schoolBreathe {
    0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.55; }
    50% { transform: translate(-50%,-52%) scale(1.02); opacity: 0.75; }
  }
  .photo-title {
    position:absolute; left:50%; top:9%; transform:translateX(-50%);
    color:#e8d8ff; font-size:22px; letter-spacing:8px; white-space:nowrap;
    font-family:'Press Start 2P', monospace;
    text-shadow:
      0 0 10px rgba(180,140,240,0.9),
      0 0 20px rgba(120,90,200,0.6),
      0 0 30px rgba(80,160,220,0.4);
    animation: titleGlow 4s infinite ease-in-out;
  }
  @keyframes titleGlow {
    0%,100% { text-shadow:
      0 0 10px rgba(180,140,240,0.9),
      0 0 20px rgba(120,90,200,0.6),
      0 0 30px rgba(80,160,220,0.4); }
    50% { text-shadow:
      0 0 14px rgba(220,180,255,1),
      0 0 28px rgba(160,120,240,0.8),
      0 0 42px rgba(100,180,240,0.5); }
  }
  .photo-date { position:absolute; right:28px; bottom:22px; color:#c8b0e8;
    font-size:14px; opacity:0.6; letter-spacing:3px; font-style:italic;
    text-shadow: 0 0 6px rgba(180,140,240,0.5); }
  .photo-tagline {
    position: absolute; left: 50%; top: 17%; transform: translateX(-50%);
    color: #b8a0d8; font-size: 14px; letter-spacing: 4px; opacity: 0.7;
    font-family: 'VT323', monospace;
    text-shadow: 0 0 8px rgba(180,140,240,0.6);
  }

  .overlay {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:50; padding:24px; background:rgba(10,10,18,0.85);
  }
  .overlay.transparent { background:transparent; }
  .panel {
    background:rgba(18,18,26,0.94); border:3px solid var(--border);
    padding:24px; max-width:720px; width:100%; max-height:90vh; overflow:auto;
    box-shadow:8px 8px 0 #000, 0 0 40px rgba(122,240,160,0.06);
  }
  .panel.login {
    background:rgba(28,20,42,0.88); border-color:#6a4a96; color:#e8d8ff;
    box-shadow:
      8px 8px 0 #000,
      0 0 60px rgba(160,120,240,0.35),
      inset 0 0 30px rgba(120,90,200,0.15);
    max-width:460px;
    backdrop-filter: blur(2px);
    animation: panelGlow 5s infinite ease-in-out;
  }
  @keyframes panelGlow {
    0%,100% { box-shadow: 8px 8px 0 #000, 0 0 60px rgba(160,120,240,0.35), inset 0 0 30px rgba(120,90,200,0.15); }
    50%     { box-shadow: 8px 8px 0 #000, 0 0 90px rgba(180,140,255,0.55), inset 0 0 40px rgba(140,100,220,0.25); }
  }
  .panel.login h1 { color:#f0e0ff; text-shadow: 0 0 12px rgba(200,160,255,0.7); }
  .panel.login label { color:#c8b0e8; }
  .panel.login input {
    background:rgba(40,28,60,0.78); border-color:#6a4a96; color:#f0e0ff;
    box-shadow: inset 0 0 8px rgba(120,90,200,0.2);
  }
  .panel.login input:focus { border-color:#c8a0ff; box-shadow: 0 0 12px rgba(200,160,255,0.6); }
  .panel.login button {
    background:rgba(60,40,90,0.78); border-color:#8a6ac6; color:#f0e0ff;
    text-shadow: 0 0 6px rgba(180,140,240,0.5);
  }
  .panel.login button.primary {
    background:#a88adc; color:#1a1228; border-color:#d4b8ff;
    box-shadow: 0 0 16px rgba(180,140,255,0.6), 4px 4px 0 #000;
  }
  .panel.login button.primary:hover { background:#c8a8ff; box-shadow: 0 0 24px rgba(220,180,255,0.9), 4px 4px 0 #000; }
  .grade-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin:4px 0; }
  .grade-grid button { width:100%; margin:0; padding:10px 0; text-align:center; }
  .panel.login .grade-grid button.sel {
    background:#a88adc; color:#1a1228; border-color:#d4b8ff;
    box-shadow: 0 0 14px rgba(180,140,255,0.7), 2px 2px 0 #000;
  }
  .auth-msg { color:var(--warn); font-size:14px; min-height:1em; margin:8px 0 0;
    text-shadow:0 0 6px rgba(240,96,112,0.4); }
  .auth-switch { font-size:14px; color:#a89ac8; margin:10px 0 0; }
  .panel.login button.linkbtn {
    background:transparent; border:none; box-shadow:none; padding:0 4px;
    color:#d4b8ff; text-decoration:underline; font-size:15px;
    text-shadow:0 0 8px rgba(200,160,255,0.5);
  }
  .panel.login button.linkbtn:hover { background:transparent; color:#f0e0ff; }

  label { display:block; margin:10px 0 4px; font-size:14px; color:var(--muted); }
  input { width:100%; padding:8px 10px; background:#15151c; border:2px solid var(--border);
    color:var(--fg); font-family:'VT323', monospace; font-size:18px; }
  input:focus { border-color:var(--accent); outline:none; }
  button {
    padding:8px 16px; margin:4px 4px 4px 0; background:#15151c;
    border:2px solid var(--border); border-bottom-width:4px; border-right-width:4px;
    color:var(--fg); font-family:'VT323', monospace; font-size:18px; cursor:pointer;
  }
  button:hover { background:#1f1f28; border-color:var(--accent); }
  button:active { border-bottom-width:2px; border-right-width:2px; transform:translate(2px,2px); }
  button.primary { background:var(--accent); color:#0a0a10; border-color:#5dd886; font-weight:bold; }
  button.primary:hover { background:#5dd886; }
  .difficulty-card {
    border:2px solid var(--border); padding:14px; margin:8px 0; cursor:pointer; background:#15151c;
  }
  .difficulty-card.selected { border-color:var(--accent); background:#1a2a1f; }
  .difficulty-card ul { margin:4px 0; padding-left:20px; font-size:14px; color:var(--muted); }
  .lock-badge { display:inline-block; padding:2px 8px; background:var(--warn); color:#fff;
    font-size:11px; margin-left:8px; font-family:'Press Start 2P', monospace; }
  .keyboard-hint { font-size:14px; color:var(--muted); margin-top:8px; }

  /* HUD */
  #hud { position:fixed; top:0; left:0; right:0; padding:12px 16px;
    color:var(--fg); font-size:16px; pointer-events:none; z-index:5;
    text-shadow:2px 2px 0 #000; }
  #hud .row { display:flex; justify-content:space-between; }
  #hud .title { font-family:'Press Start 2P', monospace; font-size:11px; }
  #bottom-map {
    position:fixed; left:16px; top:250px;
    width:360px; height:160px; background:rgba(8,8,12,0.85);
    border:2px solid var(--border); border-bottom-width:4px; border-right-width:4px;
    padding:6px; z-index:5; pointer-events:none; color:var(--muted); font-size:12px;
  }
  /* 퀘스트 창 - 해야 할 일 + 진행도 (지도 위, 좌측 상단) */
  #quest-box {
    position:fixed; left:16px; top:56px;
    width:360px; background:rgba(8,8,12,0.85);
    border:2px solid var(--border); border-bottom-width:4px; border-right-width:4px;
    padding:10px 12px; z-index:5; pointer-events:none; color:var(--muted); font-size:13px;
  }
  #quest-box .q-title { font-family:'Press Start 2P', monospace; font-size:11px;
    color:var(--accent); margin-bottom:7px; }
  #quest-box .q-goal { color:#c8b0e8; font-size:12px; margin-bottom:8px; line-height:1.4; }
  #quest-box .q-list { list-style:none; margin:0 0 9px; padding:0; }
  #quest-box .q-list li { margin:4px 0; line-height:1.4; }
  #quest-box .q-list li.done { color:#7af0a0; text-decoration:line-through; opacity:.65; }
  #quest-box .q-bar { height:9px; background:#16161e; border:1px solid #2a2a33; overflow:hidden; }
  #quest-box .q-fill { height:100%; width:0%; background:var(--accent); transition:width .3s; }
  #quest-box .q-pct { text-align:right; font-size:11px; margin-top:3px; opacity:.85; }
  #bottom-map .label { display:flex; justify-content:space-between; margin-bottom:4px; font-size:12px; }
  #bottom-map .canvas { position:relative; width:100%; height:calc(100% - 18px); background:#000;
    border:1px solid #1a1a22; overflow:hidden; }
  #bottom-map canvas { display:block; image-rendering:pixelated; }
  #gamepad-status { position:fixed; left:16px; bottom:16px; padding:4px 8px;
    background:rgba(8,8,12,0.85); border:2px solid var(--border);
    font-size:12px; color:var(--muted); z-index:5; pointer-events:none; }
  #gamepad-status.on { color:var(--accent); border-color:var(--accent); }
  #quit-btn {
    position:fixed; right:16px; bottom:16px; z-index:6; cursor:pointer;
    background:rgba(8,8,12,0.85); border:2px solid var(--border);
    border-bottom-width:4px; border-right-width:4px;
    color:var(--muted); font-family:'VT323', monospace; font-size:16px; padding:6px 14px;
  }
  #quit-btn:hover { color:var(--warn); border-color:var(--warn); }
  #interact-hint { position:fixed; left:50%; top:60%; transform:translateX(-50%);
    color:var(--accent); font-size:16px; pointer-events:none; z-index:4;
    text-shadow:2px 2px 0 #000; display:none;
    font-family:'VT323', monospace;
    background:rgba(0,0,0,0.7); padding:6px 14px; border:2px solid var(--accent); }
  #glitch-overlay { position:fixed; inset:0; pointer-events:none; z-index:3;
    background:transparent; mix-blend-mode:screen; }
  #red-flash { position:fixed; inset:0; pointer-events:none; z-index:7;
    background:rgba(200,20,20,0.55); opacity:0; transition:opacity .14s ease; }
  #red-flash.on { opacity:1; }
  #bottom-dialogue { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    width:min(620px, 90vw); background:rgba(8,8,14,0.92); z-index:8; display:none;
    border:2px solid var(--accent); border-bottom-width:4px; border-right-width:4px;
    padding:14px 18px; pointer-events:none; color:var(--fg);
    font-family:'VT323', monospace; font-size:21px; line-height:1.4; text-shadow:1px 1px 0 #000; }
  #bottom-dialogue .spk { color:var(--accent); font-family:'Press Start 2P', monospace;
    font-size:11px; margin-bottom:7px; }
  #buff-badge { position:fixed; right:16px; top:52px; z-index:6; pointer-events:none; display:none;
    background:rgba(20,12,30,0.9); border:2px solid var(--accent);
    border-bottom-width:4px; border-right-width:4px; padding:8px 12px;
    color:var(--accent); font-family:'VT323', monospace; font-size:18px; line-height:1.35;
    text-align:right; text-shadow:1px 1px 0 #000; }
  #buff-badge .ttl { color:#f4d03f; font-size:15px; display:block; margin-bottom:2px; }
  .ms-cell { width:32px; height:32px; padding:0; font-size:16px; line-height:1; font-weight:bold;
    font-family:'VT323', monospace; background:#3a3a4a; color:#e8e2ff;
    border:2px solid #4a4a5c; border-top-color:#5e5e74; border-left-color:#5e5e74; cursor:pointer; }
  .ms-cell:hover:not(:disabled) { background:#4c4c62; }
  .ms-cell.open { background:#15151d; border-color:#26262e; }
  .ms-cell:disabled { cursor:default; }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%); }

  /* 토스트 알림 */
  #toast {
    position:fixed; left:50%; top:80px; transform:translateX(-50%);
    background:rgba(8,8,12,0.94); border:2px solid var(--accent);
    color:var(--accent); padding:12px 24px; z-index:6;
    font-family:'VT323', monospace; font-size:20px;
    box-shadow:4px 4px 0 #000; pointer-events:none;
    display:none; text-align:center; white-space:pre-line; max-width:80vw;
    line-height:1.4;
  }
  #toast.warn { border-color:var(--warn); color:var(--warn); }

  /* 열쇠 조각 인벤토리 */
  #key-inv {
    position:fixed; right:16px; top:80px;
    background:rgba(8,8,12,0.85); border:2px solid var(--accent);
    border-bottom-width:4px; border-right-width:4px;
    padding:8px 12px; z-index:5; pointer-events:none;
    font-family:'VT323', monospace; font-size:16px; color:var(--accent);
    display:none;
  }
  #key-inv .title { font-family:'Press Start 2P', monospace; font-size:9px; color:var(--muted); margin-bottom:4px; }
  #key-inv .frags { display:flex; flex-wrap:wrap; gap:4px; max-width:200px; }
  #key-inv .frag {
    width:18px; height:18px; background:#333; border:1px solid #555;
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  #key-inv .frag.got { background:#5a4020; border-color:#ffaa44; color:#ffe080; }

  .question-card { background:#15151c; border:2px solid var(--border); padding:20px; }
  .choices button { display:block; width:100%; text-align:left; margin:6px 0; }
  .hint-text { color:var(--accent); font-size:15px; margin-top:8px; }
  .status { font-size:15px; color:var(--muted); margin-top:12px; min-height:1em; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="interact-hint">[E] 조사하기</div>
<div id="glitch-overlay"></div>
<div id="red-flash"></div>
<div id="bottom-dialogue"><div class="spk" id="bd-spk"></div><div id="bd-text"></div></div>
<div id="buff-badge"><span class="ttl">👑 초성게임 고수</span>⚡ 속도 버프</div>

<div id="photo-bg" style="display:none">
  <div class="photo-title">DAYDREAM SCHOOL</div>
  <div class="photo-tagline">잊혀진 기억의 학교에 어서오세요</div>
  <!-- 떠다니는 빛 파티클 -->
  <div class="dream-orb" style="left:8%; top:78%; width:14px; height:14px; animation: float1 9s infinite ease-out;"></div>
  <div class="dream-orb" style="left:18%; top:88%; width:8px; height:8px; animation: float2 11s infinite ease-out 1.5s;"></div>
  <div class="dream-orb" style="left:32%; top:82%; width:12px; height:12px; animation: float3 13s infinite ease-out 3s;"></div>
  <div class="dream-orb" style="left:48%; top:92%; width:10px; height:10px; animation: float1 10s infinite ease-out 4.5s;"></div>
  <div class="dream-orb" style="left:62%; top:80%; width:16px; height:16px; animation: float2 14s infinite ease-out 2s;"></div>
  <div class="dream-orb" style="left:74%; top:88%; width:7px; height:7px; animation: float3 12s infinite ease-out 5.5s;"></div>
  <div class="dream-orb" style="left:84%; top:84%; width:11px; height:11px; animation: float1 11s infinite ease-out 6s;"></div>
  <div class="dream-orb" style="left:92%; top:78%; width:9px; height:9px; animation: float2 13s infinite ease-out 0.5s;"></div>
  <div class="dream-orb" style="left:25%; top:94%; width:6px; height:6px; animation: float3 15s infinite ease-out 7s;"></div>
  <div class="dream-orb" style="left:55%; top:90%; width:13px; height:13px; animation: float1 12s infinite ease-out 8s;"></div>
  <svg class="photo-school" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.4">
    <line x1="0" y1="320" x2="800" y2="320" stroke-width="1.5"/>
    <polygon points="180,120 620,120 580,80 220,80"/>
    <rect x="200" y="120" width="400" height="200"/>
    <line x1="400" y1="120" x2="400" y2="320" stroke-width="1.2" opacity="0.5"/>
    <line x1="200" y1="220" x2="600" y2="220" stroke-width="1.2" opacity="0.5"/>
    <rect x="230" y="150" width="50" height="60"/>
    <rect x="310" y="150" width="50" height="60"/>
    <rect x="450" y="150" width="50" height="60"/>
    <rect x="530" y="150" width="50" height="60"/>
    <rect x="230" y="230" width="50" height="60"/>
    <rect x="310" y="230" width="50" height="60"/>
    <rect x="450" y="230" width="50" height="60"/>
    <rect x="530" y="230" width="50" height="60"/>
    <rect x="385" y="240" width="40" height="80"/>
    <polyline points="380,235 425,235 430,225 380,225"/>
    <circle cx="110" cy="270" r="50"/>
    <line x1="110" y1="320" x2="110" y2="280" stroke-width="3"/>
    <circle cx="700" cy="280" r="35"/>
    <line x1="700" y1="320" x2="700" y2="290" stroke-width="3"/>
    <line x1="660" y1="320" x2="660" y2="120" stroke-width="1.5"/>
    <path d="M660 120 L700 135 L660 150 Z" stroke-width="1.5"/>
    <circle cx="500" cy="60" r="22" opacity="0.4"/>
    <circle cx="500" cy="60" r="14" opacity="0.6"/>
  </svg>
  <div class="photo-date">19XX · 6월</div>
</div>

<div id="hud" style="display:none">
  <div class="row">
    <div>
      <div class="title" id="hud-title">학교 탐험</div>
      <div id="hud-progress" style="color:var(--muted)"></div>
    </div>
    <div style="text-align:center">
      <div class="title" id="hud-timer" style="font-size:22px;color:var(--accent)">20:00</div>
      <div style="color:var(--muted)">남은 시간</div>
    </div>

const RECENT_LIMIT = 30;
function addRecent(q) {
  if (!q) return;
  if (q.question) {
    state.recent_questions.push(String(q.question));
    while (state.recent_questions.length > RECENT_LIMIT) state.recent_questions.shift();
  }
  if (Array.isArray(q.choices) && q.choices.length > 0) {
    const idx = Number(q.answer_index) || 0;

      state.recent_answers.push(String(q.choices[idx]));

    state.recent_choice_sets.push(q.choices.map(String).join(" / "));
    while (state.recent_choice_sets.length > RECENT_LIMIT) state.recent_choice_sets.shift();

}

// Claude API

// API 키 기능 제거 — 항상 내장 문제 풀(QUESTION_BANK)에서 출제한다.
function getApiKey() { return ""; }
function setApiKey(k) {}

const SYSTEM_PROMPT = `너는 한국 중·고교 교과 범위 객관식 문제 출제자다.
최우선 의무: 매 호출마다 의미·소재·정답·보기·표현이 확연히 다른 새 문제 생성.
사용자가 회피 목록을 주면 그 안의 어떤 항목과도 본질적으로 동일/유사 금지.
같은 과목이라도 다음을 매번 다르게 골라라:
- 출제 각도(계산/정의/사례/비교/추론/함정/자료해석 등)
- 소재(인물/숫자/지역/사례/조건)
- 정답 보기 위치(answer_index)
- 보기 표현(이전 보기와 같은 단어/숫자 재사용 금지)
난이도 원칙: 단순 암기·정의 확인에 그치지 말고, 배운 개념을 새로운 상황·실생활·자료에 적용해 풀어야 하는 응용 문제 위주로 출제하라. 한 번의 사고 과정(계산·추론·해석)이 반드시 필요하게.
출력은 반드시 사용자가 지정한 JSON 한 덩어리만. 코드블록·머리말·외부 텍스트 금지.`;

const ANGLES = ["수치 계산 중심","개념 정의 확인","실생활·뉴스 사례 적용","두 개념의 차이 식별",
  "두 개념의 공통점 식별","원인-결과 추론","오류·함정 찾기","그래프/표 해석","용어와 정의 매칭",
  "단계적 풀이 빈칸 채우기","보기 중 가장 적절하지 않은 것 고르기","역사·시대 맥락 추론",
  "실험 결과 해석","단위·조건 변환","짧은 지문 단답형","긴 지문 추론형"];

const MATERIALS = ["숫자·수치 위주","인물·사건 위주","지역·지도 위주","실험·관찰 자료",

const ANS_POS = [
  "이번 정답 위치(answer_index)는 0이 되게.",
  "이번 정답 위치(answer_index)는 1이 되게.",
  "이번 정답 위치(answer_index)는 2가 되게.",
  "이번 정답 위치(answer_index)는 3이 되게.",
];

function buildPrompt(grade, subject) {
  let avoid = "";
  if (state.recent_questions.length || state.recent_answers.length || state.recent_choice_sets.length) {
    avoid = "\n[중복 절대 금지]\n";
    if (state.recent_questions.length) {
      avoid += "아래 문제 본문과 의미·구조·소재가 같거나 비슷한 문제 금지:\n"
        + state.recent_questions.map(q => "- " + q).join("\n") + "\n";
    }
    if (state.recent_answers.length) {
      avoid += "아래 정답들과 본질적으로 같은 정답이 나오는 문제 금지:\n"
        + state.recent_answers.map(a => "- " + a).join("\n") + "\n";
    }
    if (state.recent_choice_sets.length) {
      avoid += "아래 보기 묶음 중 어떤 것과도 보기 단어·표현이 겹치면 안 됨:\n"
        + state.recent_choice_sets.map(c => "- " + c).join("\n") + "\n";
    }
    avoid += "위 목록과 완전히 다른 새 문제 1개만 출제.\n";
  }
  const angle = ANGLES[Math.floor(Math.random() * ANGLES.length)];
  const material = MATERIALS[Math.floor(Math.random() * MATERIALS.length)];
  const ans = ANS_POS[Math.floor(Math.random() * ANS_POS.length)];
  const nonce = Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e6).toString(36);
  const variation = `\n[변형 시드] ${nonce}\n[출제 각도] ${angle}\n[소재 성격] ${material}\n[정답 위치] ${ans}\n[필수] 직전 문제와 표현·소재·정답·보기 어느 것도 겹치지 말 것.\n`;

  // 교실(1) → 복도(2) → 중앙(3) 으로 갈수록 난이도 상승.
  const stageLevel = ["기본 개념 확인", "응용", "심화·고난도 응용"][Math.min(2, state.stage - 1)];

  return `[학년]\n${grade} (한국 교육과정 ${grade} 수준)\n\n[과목]\n${subject}\n\n[지시] 위 학년·과목의 한국 교육과정 범위 안에서 객관식 4지선다 문제 1개 출제. 난이도는 ${grade} 학생 수준에 맞추되 [${stageLevel}] 수준으로 — 그 학년이 배우지 않은 개념은 쓰지 말되, 단순 암기·정의가 아니라 개념을 실제 상황·자료·사례에 적용해 사고해야 풀리는 문제로. (구역이 깊어질수록 더 어렵고 복합적으로.)\n${avoid}${variation}\n반드시 아래 JSON 한 덩어리만 출력 (코드블록 금지):\n{"question":"문제","choices":["a","b","c","d"],"answer_index":0,"explanation":"해설","hint":"힌트"}`;
}

async function requestQuestion(subject) {
  if (!canSpawnQuestion()) throw new Error("탐험 단계 이전 - 문제 생성 금지");
  const key = getApiKey();
  if (!key) return fallbackQuestion(subject);
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"x-api-key":key,"anthropic-version":"2023-06-01",
        "content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({
        model:"claude-opus-4-7",
        max_tokens:1024,
        temperature: 1.0,
        system: SYSTEM_PROMPT,
        messages:[{role:"user", content: buildPrompt(state.grade, subject)}]
      }),
    });
    if (!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    let t = j.content[0].text.trim();
    if (t.startsWith("```")) t = t.replace(/^```[a-z]*\n?/, "").replace(/```$/, "").trim();
    return JSON.parse(t);
  } catch(e) { console.warn("API 실패:", e); return fallbackQuestion(subject); }
}

// 과목+난이도별 출제 순번 - 풀 안의 모든 문제를 한 번씩 다 낼 때까지 반복 없음.
const bankRotation = {};
function pickFromBank(subject, difficulty) {
  const subj = QUESTION_BANK[subject] || QUESTION_BANK["수학"];
  const pool = subj[difficulty] || subj.NORMAL || [];
  if (!pool.length) return null;
  const key = subject + "|" + difficulty;
  // 순번이 비었으면 풀 전체를 새로 섞어 채운다 (한 바퀴 다 돌아야 재등장).
  if (!Array.isArray(bankRotation[key]) || bankRotation[key].length === 0) {
    const order = pool.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    bankRotation[key] = order;
  }
  const picked = pool[bankRotation[key].pop()];
  // 보기 셔플 - 매번 정답 위치가 달라지게.
  const indexed = picked.choices.map((c, i) => ({ c, isAnswer: i === picked.answer_index }));
  for (let i = indexed.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
  }
  const newChoices = indexed.map(o => o.c);
  const newAns = indexed.findIndex(o => o.isAnswer);
  return {
    question: picked.question,
    choices: newChoices,
    answer_index: newAns,
    explanation: picked.explanation,
    hint: picked.hint || "",
  };
}

function fallbackQuestion(subject) {
  return pickFromBank(subject, state.difficulty) || {
    question: `[${subject}] 이 과목의 문제를 모두 풀었습니다. 잠시 후 다시 출제됩니다.`,
    choices: ["계속","처음으로","로그아웃","무시"], answer_index: 0,
    explanation: "이 과목 문제를 한 바퀴 다 풀었어요. 다른 과목으로도 도전해 보세요.",
    hint: ""
  };
}

  document.getElementById("bottom-map").style.display = (show || !state.mapVisible) ? "none" : "block";
  document.getElementById("quest-box").style.display = (show || state.questVisible === false) ? "none" : "block";

// ── 계정 저장 (localStorage) ──
function getAccounts() {
  try { return JSON.parse(localStorage.getItem("accounts") || "{}"); }
  catch (e) { return {}; }
}
function saveAccounts(a) { localStorage.setItem("accounts", JSON.stringify(a)); }
function setAuthMsg(m) { const el = document.getElementById("auth-msg"); if (el) el.textContent = m || ""; }

// 브라우저가 localStorage 저장을 막는지(시크릿/설정) 검사
function storageBlocked() {
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return false; }
  catch (e) { return true; }
}

// 로그인 화면 - 기존 계정으로 입장
function renderLogin() {
  state.phase = PHASE.LOGIN;
  showOverlay(true, { photo:true });
  panel.className = "panel login";
  const accs = getAccounts();
  const ids = Object.keys(accs);
  const blocked = storageBlocked();
  const warn = blocked
    ? `<p style="color:#ff8080;font-size:13px;line-height:1.5">⚠ 이 브라우저가 저장을 막고 있어요(시크릿 모드 등).<br>계정·진행이 저장되지 않습니다. 일반 창에서 열어주세요.</p>`
    : "";
  const accountList = ids.length
    ? `<div style="font-size:13px;color:#a89ac8;margin:2px 0 6px;max-height:96px;overflow:auto;text-align:left;border:1px solid rgba(155,138,255,.15);border-radius:6px;padding:6px">
        저장된 계정 <span style="opacity:.6">(이름=아이디 채우기 · ✕=삭제)</span><br>
        ${ids.map(id => `<span style="display:inline-block;margin:3px 4px;white-space:nowrap"><button class="linkbtn acc-chip" data-id="${escapeHtml(id)}">${escapeHtml(id)}</button><button class="linkbtn acc-del" data-id="${escapeHtml(id)}" style="color:#ff7088;margin-left:1px" title="삭제">✕</button></span>`).join("")}
        <br><button class="linkbtn" id="acc-clear-all" style="color:#ff6060;margin-top:6px">⚠ 계정 전체 삭제</button>
      </div>`
    : `<div style="font-size:13px;color:#c8a; margin:2px 0 6px">저장된 계정이 없습니다 — 아래 <b>회원가입</b>으로 먼저 만들어 주세요.</div>`;
  panel.innerHTML = `
    <h1>로 그 인</h1>
    <p style="font-size:14px;color:#c8b48a;letter-spacing:2px">오래된 학교의 기록을 다시 펼칩니다</p>
    ${warn}
    ${accountList}
    <label>아이디</label>
    <input id="uid" placeholder="아이디" value="${state.userId}" />
    <label>비밀번호</label>
    <input type="password" id="pw" placeholder="비밀번호" />
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#a89ac8;cursor:pointer">
      <input type="checkbox" id="show-pw" style="width:auto;margin:0"> 비밀번호 표시</label>
    <p class="auth-msg" id="auth-msg"></p>
    <p><button class="primary" id="login-btn">로 그 인</button></p>
    <p class="auth-switch">처음이신가요? <button class="linkbtn" id="to-signup">회원가입</button></p>`;
  const doLogin = () => {
    const id = document.getElementById("uid").value.trim();
    const pw = document.getElementById("pw").value;
    if (!id) { setAuthMsg("아이디를 입력하세요."); return; }
    const accs2 = getAccounts();
    const acc = accs2[id];
    if (!acc) {
      // 없는 아이디 → 바로 그 아이디로 회원가입하도록 안내 버튼 제공
      const el = document.getElementById("auth-msg");
      el.innerHTML = `존재하지 않는 아이디입니다. <button class="linkbtn" id="quick-signup">'${id}'(으)로 회원가입</button>`;
      const qs = document.getElementById("quick-signup");
      if (qs) qs.onclick = () => { state.userId = id; renderSignup(); };
      return;
    }
    if (acc.pw !== pw) { setAuthMsg("비밀번호가 일치하지 않습니다. (비밀번호 표시로 확인하세요)"); return; }
    state.userId = id;
    state.grade = acc.grade || "중1";
    state.difficulty = GRADE_DIFF[state.grade] || "NORMAL";
    setApiKey(acc.apiKey || "");
    // 로그인 화면에서 고른 성별 스킨을 계정에 저장 (선택 안 했으면 기존/기본 유지)
    acc.gender = state.gender || acc.gender || "남";
    state.gender = acc.gender;
    accs2[id] = acc; saveAccounts(accs2);
    try { localStorage.setItem("lastUser", id); } catch(e) {}   // 자동 로그인용 기억
    advancePhase(PHASE.NEW_OR_CONTINUE); renderNewOrContinue();
  };
  document.getElementById("login-btn").onclick = doLogin;
  document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  document.getElementById("show-pw").onchange = (e) => {
    document.getElementById("pw").type = e.target.checked ? "text" : "password";
  };
  // 아이디를 입력/선택하면 그 계정의 저장된 성별을 토글에 반영
  const reflectGender = () => {
    const a = getAccounts()[document.getElementById("uid").value.trim()];
    if (a && a.gender) {
      state.gender = a.gender;
      panel.querySelectorAll(".gender-btn").forEach(x => x.classList.toggle("sel", x.dataset.gender === state.gender));
    }
  };
  document.getElementById("uid").addEventListener("input", reflectGender);
  panel.querySelectorAll(".acc-chip").forEach(b => {
    b.onclick = () => { document.getElementById("uid").value = b.dataset.id; reflectGender(); document.getElementById("pw").focus(); };
  });
  // 계정 1개 삭제 (아이디 옆 ✕)
  panel.querySelectorAll(".acc-del").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id;
      const a = getAccounts(); delete a[id]; saveAccounts(a);
      try { if (localStorage.getItem("lastUser") === id) localStorage.removeItem("lastUser"); } catch(e) {}
      try { localStorage.removeItem("save_" + id); } catch(e) {}   // 그 계정의 저장도 함께 제거
      renderLogin();   // 목록 새로고침
    };
  });
  // 계정 전체 삭제
  const clearAll = document.getElementById("acc-clear-all");
  if (clearAll) clearAll.onclick = () => {
    if (!confirm("저장된 모든 계정과 진행 기록을 삭제할까요?\n되돌릴 수 없습니다.")) return;
    Object.keys(getAccounts()).forEach(id => { try { localStorage.removeItem("save_" + id); } catch(e) {} });
    saveAccounts({});
    try { localStorage.removeItem("lastUser"); } catch(e) {}
    state.userId = "";
    renderLogin();
  };
  document.getElementById("to-signup").onclick = renderSignup;
  document.getElementById("uid").focus();
}

// 새 게임마다 과목을 무작위로 뽑고, 난이도는 학년에 맞춤
function rollGameParams() {
  state.subject = SUBJECTS[Math.floor(Math.random() * SUBJECTS.length)];
  state.difficulty = GRADE_DIFF[state.grade] || "NORMAL";
}

// 스테이지별 난이도 - 교실(1) → 복도(2) → 중앙(3) 으로 갈수록 상승.
// 학년을 바닥값으로, 고등학생은 한 단계 더 어렵게.
function applyStageDifficulty() {
  const order = ["EASY", "NORMAL", "HARD"];
  const stageTier = Math.min(2, state.stage - 1);                 // 0,1,2
  const isHigh = state.grade && state.grade[0] === "고";
  const gradeBonus = isHigh ? 1 : 0;
  const maxTier = isHigh ? 2 : 1;   // 중학생은 HARD(고등 과정) 제외 → NORMAL이 상한
  state.difficulty = order[Math.min(maxTier, stageTier + gradeBonus)];
}

// 제한 시간 초기화 (새 게임 시작 시)
function resetTimer() {
  state.timeLeft = state.timeLimit;
  state.timeExpired = false;
  state.timerActive = false;
  updateTimerHud();
}

// 진행 상황 저장 (스테이지 + 스테이지 내부 진행까지 - 이어하기로 그대로 재개)
function saveGame() {
  if (!state.userId) return;
  if (state.timeExpired || state.ended) return;   // 시간초과·엔딩 후에는 저장 금지
  localStorage.setItem("save_" + state.userId, JSON.stringify({
    grade: state.grade, subject: state.subject, difficulty: state.difficulty,
    stage: state.stage, solved: state.solved,
    fragments: state.keyFragments.length, total: state.totalRequired,
    floor: state.currentFloor,
    timeLeft: state.timeLeft,               // 남은 시간 - 이어하기로 그대로 재개
    companion: companion.active,            // 동행 친구 합류 여부
    boy: boy.active, boyIntro: state.boyIntroDone,   // 남자애(리온) 상태
    px: player.x, py: player.y,            // 마지막 위치 - 그 자리에서 재개
    wrongTotal: state.wrongTotal || 0,     // 누적 오답
    guardOn: guard.active || guardTriggered,   // 경비원이 이미 깨어났는지
    choMaster: !!state.choMaster, speedBuff: !!state.speedBuff,   // 초성게임 고수 칭호·속도 버프
    recent: state.recent_questions.slice(-40),  // 최근 문제 - 이어하기 후에도 중복 방지
  }));
}

  panel.className = "panel";
  panel.innerHTML = `<h1>탈출에 필요한 열쇠 조각 수</h1>
    <p style="font-size:14px;color:var(--muted)">정문 잠금 해제에 필요한 조각 수 (= 풀어야 할 퍼즐 수). 최대 11개</p>
    <label>몇 개 (1~11)</label>
    <input type="number" id="count-input" min="1" max="11" value="${Math.min(state.questionCount, 11)}" />
    <p><button id="back-btn">← 뒤로</button><button class="primary" id="next-btn">시 작 →</button></p>`;
  document.getElementById("back-btn").onclick = renderDifficulty;
  document.getElementById("next-btn").onclick = () => {
    const n = parseInt(document.getElementById("count-input").value, 10);
    if (isNaN(n) || n < 1) return;
    state.questionCount = Math.min(11, n);
    enterSchool();
  };
}

function renderNewOrContinue() {
  showOverlay(true);
  panel.className = "panel";
  const hasSave = !!localStorage.getItem("save_" + state.userId);
  panel.innerHTML = `<h1>${state.userId} 님, 어서오세요</h1>
    <p style="font-size:16px">무엇을 하시겠습니까?</p>
    <p>
      <button class="primary" id="new-btn">★ 새 게 임</button>
      <button id="cont-btn" ${hasSave?"":"disabled"}>이어하기</button>
    </p>
    <p><button id="howto-btn">하는 법 보기</button><button id="logout-btn">← 로그아웃</button></p>`;
  document.getElementById("new-btn").onclick = renderHowToPlay;
  document.getElementById("cont-btn").onclick = () => {
    const saved = localStorage.getItem("save_" + state.userId);
    let ok = false;
    state.pendingResume = null;
    if (saved) {
      try {
        const s = JSON.parse(saved);
        if (s.grade) state.grade = s.grade;
        if (s.stage) state.stage = Math.min(state.maxStage, Math.max(1, s.stage));  // 저장된 스테이지부터 재개
        state.difficulty = GRADE_DIFF[state.grade] || s.difficulty || "NORMAL";
        if (s.subject) state.subject = s.subject;
        if (Array.isArray(s.recent)) state.recent_questions = s.recent.slice(-40);  // 최근 문제 복원 (중복 방지 유지)
        state.timeLeft = (typeof s.timeLeft === "number" && s.timeLeft > 0) ? s.timeLeft : state.timeLimit;
        state.timeExpired = false;
        companion.active = !!s.companion;   // 동행 친구 합류 상태 복원
        boy.active = !!s.boy; state.boyIntroDone = !!s.boyIntro;   // 리온 상태 복원
        state.wrongTotal = s.wrongTotal | 0;       // 누적 오답 복원
        guardTriggered = !!s.guardOn;              // 경비원 각성 상태 복원 (스테이지에서 재등장)
        state.choMaster = !!s.choMaster;           // 초성게임 고수 칭호·속도 버프 복원
        state.speedBuff = !!s.speedBuff;
        player.speed = state.speedBuff ? 572 : 440;
        state.companionIntroDone = true;    // 이어하기는 인트로 생략
        state.pendingResume = s;   // 스테이지 내부 진행(열쇠·위치)은 initGame 에서 복원
        ok = true;
      } catch(e) {}
    }
    if (!ok || !state.subject) rollGameParams();
    if (!ok) resetTimer();
    enterSchool();
  };
  document.getElementById("howto-btn").onclick = renderHowToPlay;
  document.getElementById("logout-btn").onclick = () => { state.userId = ""; try { localStorage.removeItem("lastUser"); } catch(e) {} advancePhase(PHASE.LOGIN); renderLogin(); };
}

function enterSchool() {
  advancePhase(PHASE.SCHOOL_ENTRY);
  advancePhase(PHASE.EXPLORATION);
  showOverlay(false);
  initGame();
}

// ──────────────────────────────────────────
const sprites = {};
const floorVariants = [];      // 회청색 마룻바닥 (복도)
const classFloorVariants = []; // 따뜻한 원목 마룻바닥 (교실 - 레퍼런스 스타일)
const marbleVariants = [];     // 대리석 바닥 변형 (중앙홀, 체크무늬)
// 기존 32px 아트를 64 타일에 2배로 그림 (호환 - 출력은 종전과 동일)
function makeSprite(drawFn) {
  const c = document.createElement("canvas");
  c.width = TILE * SR; c.height = TILE * SR;
  const cx = c.getContext("2d");
  cx.imageSmoothingEnabled = false;
  cx.save(); cx.scale(2 * SR, 2 * SR); drawFn(cx); cx.restore();
  return c;
}
// 네이티브 64px 아트 (픽셀을 더 잘게 - 바닥/벽/플레이어 등 큰 면)
function makeSpriteHi(drawFn) {
  const c = document.createElement("canvas");
  c.width = TILE * SR; c.height = TILE * SR;
  const cx = c.getContext("2d");
  cx.imageSmoothingEnabled = false;
  cx.save(); cx.scale(SR, SR); drawFn(cx); cx.restore();
  return c;
}
// 픽셀 찍기 헬퍼
function P(cx, color, x, y, w, h) {
  cx.fillStyle = color;
  cx.fillRect(x, y, w == null ? 1 : w, h == null ? 1 : h);
}
// 구형 16px 스프라이트를 확대해 쓰는 래퍼 (현재 스테이지에서 안 쓰는 타일용)
function makeLegacySprite(drawFn) {
  return makeSprite(cx => { cx.save(); cx.scale(2, 2); drawFn(cx, 16); cx.restore(); });
}

function buildSprites() {
  // ── 기본 바닥/벽 (다른 스프라이트의 베이스가 되므로 가장 먼저) ──

  // 복도 바닥 - 매끈한 회청색 비닐장판, 64px 세밀
  function drawVinyl(cx, seed) {
    P(cx,"#565c6a",0,0,64,64);
    P(cx,"#5e6472",0,0,64,1);                      // 미세한 반사 띠
    P(cx,"#4c5160",0,63,64,1);
    // 큰 장판 줄눈 (아주 옅게, 타일 경계)
    P(cx,"#4e5462",(seed%2)*32,0,1,64);
    P(cx,"#525868",0,(seed%2)*32,64,1);
    // 은은한 광택 / 얼룩
    P(cx,"rgba(255,255,255,0.05)",10,12,28,14);
    P(cx,"rgba(0,0,0,0.05)",36+(seed*7)%10,38,18,12);
    // 미세 점박이 (1px = 더 잘게)
    const dots = [[14,44],[44,18],[26,28],[52,50],[8,34],[58,12],[34,56],[20,8],[48,36],[12,22]];
    dots.forEach(([x,y],i)=>P(cx, i%2 ? "#505664" : "#606676", (x+seed*3)%62, (y+seed*5)%62, 1,1));
  }
  floorVariants.length = 0;
  floorVariants.push(
    makeSpriteHi(cx => drawVinyl(cx, 0)),
    makeSpriteHi(cx => drawVinyl(cx, 1)),
    makeSpriteHi(cx => drawVinyl(cx, 2)),
    makeSpriteHi(cx => drawVinyl(cx, 3))
  );
  sprites[TILE_FLOOR] = floorVariants[0];

  // 따뜻한 원목 마룻바닥 (교실) - 64px 세밀, 가로 판자
  function drawWarmFloor(cx, seed) {
    P(cx,"#5c4632",0,0,64,64);
    for (let i = 0; i < 4; i++) {
      const y = i * 16;
      P(cx,"#96704c",0,y,64,14);                   // 판자 본면
      P(cx,"#a87e56",0,y,64,1);                    // 윗면 하이라이트
      P(cx,"#8a6440",0,y+1,64,1);                  // 부드러운 결
      P(cx,"#6e5236",0,y+14,64,2);                 // 판자 사이 틈
      const off = ((i + seed) % 2) * 32 + 16;      // 이음새 엇갈림
      P(cx,"#6e5236",off,y,1,14);
      // 나뭇결 (가는 줄 여러개)
      P(cx,"#876446",(seed*7+i*11)%44+4, y+5, 14,1);
      P(cx,"#9e7850",(seed*13+i*5)%40+8, y+9, 10,1);
      P(cx,"#82603e",(seed*5+i*7)%48+6, y+12, 8,1);
    }
  }
  classFloorVariants.length = 0;
  classFloorVariants.push(
    makeSpriteHi(cx => drawWarmFloor(cx, 0)),
    makeSpriteHi(cx => drawWarmFloor(cx, 1)),
    makeSpriteHi(cx => { drawWarmFloor(cx, 2);
      P(cx,"#6e5236",12,20,24,1); P(cx,"#6e5236",34,22,14,1);  // 긁힌 자국
    }),
    makeSpriteHi(cx => { drawWarmFloor(cx, 1);
      P(cx,"rgba(40,26,14,0.28)",34,34,22,18);                 // 햇빛 닳은 얼룩
    })
  );

  // 대리석 바닥 (중앙홀) - 밝음/어두움 체크무늬, 64px 세밀
  function drawMarble(cx, light) {
    const base = light ? "#4a4a5a" : "#3a3a48";
    P(cx, base, 0,0,64,64);
    P(cx, light ? "#565666" : "#444452", 0,0,64,1);
    P(cx, light ? "#565666" : "#444452", 0,0,1,64);
    P(cx,"#2a2a36",63,0,1,64); P(cx,"#2a2a36",0,63,64,1);
    // 대리석 결 (가는 사선 줄무늬 - 여러 갈래)
    const vein = light ? "#5c5c6e" : "#46465a";
    P(cx, vein, 8,12,22,1); P(cx, vein, 16,15,26,1); P(cx, vein, 36,18,18,1);
    P(cx, vein, 12,38,18,1); P(cx, vein, 24,41,30,1); P(cx, vein, 40,54,20,1);
    const vein2 = light ? "#525262" : "#404052";
    P(cx, vein2, 28,26,26,1); P(cx, vein2, 4,50,22,1); P(cx, vein2, 44,8,14,1);
    // 잔결 (더 가늘게)
    const vein3 = light ? "#54546a" : "#42425a";
    P(cx, vein3, 10,28,8,1); P(cx, vein3, 50,44,10,1); P(cx, vein3, 32,48,12,1);
    P(cx, vein3, 18,6,9,1); P(cx, vein3, 6,20,7,1);
  }
  marbleVariants.length = 0;
  marbleVariants.push(
    makeSpriteHi(cx => drawMarble(cx, true)),
    makeSpriteHi(cx => drawMarble(cx, false))
  );
  sprites[TILE_MARBLE] = marbleVariants[0];

  // 벽 - 패널 + 몰딩 + 굽도리
  sprites[TILE_WALL] = makeSprite(cx => {
    P(cx,"#3e3e4a",0,0,32,32);
    P(cx,"#5a5a68",0,0,32,3);                      // 천장 몰딩

function makeEmptyMap(fill) {
  const m = [];
  for (let r = 0; r < MAP_H; r++) {
    const row = [];
    for (let c = 0; c < MAP_W; c++) row.push(fill);
    m.push(row);
  }
  return m;
}
function fillRect(m, x1, y1, x2, y2, tile) {
  for (let r = y1; r <= y2; r++) for (let c = x1; c <= x2; c++)
    if (r >= 0 && r < MAP_H && c >= 0 && c < MAP_W) m[r][c] = tile;
}
function rectBorder(m, x1, y1, x2, y2, tile) {
  for (let c = x1; c <= x2; c++) { m[y1][c] = tile; m[y2][c] = tile; }
  for (let r = y1; r <= y2; r++) { m[r][x1] = tile; m[r][x2] = tile; }
}

    triggers[triggers.length - 1].isPuzzle = (i === puzzleIdx);   // 이 문이 '문제 교실'인가
  });

  // 교실 내부(2층 맵) - 스테이지1과 똑같은 교실. 모든 문이 같은 교실로 들어간다.
  buildCorridorClassroom(map2);
  state.inClassroom = false;
}

// 복도에서 들어가는 교실 내부 - 스테이지1 교실과 동일한 배치 + 복도로 나가는 문 + 칠판 트리거
function buildCorridorClassroom(m) {
  fillRect(m, 18, 10, 31, 22, TILE_FLOOR);
  rectBorder(m, 18, 10, 31, 22, TILE_WALL);
  // 북쪽 벽: 게시판 + 칠판 + 시계
  m[11][19] = TILE_BOARD;
  for (let c = 20; c <= 29; c++) m[11][c] = TILE_CHALK;
  m[11][30] = TILE_CLOCK;
  // 양쪽 벽: 달빛 창문
  [13, 15, 17, 20].forEach(r => { m[r][18] = TILE_WINDOW; });
  [14, 17, 20].forEach(r => { m[r][31] = TILE_WINDOW; });
  // 책상 - 줄 맞춰 정렬된 4열(가운데 통로)
  [21, 23, 27, 29].forEach(c => {
    [14, 16, 18].forEach(r => { m[r][c] = TILE_DESK; });
  });
  // 좌우 사물함/책장 (장식)
  m[13][19] = TILE_LOCKER; m[16][19] = TILE_LOCKER; m[19][19] = TILE_LOCKER; m[21][19] = TILE_PLANT;
  m[13][30] = TILE_BOOKSHELF; m[14][30] = TILE_LOCKER; m[16][30] = TILE_BOOKSHELF;
  m[19][30] = TILE_LOCKER; m[21][30] = TILE_PLANT;
  // 교탁
  m[12][24] = TILE_PODIUM;
  // 바닥: 흩어진 시험지
  m[15][22] = TILE_PAPER; m[17][26] = TILE_PAPER; m[20][28] = TILE_PAPER;
  // 복도로 나가는 문 (남쪽) - 밟으면 복도로 돌아간다
  m[22][24] = TILE_DOOR;
  m[22][25] = TILE_DOOR;
  // 숨는 곳 (청소도구함) - 경비 아저씨 피신처
  m[12][20] = TILE_HIDE;
  m[12][29] = TILE_HIDE;

  // 칠판 문제 트리거 (2층) - '문제 교실'로 들어왔을 때만 활성화 (enterClassroom에서 제어)
  registerTrigger(2, 24, 11, "chalk", "칠판");
  triggers[triggers.length - 1].reusable = true;
  triggers[triggers.length - 1].used = true;   // 기본 비활성 (문제 교실 진입 시 켠다)
}

// Stage 3: 1층 중앙홀 - 기념 석상을 중심으로 한 전시·기념홀 (박물관식 회랑)
function buildStage3Central() {
  // 대리석 체크무늬 바닥
  fillRect(map1, 12, 10, 37, 22, TILE_MARBLE);
  rectBorder(map1, 12, 10, 37, 22, TILE_WALL);

  // 중심축(24.5) 기준 좌우대칭 헬퍼
  const mir = c => 49 - c;
  const sym = (r, c, tile) => { map1[r][c] = tile; map1[r][mir(c)] = tile; };

  // ── 북쪽 벽: 달빛 창문 (좌우대칭) ──
  [14, 16, 19].forEach(c => { map1[10][c] = TILE_WINDOW; map1[10][mir(c)] = TILE_WINDOW; });

  // ── 북쪽 전시 벽(row 11): 트로피·기념패 진열장 + 거울 + 안내데스크 + 중앙 안내 게시판 ──
  for (let c = 22; c <= 27; c++) map1[11][c] = TILE_CHALK;   // 중앙 안내 게시판
  sym(11, 13, TILE_MIRROR);
  sym(11, 15, TILE_TROPHY);
  sym(11, 17, TILE_TROPHY);
  sym(11, 19, TILE_INFODESK);
  sym(11, 20, TILE_TROPHY);
  sym(11, 21, TILE_TROPHY);

  // ── 양쪽 벽을 따라 늘어선 관람 벤치 + 끝에 화분 (전시 회랑) ──
  [13, 14, 16, 17, 19].forEach(r => sym(r, 14, TILE_BENCH));
  sym(12, 14, TILE_PLANT);
  sym(20, 14, TILE_PLANT);

  // ── 중앙 기념 석상 단(壇): 카펫 위 2x2 석상, 네 모서리에 대리석 기둥 ──
  fillRect(map1, 23, 13, 26, 17, TILE_RUG);   // 카펫 단 (cols 23-26, rows 13-17)
  map1[15][24] = TILE_STATUE; map1[15][25] = TILE_STATUE;
  map1[16][24] = TILE_STATUE; map1[16][25] = TILE_STATUE;
  sym(13, 22, TILE_PILLAR); sym(18, 22, TILE_PILLAR);   // 단 네 모서리 기둥 (22·27)
  sym(13, 20, TILE_PLANT);                              // 단 옆 화분 (20·29)

  // ── 기념 석상 → 정문 붉은 카펫 통로 (통과 가능) ──
  for (let r = 18; r <= 21; r++) { map1[r][24] = TILE_RUG; map1[r][25] = TILE_RUG; }
  map1[21][23] = TILE_RUG; map1[21][26] = TILE_RUG;   // 정문 앞 환영 매트

  // ── 바닥에 흩어진 종이 (통과 가능) ──
  map1[12][20] = TILE_PAPER;
  map1[19][29] = TILE_PAPER;

  // ── 정문 (잠김) ──
  for (let c = 23; c <= 26; c++) map1[22][c] = TILE_LOCKED_DOOR;
  stageExitDoors.push(
    { tx: 23, ty: 22 }, { tx: 24, ty: 22 },
    { tx: 25, ty: 22 }, { tx: 26, ty: 22 }
  );

  // ── 숨는 곳 (전시 회랑의 캐비닛) - 경비원 피신처 (좌우대칭) ──
  sym(13, 17, TILE_HIDE);
  sym(19, 17, TILE_HIDE);

  // ── 단서 트리거 ──
  registerTrigger(1, 24, 11, "chalk", "안내 게시판");
  registerTrigger(1, 13, 11, "mirror", "서쪽 거울");
  registerTrigger(1, 36, 11, "mirror", "동쪽 거울");
  registerTrigger(1, 15, 11, "trophy", "서쪽 트로피장");
  registerTrigger(1, 34, 11, "trophy", "동쪽 트로피장");
  registerTrigger(1, 20, 11, "trophy", "우승기 진열장");
  registerTrigger(1, 29, 11, "trophy", "기념패 진열장");
  registerTrigger(1, 24, 16, "statue", "기념 석상");
  registerTrigger(1, 14, 16, "bench", "서쪽 관람석");
  registerTrigger(1, 35, 16, "bench", "동쪽 관람석");
}

function registerTrigger(floor, tx, ty, type, label) {
  triggers.push({ floor, tx, ty, type, label, used:false });
}

function registerTrap(floor, tx, ty) {
  traps.push({ floor, tx, ty, armed:true });
}

// 함정 밟기 검사 - 무장된 함정 위에 올라서면 발동, 벗어나면 재무장
function checkTraps() {
  const ptx = Math.floor(player.x / TILE), pty = Math.floor(player.y / TILE);
  for (const tp of traps) {
    if (tp.floor !== state.currentFloor) continue;
    const on = (tp.tx === ptx && tp.ty === pty);
    if (on && tp.armed) { tp.armed = false; springTrap(); }
    else if (!on && !tp.armed) { tp.armed = true; }
  }
}

function springTrap() {
  state.timeLeft = Math.max(0, state.timeLeft - 30);
  updateTimerHud();
  const ov = document.getElementById("glitch-overlay");
  if (ov) { ov.style.background = "rgba(200,40,60,0.30)"; setTimeout(() => ov.style.background = "transparent", 320); }
  showToast("⚠️ 함정! 바닥이 꺼졌다 — 시간 30초 손실", { warn:true, duration: 2600 });
}

// 교실 5종 구조 변형
function buildClassroomVariant(m, yOffset, cStart, variant) {
  // variant 0: 표준 줄 책상 (4개)
  // variant 1: 원형 배치 (벽 따라)
  // variant 2: 흐트러진 배치 (혼돈)
  // variant 3: 미술실 (책상 + 칠판 이젤)
  // variant 4: 과학실 (긴 실험대)
  const r2 = yOffset;
  if (variant === 0) {
    // 줄 - 2x2
    for (let r = 4; r <= 6; r += 2)
      for (let c = cStart+2; c <= cStart+6; c += 2)
        m[r+r2][c] = TILE_DESK;
  } else if (variant === 1) {
    // 원형 (가장자리)
    m[3+r2][cStart+2] = TILE_DESK; m[3+r2][cStart+6] = TILE_DESK;
    m[7+r2][cStart+2] = TILE_DESK; m[7+r2][cStart+6] = TILE_DESK;
    m[5+r2][cStart+1] = TILE_DESK; m[5+r2][cStart+7] = TILE_DESK;
  } else if (variant === 2) {
    // 혼돈 - 흩어진 배치
    m[3+r2][cStart+4] = TILE_DESK;
    m[4+r2][cStart+2] = TILE_DESK;
    m[5+r2][cStart+5] = TILE_DESK;
    m[6+r2][cStart+3] = TILE_DESK;
    m[7+r2][cStart+6] = TILE_DESK;
    m[7+r2][cStart+1] = TILE_DESK;
  } else if (variant === 3) {
    // 미술실 - 이젤(칠판)이 가운데에
    m[4+r2][cStart+3] = TILE_CHALK;
    m[4+r2][cStart+5] = TILE_CHALK;
    m[6+r2][cStart+2] = TILE_CHALK;
    m[6+r2][cStart+6] = TILE_CHALK;
    m[5+r2][cStart+4] = TILE_DESK;
  } else if (variant === 4) {
    // 과학실 - 긴 실험대 2줄
    for (let c = cStart+2; c <= cStart+6; c++) m[4+r2][c] = TILE_DESK;
    for (let c = cStart+2; c <= cStart+6; c++) m[7+r2][c] = TILE_DESK;
  }
}

function currentMap() { return state.currentFloor === 1 ? map1 : map2; }

// ──────────────────────────────────────────
// 입력
// ──────────────────────────────────────────
const keys = {};
window.addEventListener("keydown", e => {
  // 입력창(초성게임·로그인 등)에 타이핑 중엔 게임 단축키 무시
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "e") tryInteract();
  if (e.key.toLowerCase() === "m") toggleMap();   // 지도 켜기/끄기
  if (e.key.toLowerCase() === "x") toggleQuest();  // 퀘스트 창 켜기/끄기
  // 디버그: Alt + 1/2/3 → 해당 스테이지로 바로 이동 (테스트용)
  if (e.altKey && (e.key === "1" || e.key === "2" || e.key === "3")) { warpToStage(parseInt(e.key, 10)); }
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

const gamepadState = { connected:false, prevButtons:{} };
window.addEventListener("gamepadconnected", e => {
  gamepadState.connected = true;
  const el = document.getElementById("gamepad-status");
  el.textContent = "🎮 " + e.gamepad.id; el.classList.add("on");
});
window.addEventListener("gamepaddisconnected", () => {
  gamepadState.connected = false;
  const el = document.getElementById("gamepad-status");
  el.textContent = "게임패드 미연결"; el.classList.remove("on");
});

function pollGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let lx=0, ly=0, interact=false;
  const dz = 0.18;
  for (const p of pads) {
    if (!p) continue;
    lx += Math.abs(p.axes[0]||0) < dz ? 0 : p.axes[0];
    ly += Math.abs(p.axes[1]||0) < dz ? 0 : p.axes[1];
    for (const i of [0,1,2,3,5,7]) {
      const b = p.buttons[i]; if (!b) continue;
      const key = `${p.index}_${i}`;
      const was = gamepadState.prevButtons[key];
      if (b.pressed && !was) interact = true;
      gamepadState.prevButtons[key] = b.pressed;
    }
  }
  return { lx, ly, interact };
}

// ──────────────────────────────────────────
// 충돌 + 이동
// ──────────────────────────────────────────
function isSolidAt(map, wx, wy) {
  const tx = Math.floor(wx / TILE), ty = Math.floor(wy / TILE);
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return true;
  return SOLID.has(map[ty][tx]);
}

function tryMove(dx, dy) {
  const m = currentMap();
  const r = player.size;
  // X
  const newX = player.x + dx;
  if (!isSolidAt(m, newX - r, player.y - r) &&
      !isSolidAt(m, newX + r, player.y - r) &&
      !isSolidAt(m, newX - r, player.y + r) &&
      !isSolidAt(m, newX + r, player.y + r)) {
    player.x = newX;
  }
  // Y
  const newY = player.y + dy;
  if (!isSolidAt(m, player.x - r, newY - r) &&
      !isSolidAt(m, player.x + r, newY - r) &&
      !isSolidAt(m, player.x - r, newY + r) &&
      !isSolidAt(m, player.x + r, newY + r)) {
    player.y = newY;
  }
  // 운동장 / 화장실 입구의 ENTRANCE / DOOR 는 통과 (solid 아님)
  // 계단 자동 트리거
  checkStairAuto();
}

function checkStairAuto() {
  const tx = Math.floor(player.x / TILE), ty = Math.floor(player.y / TILE);
  const tile = currentMap()[ty][tx];
  if (tile === TILE_STAIRS_UP || tile === TILE_STAIRS_DOWN) {
    const link = stairLinks.find(s => s.floor === state.currentFloor && s.tx === tx && s.ty === ty);
    if (link) {
      state.currentFloor = link.target.floor;
      mapCacheDirty = true;   // 층이 바뀌면 맵 캐시 다시 그림
      player.x = link.target.tx * TILE + TILE/2;
      // 항상 계단 남쪽(row+1) = 복도 바닥에 떨어진다.
      // 북쪽(row-1)은 1F에서 사물함 줄이라 끼임 발생.
      player.y = (link.target.ty + 1) * TILE + TILE/2;
    }
  }
}

// 화면을 빨갛게 times번 번쩍인 뒤 onDone 실행
function redFlash(times, onDone) {
  const el = document.getElementById("red-flash");
  if (!el) { if (onDone) onDone(); return; }
  let n = 0;
  const blink = () => {
    if (n >= times) { if (onDone) onDone(); return; }
    el.classList.add("on");
    setTimeout(() => {
      el.classList.remove("on");
      n++;
      setTimeout(blink, 130);
    }, 150);
  };
  blink();
}

// 복도의 갈색 문 → 교실 내부(2층 맵)로 들어간다
function enterClassroom(doorTrigger) {
  state.roomReturn = { tx: doorTrigger.tx, ty: doorTrigger.ty };   // 나올 때 돌아올 복도 문
  state.classroomIsPuzzle = !!doorTrigger.isPuzzle;
  state.inClassroom = true;
  state.currentFloor = 2;
  mapCacheDirty = true;
  // 교실 입구(남쪽 문 안쪽)에 배치
  player.x = 24 * TILE + TILE / 2;
  player.y = 20 * TILE + TILE / 2;
  player.dir = "up";
  // 동행 친구도 함께 따라 들어온다
  if (companion.active) { companion.x = player.x - TILE; companion.y = player.y; }
  // 칠판 트리거: 문제 교실이면 활성화(아직 다 못 모았을 때), 아니면 비활성
  const chalk = triggers.find(t => t.floor === 2 && t.type === "chalk");
  if (chalk) chalk.used = !(state.classroomIsPuzzle && state.keyFragments.length < state.totalRequired);

  // 이미 경비원이 쫓고 있었다면 이 교실로 따라 들어온다 (좌표 재배치)
  if (guard.active) spawnGuard(true);

  if (state.classroomIsPuzzle) {
    showToast("교실에 들어왔다. 칠판에서 문제를 풀 수 있을 것 같다.", { duration: 3500 });
  } else {
    // 올바르지 않은 교실 - 화면이 두 번 빨개진 뒤 경비 아저씨에게 들킨다
    redFlash(2, () => {
      showToast("경비아저씨가 순찰을 돌던 교실에 들어와 들켰다!", { warn: true, duration: 4500 });
      spawnGuard(true);   // 교실 안에 경비원 등장 (조용히)
    });
  }
}

// 교실 → 복도로 나간다 (남쪽 문을 밟거나 E)
function exitClassroom() {
  if (!state.inClassroom) return;
  const d = state.roomReturn || { tx: 24, ty: 13 };
  state.inClassroom = false;
  state.currentFloor = 1;
  mapCacheDirty = true;
  // 문보다 한 칸 앞(복도 바닥, rows 14~15)에 주인공·수아·리온을 나란히 배치
  const frontRow = (d.ty === 13) ? 14 : 15;   // 북쪽 문이면 아래로, 남쪽 문이면 위로 한 칸
  const fy = frontRow * TILE + TILE / 2;
  player.x = d.tx * TILE + TILE / 2;
  player.y = fy;
  player.dir = (d.ty === 13) ? "down" : "up";
  player.hidden = false;
  if (companion.active) { companion.x = (d.tx - 1) * TILE + TILE / 2; companion.y = fy; companion.hidden = false; }
  if (boy.active) { boy.x = (d.tx + 1) * TILE + TILE / 2; boy.y = fy; boy.hidden = false; }
  // 경비원이 쫓고 있었다면 복도로 따라 나온다 (위치 재배치)
  if (guard.active) spawnGuard(true);
}

// ── 교실에서 복도로 나올 때: 경비원은 천천히 복도 끝으로, 셋은 사물함에 숨는 컷신 ──
function showBottomDialogue(text, speaker) {
  const el = document.getElementById("bottom-dialogue");
  if (!el) return;
  document.getElementById("bd-spk").textContent = speaker || "";
  document.getElementById("bd-text").textContent = text;
  el.style.display = "block";
}
function hideBottomDialogue() {
  const el = document.getElementById("bottom-dialogue");
  if (el) el.style.display = "none";
}

const hideCut = { active: false, t: 0, guardTarget: null, cast: [], dialogueShown: false };
let hideCutsceneDone = false;   // 숨기 컷신은 게임 중 처음 한 번만 재생

// refTx, refTy 근처의 사물함에 숨고, 경비원은 반대쪽 복도 끝으로 천천히 지나간다.
function startHideCutscene(refTx, refTy) {
  const m = currentMap();
  // 복도의 숨는 곳(사물함/청소도구함) 후보 - 기준 위치에서 가까운 순
  const spots = [];
  for (let r = 0; r < MAP_H; r++)
    for (let c = 0; c < MAP_W; c++)
      if (m[r][c] === TILE_HIDE) spots.push({ tx: c, ty: r });
  spots.sort((a, b) =>
    ((a.tx - refTx) ** 2 + (a.ty - refTy) ** 2) - ((b.tx - refTx) ** 2 + (b.ty - refTy) ** 2));
  // 주인공·수아·리온 (합류한 친구만)
  hideCut.cast = [player, companion.active ? companion : null, boy.active ? boy : null].filter(Boolean);
  hideCut.cast.forEach((c, i) => {
    const s = spots[i % (spots.length || 1)] || { tx: refTx, ty: 15 };
    c.hideTarget = { x: (s.tx + 0.5) * TILE, y: (s.ty + 0.5) * TILE };
    c.hidden = false;
  });
  // 경비원: 없으면 등장시켜, 플레이어 반대쪽 복도 끝으로 순찰하듯 천천히 지나간다
  const playerWest = refTx < 24;
  guard.active = true; guard.mode = "leave"; guard.leaving = true; guard.grace = 0;
  guard.x = (playerWest ? 30 : 19) * TILE + TILE / 2;   // 기준 위치 반대쪽에서 시작
  guard.y = 14 * TILE + TILE / 2;
  guard._px = guard.x;
  hideCut.guardTarget = playerWest
    ? { x: 43 * TILE + TILE / 2, y: 14 * TILE + TILE / 2 }   // 동쪽 끝으로 퇴장
    : { x: 6 * TILE + TILE / 2, y: 14 * TILE + TILE / 2 };   // 서쪽 끝으로 퇴장
  hideCut.active = true;
  hideCut.t = 0;
  hideCut.dialogueShown = false;
  state.timerActive = false;   // 컷신 동안 제한 시간 정지
}

function updateHideCutscene(dt) {
  hideCut.t += dt;
  const m = currentMap();
  // 경비원 천천히 복도 끝으로
  stepToward(guard, hideCut.guardTarget.x, hideCut.guardTarget.y, 95 * dt, m);
  if (guard.x < guard._px - 0.3) guard.face = "left";
  else if (guard.x > guard._px + 0.3) guard.face = "right";
  guard._px = guard.x;
  // 셋이 사물함으로 숨기
  let allHidden = true;
  for (const c of hideCut.cast) {
    if (c.hidden) continue;
    stepToward(c, c.hideTarget.x, c.hideTarget.y, 135 * dt, m);
    const dx = c.x - c.hideTarget.x, dy = c.y - c.hideTarget.y;
    if (dx * dx + dy * dy < (TILE * 0.25) ** 2) {
      c.x = c.hideTarget.x; c.y = c.hideTarget.y; c.hidden = true; c.dir = "up";
    } else allHidden = false;
  }
  // 모두 숨었거나, 너무 오래 걸리면(경로 막힘 대비) 강제로 숨김 처리 후 대화창
  const timeUp = hideCut.t > 5;
  if ((allHidden || timeUp) && !hideCut.dialogueShown) {
    for (const c of hideCut.cast) {
      if (c.hideTarget) { c.x = c.hideTarget.x; c.y = c.hideTarget.y; }
      c.hidden = true; c.dir = "up";
    }
    hideCut.dialogueShown = true;
    showBottomDialogue("앞으로도 나오면 이렇게 숨으면 되겠네..", "나");
  }
  // 경비원이 충분히 멀어졌거나 시간이 지나면 종료 (무한 컷신 방지)
  const far = (guard.x - player.x) ** 2 + (guard.y - player.y) ** 2 > (TILE * 8) ** 2;
  if (hideCut.dialogueShown && (far || hideCut.t > 8)) endHideCutscene();
}

function endHideCutscene() {
  hideCut.active = false;
  guard.active = false;          // 경비원이 복도 끝으로 사라짐 → 위협 해제
  guard.mode = "chase"; guard.leaving = false;
  guardTriggered = false; guardPending = false;   // 인트로 연출일 뿐 - 본 게임 경비원 각성은 아님
  state.timerActive = true;
  lastTime = performance.now();
  setTimeout(hideBottomDialogue, 2800);
  showToast("휴… 경비 아저씨가 멀어졌다.", { duration: 2500 });
}

// 교실 안에서 남쪽 문을 밟으면 자동으로 복도로 나간다
function checkClassroomDoorAuto() {
  if (!state.inClassroom || state.currentFloor !== 2) return;
  const tx = Math.floor(player.x / TILE), ty = Math.floor(player.y / TILE);
  if (currentMap()[ty][tx] === TILE_DOOR) exitClassroom();
}

// 머리 위 왕관 (초성게임 고수 칭호) - 살짝 반짝이는 금색
function drawCrown(cxp, topY) {
  const g = 0.85 + 0.15 * Math.sin(Date.now() / 300);
  ctx.fillStyle = `rgba(244,208,63,${g})`;
  ctx.beginPath();
  ctx.moveTo(cxp - 9, topY + 7);
  ctx.lineTo(cxp - 9, topY);
  ctx.lineTo(cxp - 4.5, topY + 5);
  ctx.lineTo(cxp, topY - 3);
  ctx.lineTo(cxp + 4.5, topY + 5);
  ctx.lineTo(cxp + 9, topY);
  ctx.lineTo(cxp + 9, topY + 7);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#e0a020"; ctx.fillRect(cxp - 9, topY + 7, 18, 3);   // 받침
  ctx.fillStyle = "#e8513f"; ctx.fillRect(cxp - 1.2, topY + 6, 2.6, 2.6);  // 가운데 보석
  ctx.fillStyle = "#4f78e0"; ctx.fillRect(cxp - 7, topY + 7, 2, 2);
  ctx.fillStyle = "#4fd07a"; ctx.fillRect(cxp + 5, topY + 7, 2, 2);
}

// 책상 위 보드게임 아이콘 (체크무늬 판 + 말 두 개 + 노란 반짝임)
function drawBoardGameIcon(cx, cy) {
  const bob = Math.sin(Date.now() / 500) * 1.5;
  const y = cy - 18 + bob;
  ctx.fillStyle = "#5a3a1e"; ctx.fillRect(cx - 9, y - 1, 18, 15);     // 판 테두리
  ctx.fillStyle = "#d8b270"; ctx.fillRect(cx - 8, y, 16, 13);          // 판 바탕
  ctx.fillStyle = "#6b4a2a";                                            // 체크무늬
  for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++)
    if ((i + j) % 2) ctx.fillRect(cx - 8 + i * 4, y + j * 4.3, 4, 4.3);
  ctx.fillStyle = "#e85050"; ctx.fillRect(cx - 5, y + 2, 3, 3);        // 빨강 말
  ctx.fillStyle = "#4f78e0"; ctx.fillRect(cx + 3, y + 7, 3, 3);        // 파랑 말
  // 노란 반짝임 (✦) - 판 위에서 깜빡임
  if ((Date.now() / 280) % 2 < 1) {
    const sy = cy - 27 + bob;
    ctx.fillStyle = "#d8c88e"; ctx.fillRect(cx - 1, sy, 4, 4);
    ctx.fillStyle = "#e8dcae";
    ctx.fillRect(cx - 4, sy + 1, 2, 2);
    ctx.fillRect(cx + 4, sy + 1, 2, 2);
    ctx.fillRect(cx, sy - 4, 2, 2);
    ctx.fillRect(cx, sy + 5, 2, 2);
  }
}

const CHO_LIST = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
// 비교용 초성 키 (공백 없음). 쌍자음은 같은 자음으로도 맞게 단일자음으로도 정규화
const CHO_NORM = { "ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ" };
function choKey(s) {
  s = (s || "").normalize("NFC");   // 분해형 입력도 조합형으로 통일
  let out = "";
  for (const ch of s) {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code >= 0 && code <= 11171) { let c = CHO_LIST[Math.floor(code / 588)]; out += (CHO_NORM[c] || c); }
  }
  return out;
}
function chosungOf(s) {   // 화면 표시용 (공백으로 띄움)
  return choKey(s).split("").join(" ");
}

let chosungState = null;
function openChosungGame() {
  state.phase = PHASE.PUZZLE;
  state.timerActive = false;          // 게임 동안 제한 시간 정지
  showOverlay(true);
  const rounds = [];
  for (let i = 0; i < 5; i++) {
    const t = CHOSUNG_TOPICS[Math.floor(Math.random() * CHOSUNG_TOPICS.length)];
    const word = t.words[Math.floor(Math.random() * t.words.length)];
    const key = choKey(word);
    // 같은 주제에서 초성이 일치하는 단어는 모두 정답
    const answers = Array.from(new Set(t.words.filter(w => choKey(w) === key)));
    rounds.push({ topic: t.topic, key, answers });
  }
  chosungState = { rounds, idx: 0, score: 0 };
  renderChosungRound();
}

function renderChosungRound() {
  const cs = chosungState;
  if (!cs) return;
  if (cs.idx >= cs.rounds.length) { renderChosungResult(); return; }
  const round = cs.rounds[cs.idx];
  panel.className = "panel";
  panel.innerHTML = `<h1>🎲 초성게임</h1>
    <p style="font-size:14px;color:var(--muted)">주제에 맞고 초성이 같은 단어면 모두 정답! (${cs.idx + 1}/${cs.rounds.length}) · 점수 ${cs.score}</p>
    <div class="question-card">
      <p style="text-align:center;margin:4px 0 2px">
        <span style="font-size:13px;color:var(--muted)">주제</span><br>
        <span style="font-size:24px;color:#c8b0e8;font-weight:bold">📚 ${round.topic}</span>
      </p>
      <p style="font-size:42px;letter-spacing:10px;text-align:center;color:var(--accent);margin:8px 0">${round.key.split("").join(" ")}</p>
      <input id="cho-input" autocomplete="off" placeholder="정답을 입력하세요" />
      <p class="status" id="cho-status"></p>
      <p style="text-align:right">
        <button id="cho-skip">모르겠어요</button>
        <button class="primary" id="cho-submit">제출 ▶</button>
      </p>
    </div>
    <p style="text-align:right"><button id="cho-quit">그만하기</button></p>`;
  const input = document.getElementById("cho-input");
  setTimeout(() => input && input.focus(), 30);
  const lock = () => {
    document.getElementById("cho-submit").disabled = true;
    document.getElementById("cho-skip").disabled = true;
    input.disabled = true;
  };
  const next = () => { cs.idx++; setTimeout(renderChosungRound, 1300); };
  const submit = () => {
    // 한글 입력은 분해형(NFD)으로 올 수 있어 조합형(NFC)으로 정규화해야 비교가 맞는다
    const val = (input.value || "").replace(/\s/g, "").normalize("NFC");
    if (!val) return;
    const status = document.getElementById("cho-status");
    // 주제에 맞는 단어(목록 + 초성 일치)만 정답. 주제를 벗어나면 오답.
    if (round.answers.includes(val)) {
      cs.score++;
      status.textContent = `정답! 🎉  (예: ${round.answers.join(", ")})`;
      status.style.color = "var(--accent)";
    } else if (choKey(val) === round.key) {
      status.textContent = `❌ 주제 '${round.topic}'에서 벗어난 단어예요! 정답 예: ${round.answers.join(", ")}`;
      status.style.color = "var(--warn)";
    } else {
      status.textContent = `❌ 틀렸어요. 정답 예: ${round.answers.join(", ")}`;
      status.style.color = "var(--warn)";
    }
    lock(); next();
  };
  document.getElementById("cho-submit").onclick = submit;
  input.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } };
  document.getElementById("cho-skip").onclick = () => {
    document.getElementById("cho-status").textContent = `정답 예: ${round.answers.join(", ")}`;
    document.getElementById("cho-status").style.color = "var(--muted)";
    lock(); next();
  };
  document.getElementById("cho-quit").onclick = closeChosungGame;
}

function renderChosungResult() {
  const cs = chosungState;
  const perfect = cs.score === cs.rounds.length;
  // 5문제 만점 → '초성게임 고수' 칭호 + 왕관 + 속도 버프 (처음 한 번 지급)
  let rewardMsg = "";
  if (perfect) {
    if (!state.choMaster) {
      state.choMaster = true;
      state.speedBuff = true;
      player.speed = 572;   // 기본 440 → 약 1.3배
      rewardMsg = `<p style="font-size:17px;color:#f4d03f">👑 <b>초성게임 고수</b> 칭호 획득!</p>
