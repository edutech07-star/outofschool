function closeChosungGame() {
  chosungState = null;
  showOverlay(false);
  state.phase = PHASE.EXPLORATION;
  state.timerActive = true;
  lastTime = performance.now();
}

// ── 마지막 시험: 지뢰찾기 (최종 정문에서 마지막 열쇠를 다 모은 뒤) ──
let mineState = null;
function openMinesweeper() {
  state.phase = PHASE.PUZZLE;
  state.timerActive = false;     // 시험 동안 제한 시간 정지
  showOverlay(true);
  const N = 8, M = 10;
  mineState = { N, M, mines: new Set(), counts: new Array(N * N).fill(0),
    revealed: new Set(), flagged: new Set(), started: false, dead: false, won: false };
  renderMinesweeper();
}

function msPlaceMines(safe) {
  const ms = mineState, N = ms.N;
  const safeZone = new Set();
  const sr = Math.floor(safe / N), sc = safe % N;   // 첫 클릭과 주변은 지뢰 없음
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const r = sr + dr, c = sc + dc;
    if (r >= 0 && r < N && c >= 0 && c < N) safeZone.add(r * N + c);
  }
  let placed = 0;
  while (placed < ms.M) {
    const i = Math.floor(Math.random() * N * N);
    if (ms.mines.has(i) || safeZone.has(i)) continue;
    ms.mines.add(i); placed++;
  }
  ms.counts = new Array(N * N).fill(0);
  for (const m of ms.mines) {
    const r = Math.floor(m / N), c = m % N;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < N && nc >= 0 && nc < N) ms.counts[nr * N + nc]++;
    }
  }
}

function msFloodReveal(start) {
  const ms = mineState, N = ms.N, stack = [start];
  while (stack.length) {
    const i = stack.pop();
    if (ms.revealed.has(i) || ms.flagged.has(i)) continue;
    ms.revealed.add(i);
    if (ms.counts[i] === 0 && !ms.mines.has(i)) {
      const r = Math.floor(i / N), c = i % N;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < N && nc >= 0 && nc < N) {
          const ni = nr * N + nc;
          if (!ms.revealed.has(ni)) stack.push(ni);
        }
      }
    }
  }
}

function msReveal(i) {
  const ms = mineState;
  if (!ms || ms.dead || ms.won) return;
  if (ms.flagged.has(i) || ms.revealed.has(i)) return;
  if (!ms.started) { msPlaceMines(i); ms.started = true; }
  if (ms.mines.has(i)) { ms.dead = true; for (const m of ms.mines) ms.revealed.add(m); renderMinesweeper(); return; }
  msFloodReveal(i);
  if (ms.revealed.size === ms.N * ms.N - ms.M) ms.won = true;
  renderMinesweeper();
}

function msFlag(i) {
  const ms = mineState;
  if (!ms || ms.dead || ms.won || ms.revealed.has(i)) return;
  if (ms.flagged.has(i)) ms.flagged.delete(i); else ms.flagged.add(i);
  renderMinesweeper();
}

function renderMinesweeper() {
  const ms = mineState;
  const COLORS = ["", "#6fa8ff", "#7ad07a", "#f08070", "#c89cff", "#f0c040", "#4fd0d0", "#e8e8e8", "#aaaaaa"];
  panel.className = "panel";
  let cells = "";
  for (let i = 0; i < ms.N * ms.N; i++) {
    if (ms.revealed.has(i)) {
      let label = "", style = "";
      if (ms.mines.has(i)) label = "💣";
      else if (ms.counts[i] > 0) { label = ms.counts[i]; style = `color:${COLORS[ms.counts[i]]}`; }
      cells += `<button class="ms-cell open" style="${style}" disabled>${label}</button>`;
    } else {
      const label = ms.flagged.has(i) ? "🚩" : "";
      cells += `<button class="ms-cell" data-i="${i}" ${(ms.dead || ms.won) ? "disabled" : ""}>${label}</button>`;
    }
  }
  const status = ms.won ? `<span style="color:var(--accent)">🎉 지뢰를 모두 피했다! 문이 열린다!</span>`
    : ms.dead ? `<span style="color:var(--warn)">💥 지뢰를 밟았다…!</span>`
    : `🚩 남은 깃발: ${ms.M - ms.flagged.size}`;
  panel.innerHTML = `<h1>🚪 마지막 시험 — 지뢰찾기</h1>
    <p style="font-size:15px;color:#c8b0e8">문이 말한다: "마지막 시험을 통과해야 나갈 수 있다…"</p>
    <p style="font-size:13px;color:var(--muted)">지뢰가 없는 칸을 모두 열어라. 클릭=열기, 우클릭=깃발 · ${ms.N}×${ms.N} · 지뢰 ${ms.M}개</p>
    <p class="status" style="text-align:center;font-size:16px">${status}</p>
    <div style="display:grid;grid-template-columns:repeat(${ms.N},32px);gap:3px;justify-content:center;margin:10px auto">${cells}</div>
    <p style="text-align:center">
      ${ms.won ? `<button class="primary" id="ms-go">문을 열고 나간다 ▶</button>`
        : ms.dead ? `<button class="primary" id="ms-retry">다시 도전</button> <button id="ms-quit">나중에 하기</button>`
        : `<button id="ms-quit">나중에 하기</button>`}
    </p>`;
  panel.querySelectorAll(".ms-cell:not([disabled])").forEach(b => {
    const i = +b.dataset.i;
    b.onclick = () => msReveal(i);
    b.oncontextmenu = (e) => { e.preventDefault(); msFlag(i); };
  });
  const go = document.getElementById("ms-go"); if (go) go.onclick = msWin;
  const retry = document.getElementById("ms-retry"); if (retry) retry.onclick = openMinesweeper;
  const quit = document.getElementById("ms-quit"); if (quit) quit.onclick = msQuit;
}

function msWin() {
  state.finalTestPassed = true;
  mineState = null;
  showOverlay(false);
  state.phase = PHASE.EXPLORATION;
  state.timerActive = true;
  lastTime = performance.now();
  gateGuardEvent();   // 마지막 시험 통과 → 정문 경비 아저씨 이벤트로
}

function msQuit() {
  mineState = null;
  showOverlay(false);
  state.phase = PHASE.EXPLORATION;
  state.timerActive = true;
  lastTime = performance.now();
  // 정문 타일에서 떨어진 스폰 지점으로 — 바로 다시 시험이 뜨지 않게
  const sp = stageCfg().spawn || { tx: 24, ty: 12 };
  player.x = sp.tx * TILE + TILE / 2;
  player.y = sp.ty * TILE + TILE / 2;
  showToast("정문: \"마지막 시험을 통과해야 나갈 수 있다…\"", { warn: true, duration: 3500 });
}

function tryInteract() {
  if (intro.active) { handleIntroInteract(); return; }   // 인트로 중엔 수아 깨우기로 가로챔
  if (state.phase !== PHASE.EXPLORATION) return;
  const tx = Math.floor(player.x / TILE), ty = Math.floor(player.y / TILE);
  const m = currentMap();
  // 1) 인접 잠긴 문 검사
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const nx = tx + dx, ny = ty + dy;
      if (ny < 0 || ny >= MAP_H || nx < 0 || nx >= MAP_W) continue;
      const t = m[ny][nx];
      if (t === TILE_LOCKED_DOOR) {
        showToast(`잠긴 정문 — 열쇠 조각 ${state.keyFragments.length}/${state.totalRequired}`, { warn: true });
        return;
      }
    }
  }
  // 1.5) 교실 안에서 남쪽 문 인접 시 복도로 나가기
  if (state.inClassroom && state.currentFloor === 2) {
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const nx = tx + dx, ny = ty + dy;
        if (ny < 0 || ny >= MAP_H || nx < 0 || nx >= MAP_W) continue;
        if (m[ny][nx] === TILE_DOOR) { exitClassroom(); return; }
      }
    }
  }

  // 2) 트리거 검사
  for (const t of triggers) {
    if (t.used) continue;
    if (t.floor !== state.currentFloor) continue;
    const d = Math.max(Math.abs(t.tx - tx), Math.abs(t.ty - ty));
    if (d <= 1) {
      // 복도의 갈색 문 - 교실 내부로 들어간다
      if (t.type === "door") { enterClassroom(t); return; }
      // 책상 위 보드게임 - 초성게임 (소모되지 않음, 열쇠 조각과 무관)
      if (t.type === "chosung") { openChosungGame(); return; }
      t.used = true; openPuzzle(t); return;
    }
  }
}

// 학교 내부 진입 감지 → 정문 자동 잠금
function checkEnterAndEscape() {
  if (state.phase !== PHASE.EXPLORATION) return;
  if (!state.exitUnlocked) return;
  const tx = Math.floor(player.x / TILE);
  const ty = Math.floor(player.y / TILE);
  // 스테이지 출구 타일 중 하나에 도달했는가?
  const onExit = stageExitDoors.some(d => d.tx === tx && d.ty === ty);
  if (!onExit) return;
  // 마지막 스테이지 정문 → 마지막 시험(지뢰찾기)을 먼저 통과해야 경비 아저씨 정문 이벤트로.
  if (state.stage >= state.maxStage) {
    if (!state.finalTestPassed) { openMinesweeper(); return; }
    gateGuardEvent();
  } else renderEnd();
}

// ──────────────────────────────────────────
// 이상 현상
// ──────────────────────────────────────────
let lastAnomaly = 0;
let phantomActive = null; // {x, y, life}
let lightingDim = 0;      // 0 ~ 1 (currently dimming)
let lightingDimTimer = 0;

function updateAnomalies(dt) {
  const d = cfg();
  // 조명 회복
  if (lightingDim > 0) {
    lightingDimTimer -= dt;
    if (lightingDimTimer <= 0) lightingDim = 0;
  }
  // 환영 회복
  if (phantomActive) {
    phantomActive.life -= dt;
    if (phantomActive.life <= 0) phantomActive = null;
  }
  // 새 이상 현상
  if (Math.random() < d.lighting_glitch_rate * dt * 0.3) {
    lightingDim = 0.3 + Math.random() * 0.4;
    lightingDimTimer = 0.15 + Math.random() * 0.2;
  }
  if (Math.random() < d.phantom_rate * dt * 0.15) {
    // 플레이어 근처 랜덤 위치 (타일 크기에 비례)
    phantomActive = {
      x: player.x + (Math.random() - 0.5) * TILE * 12,
      y: player.y + (Math.random() - 0.5) * TILE * 12,
      life: 0.6 + Math.random() * 0.4,
    };
  }
  if (Math.random() < d.anomaly_frequency * dt * 0.05) {
    const ov = document.getElementById("glitch-overlay");
    ov.style.background = "rgba(220,80,80,0.08)";
    setTimeout(() => ov.style.background = "transparent", 200);
  }
}

// ──────────────────────────────────────────
// 렌더링
// ──────────────────────────────────────────
function resizeCanvas() {
  // 실제 디바이스 픽셀에 맞춰 렌더 → 윈도우 배율(125%·150%)에 의한 소수 확대(떨림) 제거.
  // 캔버스 백버퍼 = 화면 물리 픽셀, CSS는 100vw/100vh 라 1:1 로 표시되어 흔들림이 없다.
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
  off.width = Math.ceil(canvas.width / SCALE);
  off.height = Math.ceil(canvas.height / SCALE);
  fixedView = null;   // 화면 크기 바뀌면 고정 카메라 다시 계산
}
window.addEventListener("resize", resizeCanvas);

// 정적 맵 타일 전체를 캐시 캔버스에 한 번만 그린다 (스테이지/층 바뀔 때만 호출).
function buildMapCache() {
  const map = currentMap();
  const isCentral = stageCfg().zone === "central";
  const isClassroom = stageCfg().zone === "classroom";
  const woodSet = isClassroom ? classFloorVariants : floorVariants;
  const woodAt = (r, c) => woodSet[(r * 31 + c * 17) % woodSet.length];
  mapCacheCtx.clearRect(0, 0, mapCache.width, mapCache.height);
  let minTx = MAP_W, minTy = MAP_H, maxTx = -1, maxTy = -1;
  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      const tile = map[r][c];
      if (tile !== TILE_VOID) {   // 방 범위 추적 (비어있지 않은 칸)
        if (c < minTx) minTx = c; if (c > maxTx) maxTx = c;
        if (r < minTy) minTy = r; if (r > maxTy) maxTy = r;
      }
      let sp;
      if (tile === TILE_FLOOR) sp = woodAt(r, c);
      else if (tile === TILE_MARBLE) sp = marbleVariants[(r + c) % 2];
      else sp = sprites[tile];
      if (!sp) continue;
      const x = c * TILE * SR, y = r * TILE * SR;   // 캐시는 SR배 해상도
      if (OVERLAY_TILES.has(tile)) {
        const base = isCentral ? marbleVariants[(r + c) % 2] : woodAt(r, c);
        mapCacheCtx.drawImage(base, x, y);
      }
      mapCacheCtx.drawImage(sp, x, y);
    }
  }
  if (maxTx < minTx) { minTx = 0; minTy = 0; maxTx = MAP_W - 1; maxTy = MAP_H - 1; }
  mapBounds = { minTx, minTy, maxTx, maxTy };
}

// 방 전체가 한 화면에 들어오도록 고정 카메라(확대/위치)를 계산한다. 화면은 스크롤하지 않는다.
function computeFixedView() {
  const bx = mapBounds.minTx * TILE, by = mapBounds.minTy * TILE;
  const bw = (mapBounds.maxTx - mapBounds.minTx + 1) * TILE;
  const bh = (mapBounds.maxTy - mapBounds.minTy + 1) * TILE;
  const pad = 0.98;   // 가장자리 약간 여백
  const scale = Math.min(canvas.width / bw, canvas.height / bh) * pad;
  const offX = (canvas.width - bw * scale) / 2 - bx * scale;
  const offY = (canvas.height - bh * scale) / 2 - by * scale;
  fixedView = { scale, offX, offY };
}

const VIEW_TILES_TALL = 11;   // 세로로 보이는 타일 수 (작을수록 더 확대)
function render() {
  const w = canvas.width, h = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = true;   // 부드러운 스케일 → 스크롤 시 떨림(시머) 없음
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, w, h);

  if (mapCacheDirty) { buildMapCache(); mapCacheDirty = false; }

  // 확대 + 부드럽게 따라가는 카메라. 방 밖(여백)은 안 보이게 가장자리에서 멈춤(클램프),
  // 방이 화면보다 작은 축은 가운데 정렬(그 축은 스크롤 안 함).
  // 확대해도 SR배 해상도 스프라이트 덕분에 선명(SR배까지는 다운스케일 → 또렷).
  const zoom = Math.min(SR, h / (TILE * VIEW_TILES_TALL));
  const viewW = w / zoom, viewH = h / zoom;
  const bx0 = mapBounds.minTx * TILE, by0 = mapBounds.minTy * TILE;
  const bw = (mapBounds.maxTx - mapBounds.minTx + 1) * TILE;
  const bh = (mapBounds.maxTy - mapBounds.minTy + 1) * TILE;
  let cx, cy;
  if (bw <= viewW) cx = bx0 - (viewW - bw) / 2;
  else cx = Math.max(bx0, Math.min(player.x - viewW / 2, bx0 + bw - viewW));
  if (bh <= viewH) cy = by0 - (viewH - bh) / 2;
  else cy = Math.max(by0, Math.min(player.y - viewH / 2, by0 + bh - viewH));

  // 월드 좌표 변환 적용
  ctx.setTransform(zoom, 0, 0, zoom, -cx * zoom, -cy * zoom);

  // 맵 전체를 한 번에 (캐시는 SR배 해상도 → 1/SR 로 줄여 월드 좌표에 맞춤)
  ctx.save();
  ctx.scale(1 / SR, 1 / SR);
  ctx.drawImage(mapCache, 0, 0);
  ctx.restore();

  // 트리거 마커 (월드 좌표)
  const blink = (Date.now() / 280) % 2 < 1;
  for (const t of triggers) {
    if (t.floor !== state.currentFloor) continue;
    // 책상 위 보드게임 - 항상 표시 (출구가 열려도 즐길 수 있는 선택 미니게임)
    if (t.type === "chosung") {
      drawBoardGameIcon(t.tx * TILE + TILE/2, t.ty * TILE + TILE/2);
      continue;
    }
    if (state.exitUnlocked) continue;
    if (t.used) continue;
    if (!blink) continue;
    const cx = t.tx * TILE + TILE/2, cy = t.ty * TILE + TILE/2;
    ctx.fillStyle = "#d8c88e";
    ctx.fillRect(cx - 1, cy - 27, 4, 4);
    ctx.fillStyle = "#e8dcae";
    ctx.fillRect(cx - 4, cy - 26, 2, 2);
    ctx.fillRect(cx + 4, cy - 26, 2, 2);
    ctx.fillRect(cx, cy - 31, 2, 2);
    ctx.fillRect(cx, cy - 22, 2, 2);
  }

  // 환영 (월드 좌표)
  if (phantomActive && phantomSprite) {
    ctx.globalAlpha = Math.min(1, phantomActive.life * 1.5);
    ctx.drawImage(phantomSprite, phantomActive.x - TILE/2, phantomActive.y - TILE/2, TILE, TILE);
    ctx.globalAlpha = 1;
  }

  // 동행 친구 (수아) - 월드 좌표
  if (companion.active && companionImg.complete && companionImg.naturalWidth) {
    const ch = TILE * 1.5;
    const cw = ch * (companionImg.naturalWidth / companionImg.naturalHeight);
    if (companion.asleep) {
      // 의자에 앉아 책상에 엎드려 자는 모습 - 상체만 앞으로 숙이고 💤 표시
      // E 연타로 깨울 때 좌우로 흔들리는 효과 (시간에 따라 잦아듦)
      let shakeX = 0, shakeR = 0;
      if (companion.shakeUntil && Date.now() < companion.shakeUntil) {
        const remain = (companion.shakeUntil - Date.now()) / 320;   // 1 → 0
        shakeX = Math.sin(Date.now() / 24) * 6 * remain;
        shakeR = Math.sin(Date.now() / 24) * 0.08 * remain;
      }
      ctx.save();
      ctx.translate(companion.x + shakeX, companion.y - ch * 0.46 + TILE / 2);
      ctx.rotate(0.32 + shakeR);        // 상체를 책상 쪽으로 숙임 (~18°) + 흔들림
      ctx.drawImage(companionImg, -cw / 2, -ch * 0.54, cw, ch);
      ctx.restore();
      const zz = Math.sin(Date.now() / 400) * 3;
      ctx.save();
      ctx.font = "bold 18px sans-serif";
      ctx.fillStyle = "rgba(200,190,255,0.9)";
      ctx.textAlign = "center";
      ctx.fillText("z Z z", companion.x + TILE * 0.18, companion.y - TILE * 0.5 + zz);
      ctx.restore();
    } else {
      // 좌우 방향은 실제 이동량으로 결정 (0.4px 데드존) - dir 깜빡임에 의한 좌우 떨림 방지
      if (companion._px === undefined) companion._px = companion.x;
      if (companion.x < companion._px - 0.4) companion.face = "left";
      else if (companion.x > companion._px + 0.4) companion.face = "right";
      companion._px = companion.x;
      ctx.save();
      if (companion.hidden) ctx.globalAlpha = 0.4;   // 청소도구함에 숨은 상태 - 반투명
      ctx.translate(companion.x, companion.y - ch + TILE / 2);   // bob 제거 - 위아래 떨림 방지
      if (companion.face === "left") ctx.scale(-1, 1);
      ctx.drawImage(companionImg, -cw / 2, 0, cw, ch);
      ctx.restore();
    }
  }

  // 남자애 (도현) - 월드 좌표
  if (boy.active && boyImg.complete && boyImg.naturalWidth) {
    const ch = TILE * 1.5;
    const cw = ch * (boyImg.naturalWidth / boyImg.naturalHeight);
    if (boy._px === undefined) boy._px = boy.x;
    if (boy.x < boy._px - 0.4) boy.face = "left";
    else if (boy.x > boy._px + 0.4) boy.face = "right";
    boy._px = boy.x;
    ctx.save();
    if (boy.hidden) ctx.globalAlpha = 0.4;   // 청소도구함에 숨은 상태 - 반투명
    ctx.translate(boy.x, boy.y - ch + TILE / 2);   // bob 제거 - 위아래 떨림 방지
    if (boy.face === "left") ctx.scale(-1, 1);
    ctx.drawImage(boyImg, -cw / 2, 0, cw, ch);
    ctx.restore();
  }

  // 경비원 (추격자) - 월드 좌표
  if (guard.active) {
    if (guard.mode === 'chase') {
      // 추격 중 붉은 경고 오라 (맥동)
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 150);
      ctx.save();
      ctx.globalAlpha = 0.22 + 0.18 * pulse;
      ctx.fillStyle = "#b03030";
      ctx.beginPath(); ctx.arc(guard.x, guard.y, TILE * 0.52, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // 좌우 방향은 실제 이동량으로 결정 (0.4px 데드존) - 깜빡임 방지
    if (guard._px === undefined) { guard._px = guard.x; guard._py = guard.y; }
    const gmx = guard.x - guard._px;
    if (gmx < -0.4) guard.face = "left"; else if (gmx > 0.4) guard.face = "right";
    guard._px = guard.x; guard._py = guard.y;
    if (guardChaserImg.complete && guardChaserImg.naturalWidth) {
      // 사용자 제공 경비원 이미지 (캐릭터형, 발끝을 guard.y 에 맞춤)
      const gh = TILE * 1.6;
      const gw = gh * (guardChaserImg.naturalWidth / guardChaserImg.naturalHeight);
      ctx.save();
      ctx.translate(guard.x, guard.y - gh + TILE / 2);
      if (guard.face === "left") ctx.scale(-1, 1);
      ctx.drawImage(guardChaserImg, -gw / 2, 0, gw, gh);
      ctx.restore();
    } else {
      const gSp = guardSprites[guard.dir] || guardSprites.down;   // 이미지 로딩 전 폴백
      if (gSp) ctx.drawImage(gSp, guard.x - TILE/2, guard.y - TILE/2, TILE, TILE);
    }
  }

  // 플레이어 (월드 좌표) - 화면 안에서 자유롭게 이동
  if (player.hidden) ctx.globalAlpha = 0.35;   // 숨는 중엔 흐릿하게
  const skinImg = (state.gender === "여") ? playerGirlImg : playerBoyImg;
  if (skinImg && skinImg.complete && skinImg.naturalWidth) {
    // 캐릭터형 이미지 스킨 (남/여, 발끝을 player.y 에 맞추고 실제 이동량으로 좌우 플립)
    if (player._px === undefined) player._px = player.x;
    if (player.x < player._px - 0.4) state.face = "left";
    else if (player.x > player._px + 0.4) state.face = "right";
    player._px = player.x;
    const ph = TILE * 1.5;
    const pw = ph * (skinImg.naturalWidth / skinImg.naturalHeight);
    ctx.save();
    ctx.translate(player.x, player.y - ph + TILE / 2);
    if (state.face === "left") ctx.scale(-1, 1);
    ctx.drawImage(skinImg, -pw / 2, 0, pw, ph);
    ctx.restore();
  } else {
    const pSp = playerSprites[player.dir];
    if (pSp) ctx.drawImage(pSp, player.x - TILE/2, player.y - TILE/2, TILE, TILE);
  }
  // 초성게임 고수 칭호 - 머리 위 왕관
  if (state.choMaster) {
    const usingSkin = skinImg && skinImg.complete && skinImg.naturalWidth;
    drawCrown(player.x, player.y - (usingSkin ? 60 : 34));
  }
  ctx.globalAlpha = 1;

  // 화면 효과는 화면 좌표로 (변환 해제)
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // 안개 (난이도별) - 그라데이션은 캐시 (매 프레임 생성하면 고해상도에서 느림)
  const fog = cfg().fog;
  if (fog > 0) {
    if (!fogCache || fogCache.w !== w || fogCache.h !== h || fogCache.fog !== fog) {
      const grd = ctx.createRadialGradient(w/2, h/2, 20, w/2, h/2, Math.max(w, h)*0.6);
      grd.addColorStop(0, "rgba(0,0,0,0)");
      grd.addColorStop(1, `rgba(8,4,16,${fog})`);
      fogCache = { w, h, fog, grd };
    }
    ctx.fillStyle = fogCache.grd;
    ctx.fillRect(0, 0, w, h);
  }

  // 몽환적 색감 (스테이지 별 톤) + 시간에 따른 미세한 색조 펄스
  const pulse = 0.85 + 0.15 * Math.sin(Date.now() / 1500);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = stageCfg().overlay;
  ctx.fillRect(0, 0, w, h);
  ctx.globalAlpha = 1;

  // 조명 깜빡임 (이상 현상)
  if (lightingDim > 0) {
    ctx.fillStyle = `rgba(0,0,0,${lightingDim})`;
    ctx.fillRect(0, 0, w, h);
  }

  // 먼지 입자 (수 줄임 - 분위기는 유지, 비용 절감)
  ctx.fillStyle = "rgba(200,180,255,0.45)";
  for (let i = 0; i < 12; i++) {
    const x = ((Date.now() / 80 + i * 137) % w) | 0;
    const y = ((Date.now() / 100 + i * 73) % h) | 0;
    ctx.fillRect(x, y, 2, 2);
  }
  // 떠다니는 몽환 오브 (천천히)
  const now2 = Date.now() / 1000;
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 5; i++) {
    const t = now2 + i * 1.7;
    const ox = (Math.sin(t * 0.3 + i) * 0.45 + 0.5) * w;
    const oy = (Math.cos(t * 0.25 + i * 1.3) * 0.4 + 0.5) * h;
    const sc2 = 0.8 + 0.25 * Math.sin(t + i);
    const sp = orbSprites[i % orbSprites.length];
    const d = sp.width * sc2;
    ctx.drawImage(sp, ox - d/2, oy - d/2, d, d);
  }
  ctx.globalCompositeOperation = "source-over";
}

const bmCanvas = document.getElementById("bm-canvas");
const bmCtx = bmCanvas.getContext("2d");
bmCtx.imageSmoothingEnabled = false;

function renderMinimap() {
  const w = 360 - 12, h = 160 - 30;
  bmCanvas.width = w; bmCanvas.height = h;
  const m = currentMap();
  const sx = w / MAP_W, sy = h / MAP_H;
  bmCtx.fillStyle = "#0a0a14";
  bmCtx.fillRect(0, 0, w, h);
  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      const t = m[r][c];
      let col = null;
      if (t === TILE_GRASS) col = "#2c3820";
      else if (t === TILE_SAND) col = "#c8a878";
      else if (t === TILE_FLOOR || t === TILE_PAPER || t === TILE_PUDDLE) col = "#3a3a42";
      else if (t === TILE_MARBLE) col = "#444450";
      else if (t === TILE_RUG) col = "#7a2030";
      else if (t === TILE_BATH) col = "#6a7080";
      else if (t === TILE_WALL || t === TILE_WINDOW) col = "#1a1a24";
      else if (t === TILE_WOODWALL) col = "#5a3e26";
      else if (t === TILE_LOCKER || t === TILE_LOCKER_GLOW) col = "#4a6a82";
      else if (t === TILE_DOOR || t === TILE_LOCKED_DOOR || t === TILE_WOODDOOR) col = "#7a5636";
      else if (t === TILE_ENTRANCE) col = "#c8b878";
      else if (t === TILE_STAIRS_UP || t === TILE_STAIRS_DOWN) col = "#7af0a0";
      else if (t === TILE_FENCE) col = "#4a4a55";
      else if (t === TILE_TRACK) col = "#6b3a2a";
      else if (t === TILE_DESK) col = "#a07050";
      else if (t === TILE_CHALK) col = "#1a3a28";
      else if (t === TILE_MIRROR) col = "#aab4c4";
      else if (t === TILE_BENCH) col = "#6a4a2a";
      else if (t === TILE_PLANT) col = "#3a7a40";
      else if (t === TILE_VENDING || t === TILE_EXTING) col = "#8a2a32";
      else if (t === TILE_STATUE || t === TILE_PILLAR) col = "#5a5a6a";
      else if (t === TILE_BOOKSHELF || t === TILE_PODIUM || t === TILE_INFODESK) col = "#5a4430";
      else if (t === TILE_BOARD || t === TILE_TROPHY || t === TILE_CLOCK) col = "#7a6038";
      else if (t === TILE_FOUNTAIN) col = "#9aa4ae";
      else if (t === TILE_VOID) col = "#000";
      if (col) {
        bmCtx.fillStyle = col;
        bmCtx.fillRect(Math.floor(c*sx), Math.floor(r*sy), Math.ceil(sx), Math.ceil(sy));
      }
    }
  }
  // 트리거 (푼 것/출구 열린 뒤는 회색 - 더 이상 안내 안 함)
  for (const t of triggers) {
    if (t.floor !== state.currentFloor) continue;
    bmCtx.fillStyle = (t.used || state.exitUnlocked) ? "#444" : "#ffaa44";
    bmCtx.fillRect(Math.floor(t.tx*sx)-1, Math.floor(t.ty*sy)-1, 3, 3);
  }
  // 플레이어 (흔들림 없음)
  const px = (player.x / TILE) * sx;
  const py = (player.y / TILE) * sy;
  bmCtx.fillStyle = "#7af0a0";
  bmCtx.fillRect(Math.floor(px)-1, Math.floor(py)-1, 3, 3);
}

// 퀘스트 창 - 현재 스테이지 목표 + 해야 할 일 + 진행도
function updateQuest() {
  const box = document.getElementById("quest-box");
  if (!box) return;
  const sc = stageCfg();
  const total = state.totalRequired || 0;
  const got = state.keyFragments.length;
  const allGot = total > 0 && got >= total;
  const canExit = state.exitUnlocked || allGot;

  document.getElementById("q-goal").textContent = `🎯 ${sc.name} 에서 탈출하라`;

  // 할 일 목록 (스테이지별로 구성) - {done, text}
  const tasks = [];
  // 스테이지 1: 첫 교실에서 잠든 수아 깨우기
  if (state.stage === 1) {
    const woke = !companion.asleep;
    tasks.push({ done: woke, text: "잠든 수아 깨우기" });
  }
  tasks.push({ done: allGot, text: `칠판을 조사해 열쇠 조각 모으기 (${got}/${total})` });
  tasks.push({ done: canExit, text: "출구를 열고 탈출하기" });

  const list = document.getElementById("q-list");
  list.innerHTML = tasks.map(t =>
    `<li class="${t.done ? "done" : ""}">${t.done ? "✔" : "▢"} ${t.text}</li>`
  ).join("");

  const pct = total > 0 ? Math.round(got / total * 100) : 0;
  document.getElementById("q-fill").style.width = pct + "%";
  document.getElementById("q-pct").textContent = `진행도 ${pct}%`;
}

function updateHud() {
  const tx = Math.floor(player.x / TILE), ty = Math.floor(player.y / TILE);
  // 스테이지별 영역 라벨 - 더 이상 운동장은 없음.
  const sc = stageCfg();
  let area = sc.name || "학교";
  if (sc.zone === "corridor") area = "복도";
  else if (sc.zone === "central") area = "1층 중앙홀";
  else if (sc.zone === "classroom") area = "교실";

  document.getElementById("hud-title").textContent = `STAGE ${state.stage} — ${stageCfg().name}`;
  document.getElementById("hud-progress").textContent = `조각 ${state.keyFragments.length}/${state.totalRequired}`;
  document.getElementById("hud-area").textContent = area;
  document.getElementById("hud-diff").textContent = `${state.grade} · 여러 과목`;
  document.getElementById("bm-floor").textContent = state.inClassroom ? "교실" : (state.currentFloor + "F");
  document.getElementById("bm-progress").textContent = `${state.solved}/${state.totalRequired}`;
  updateQuest();

  // 인터랙트 힌트
  const hint = document.getElementById("interact-hint");
  const press = gamepadState.connected ? "A 버튼을 눌러" : "E키를 눌러";

  // 1) 수아 깨우기 (인트로 - 다가가기 단계에서 수아 곁에 서면)
  if (intro.active && intro.step === "approach" && companion.active) {
    const cx = Math.floor(companion.x / TILE), cy = Math.floor(companion.y / TILE);
    if (Math.max(Math.abs(cx - tx), Math.abs(cy - ty)) <= 1) {
      hint.style.display = "block";
      hint.textContent = `${press} 수아 깨우기`;
    } else hint.style.display = "none";
    return;
  }

  // 2) 교실 안에서 남쪽 문 근처면 '복도로 나가기' 안내
  if (state.inClassroom && state.currentFloor === 2) {
    const m = currentMap();
    let nearDoor = false;
    for (let dy = -1; dy <= 1 && !nearDoor; dy++)
      for (let dx = -1; dx <= 1; dx++) {
        const nx = tx + dx, ny = ty + dy;
        if (ny < 0 || ny >= MAP_H || nx < 0 || nx >= MAP_W) continue;
        if (m[ny][nx] === TILE_DOOR) { nearDoor = true; break; }
      }
    if (nearDoor) { hint.style.display = "block"; hint.textContent = `${press} 복도로 나가기`; return; }
  }

  // 3) 트리거(칠판·문 등) 인터랙트 힌트
  let near = null;
  for (const t of triggers) {
    if (t.used || t.floor !== state.currentFloor) continue;
    const d = Math.max(Math.abs(t.tx - tx), Math.abs(t.ty - ty));
    if (d <= 1) { near = t; break; }
  }
  if (near) {
    hint.style.display = "block";
    if (near.type === "chalk") hint.textContent = `${press} 문제확인하기`;
    else if (near.type === "door") hint.textContent = `${press} 교실 들어가기`;
    else if (near.type === "chosung") hint.textContent = `${press} 보드게임 (초성게임)`;
    else hint.textContent = `${press} ${near.label} 조사하기`;
  } else hint.style.display = "none";
}

// ──────────────────────────────────────────
// 메인 루프
// ──────────────────────────────────────────
let lastTime = 0;
let hudAccum = 0;        // HUD/미니맵 갱신 누적 시간
let lastShownSec = -1;   // 타이머에 표시된 마지막 초 (바뀔 때만 DOM 갱신)
let fpsCount = 0, fpsT0 = 0;   // FPS 측정
function updateTimerHud() {
  const el = document.getElementById("hud-timer");
  if (!el) return;
  const t = Math.max(0, Math.ceil(state.timeLeft));
  const m = Math.floor(t / 60), s = t % 60;
  el.textContent = `${m}:${String(s).padStart(2, "0")}`;
  el.style.color = state.timeLeft <= 60 ? "var(--warn)"
    : (state.timeLeft <= 180 ? "#f0c040" : "var(--accent)");
}

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastTime) / 1000) || 0;
  lastTime = now;

  // FPS 측정·표시 (0.5초마다)
  fpsCount++;
  if (now - fpsT0 >= 500) {
    const fps = Math.round(fpsCount * 1000 / (now - fpsT0));
    const el = document.getElementById("fps");
    if (el) {
      el.style.display = (overlay.style.display === "none") ? "block" : "none";
      el.textContent = "FPS " + fps;
      el.style.color = fps >= 50 ? "#7af0a0" : (fps >= 30 ? "#f0c040" : "#f06070");
    }
    fpsCount = 0; fpsT0 = now;
  }

  // 제한 시간 카운트다운 — 탐험/퍼즐 동안 흐르고, 0이 되면 게임 오버.
  if (state.timerActive && !state.timeExpired) {
    state.timeLeft -= dt;
    if (state.timeLeft <= 0) { state.timeLeft = 0; updateTimerHud(); gameOver(); }
    else {
      const sec = Math.ceil(state.timeLeft);   // 초가 바뀔 때만 DOM 갱신
      if (sec !== lastShownSec) { lastShownSec = sec; updateTimerHud(); }
    }
  }

  if (state.endingAnim) {
    updateEndingAnim(dt);   // 엔딩: 주인공이 자동으로 일어나 문으로 걸어 나간다
  } else if (intro.active && state.phase === PHASE.EXPLORATION) {
    // 오프닝 컷신: 일반 탐험 로직(경비원/이상현상/배회) 정지
    if (intro.step === "approach") {
      // 플레이어 이동만 허용 — 수아에게 다가가기
      let dx = 0, dy = 0;
      if (keys["w"] || keys["arrowup"]) dy -= 1;
      if (keys["s"] || keys["arrowdown"]) dy += 1;
      if (keys["a"] || keys["arrowleft"]) dx -= 1;
      if (keys["d"] || keys["arrowright"]) dx += 1;
      const gp = pollGamepad();
      if (gp.lx !== 0 || gp.ly !== 0) { dx += gp.lx; dy += gp.ly; }
      const len = Math.sqrt(dx*dx + dy*dy);
      if (len > 0) {
        dx /= len; dy /= len;
        tryMove(dx * player.speed * dt, dy * player.speed * dt);
        if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? 'right' : 'left';
        else player.dir = dy > 0 ? 'down' : 'up';
      }
      if (gp.interact) tryInteract();
    } else if (intro.step === "walk") {
      updateIntroWalk(dt);   // 수아가 문으로 자동 이동, 플레이어 정지
    }
    hudAccum += dt;
    if (hudAccum >= 0.1) { updateHud(); renderMinimap(); hudAccum = 0; }
  } else if (hideCut.active) {
    // 교실 탈출 컷신: 경비원 퇴장 + 셋이 사물함에 숨기 (조작 불가)
    updateHideCutscene(dt);
    hudAccum += dt;
    if (hudAccum >= 0.1) { updateHud(); renderMinimap(); hudAccum = 0; }
  } else if (state.phase === PHASE.EXPLORATION) {
    // 3번 틀려 예약된 경비원을 탐험 복귀 순간에 등장시킨다
    if (guardPending && !guard.active) { spawnGuard(); guardPending = false; }
    checkEnterAndEscape();
    checkClassroomDoorAuto();   // 교실 남쪽 문 밟으면 복도로 복귀
    let dx = 0, dy = 0;
    if (keys["w"] || keys["arrowup"]) dy -= 1;
    if (keys["s"] || keys["arrowdown"]) dy += 1;
    if (keys["a"] || keys["arrowleft"]) dx -= 1;
    if (keys["d"] || keys["arrowright"]) dx += 1;
    const gp = pollGamepad();
    if (gp.lx !== 0 || gp.ly !== 0) { dx += gp.lx; dy += gp.ly; }
    // 정규화
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len > 0) {
      dx /= len; dy /= len;
      tryMove(dx * player.speed * dt, dy * player.speed * dt);
      // 방향 갱신
      if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? 'right' : 'left';
      else player.dir = dy > 0 ? 'down' : 'up';
    }
    if (gp.interact) tryInteract();

    // 숨기 상태 갱신 + 경비원에게서 막 숨었을 때 안내
    const wasHidden = player.hidden;
    player.hidden = isHideAt(player.x, player.y);
    if (guard.active && player.hidden && !wasHidden) showToast("🫥 숨었다 — 경비원이 너를 놓쳤다", { duration: 2200 });

    checkTraps();   // 함정 밟기 검사

    updateAnomalies(dt);
    updateCompanion(dt);
    updateBoy(dt);
    updateGuard(dt);
    // HUD·미니맵은 매 프레임 갱신할 필요 없음 → 약 10fps로 제한해 버벅임 감소
    hudAccum += dt;
    if (hudAccum >= 0.1) { updateHud(); renderMinimap(); hudAccum = 0; }
  }

  render();
}

// 토스트 알림
let toastTimer = null;
function showToast(msg, opts={}) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("warn", !!opts.warn);
  t.style.display = "block";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, opts.duration || 2800);
}

function updateKeyInventory() {
  const need = state.totalRequired;
  const got = state.keyFragments.length;
  document.getElementById("key-count").textContent = `${got}/${need}`;
  const frags = document.getElementById("key-frags");
  frags.innerHTML = "";
  for (let i = 0; i < need; i++) {
    const f = document.createElement("div");
    f.className = "frag" + (i < got ? " got" : "");
    f.textContent = i < got ? "🗝" : "·";
    frags.appendChild(f);
  }
}

function unlockExit() {
  if (state.exitUnlocked) return;
  state.exitUnlocked = true;
  // 스테이지별 출구 타일만 해제. 장식용 잠긴 문은 계속 잠겨 있음.
  for (const d of stageExitDoors) {
    if (map1[d.ty] && map1[d.ty][d.tx] === TILE_LOCKED_DOOR) {
      map1[d.ty][d.tx] = TILE_ENTRANCE;
    }
  }
  mapCacheDirty = true;   // 문이 열렸으니 맵 캐시 갱신
  // 열쇠를 다 모으면 경비원은 물러난다 (출구가 열려 위협이 사라짐)
  guard.active = false; guardPending = false;
  // 마지막 중앙홀: 열쇠를 다 모으면 경비원 등장 전에 수아·리온이 환호한다.
  if (state.stage >= state.maxStage) { showFinalCelebration(); return; }
  const msgs = {
    1: "✨ 교실 문이 열렸다! 남쪽 문으로 나가 복도로 향하세요",
    2: "✨ 동쪽 계단의 잠금이 풀렸다! 계단을 내려가세요",
    3: "✨ 정문이 열렸다! 남쪽 정문으로 탈출하세요",
  };
  showToast(msgs[state.stage] || "✨ 출구가 열렸다!", { duration: 4500 });
}

let answeredThisPuzzle = false;   // 연타 방지 - 퍼즐 1개당 정답 처리 1회
let puzzleAttempts = 0;           // 현재 문제 시도 횟수 (2번 틀리면 다른 문제로 리셋)

async function openPuzzle(trigger) {
  if (!canSpawnQuestion()) return;
  state.currentTrigger = trigger;
  state.phase = PHASE.PUZZLE;
  puzzleAttempts = 0;              // 새 문제 - 시도 횟수 초기화
  answeredThisPuzzle = false;      // 새 퍼즐 - 답안 잠금 해제
  // 문제마다 과목을 새로 무작위 (한 과목만 반복되지 않게 섞기)
  const subj = SUBJECTS[Math.floor(Math.random() * SUBJECTS.length)];
  state.subject = subj;
  showOverlay(true);
  panel.className = "panel";
  panel.innerHTML = `<h1>퍼즐 — ${trigger.label}</h1>
    <div class="question-card"><p class="status" id="status">문제 생성 중...</p></div>`;

  let q;
  try { q = await requestQuestion(subj); }
  catch (e) { document.getElementById("status").textContent = "실패: "+e.message; return; }
  addRecent(q);
  renderQuestionUI(q, subj, trigger);
}

// 문제 UI 렌더 (새 문제 / 같은 문제 재도전 양쪽에서 사용)
function renderQuestionUI(q, subj, trigger) {
  answeredThisPuzzle = false;     // 답안 잠금 해제 (재도전 시 다시 고를 수 있게)
  state.phase = PHASE.PUZZLE;
  showOverlay(true);
  panel.className = "panel";
  const d = cfg();
  const showHint = Math.random() < d.hint_frequency;
  const tryTag = puzzleAttempts >= 1 ? ` <span style="color:var(--warn)">· 두 번째 기회</span>` : "";
  panel.innerHTML = `<h1>퍼즐 — ${trigger.label} <span class="lock-badge">${escapeHtml(subj)}</span>${tryTag}</h1>
    <div class="question-card">
      <p style="white-space:pre-wrap;font-size:16px">${escapeHtml(q.question)}</p>
      <div class="choices">
        ${q.choices.map((c,i)=>`<button data-i="${i}">${escapeHtml(c)}</button>`).join("")}
      </div>
      ${showHint ? `<p><button id="hint-btn">잘 모르겠어,</button></p><p class="hint-text" id="hint-text" style="display:none"></p>` : ""}
      <p class="status" id="status"></p>
    </div>`;
  document.querySelectorAll(".choices button").forEach(b => {
    b.onclick = () => answer(parseInt(b.dataset.i, 10), q);
  });
  if (showHint) {
    document.getElementById("hint-btn").onclick = () => {
      const ht = document.getElementById("hint-text");
      ht.style.display = "block"; ht.textContent = q.hint || "(힌트 없음)";
    };
  }
}

function answer(picked, q) {
  // 연타 방지: 한 퍼즐에서 최초 1회만 처리 (정답 연타로 열쇠 다중 획득 차단)
  if (answeredThisPuzzle) return;
  answeredThisPuzzle = true;
  document.querySelectorAll(".choices button").forEach(b => {
    b.disabled = true; b.style.opacity = "0.55"; b.style.cursor = "default";
  });
  const correct = picked === q.answer_index;
  const d = cfg();
  if (!correct) {
    puzzleAttempts++;
    state.wrongTotal = (state.wrongTotal || 0) + 1;   // 게임 전체 누적 오답
    if (state.currentTrigger) state.currentTrigger.used = false;   // 트리거는 다시 도전 가능
    maybeTriggerGuard();   // 3번째 오답이면 경비원 등장 예약
    saveGame();
    if (puzzleAttempts >= 2) {
      // 두 번째도 틀림 → 다른 문제로 리셋
      showWrongReset(q);
    } else {
      // 첫 오답 → 수아가 힌트를 주고, 같은 문제를 한 번 더
      showWrongHint(q);
    }
    return;
  }
  const status = document.getElementById("status");
  state.solved++;
  // 열쇠 조각 획득
  if (state.currentTrigger) {
    state.keyFragments.push({ label: state.currentTrigger.label });
    // 반복 출제 교실(복도의 문제 교실)은 다 모으기 전까지 계속 풀 수 있게 재무장
    if (state.currentTrigger.reusable && state.keyFragments.length < state.totalRequired) {
      state.currentTrigger.used = false;
    }
  }
  status.textContent = `정답!  🗝 열쇠 조각 +1  (${state.keyFragments.length}/${state.totalRequired})`;
  status.style.color = "var(--accent)";
  if (d.question_difficulty === "easy") {
    status.textContent += "  해설: " + q.explanation;
  }
  saveGame();
  setTimeout(() => {
    state.phase = PHASE.EXPLORATION;
    showOverlay(false);
    updateKeyInventory();
    // 모든 조각을 모았으면 잠금 해제
    if (state.keyFragments.length >= state.totalRequired && !state.exitUnlocked) {
      unlockExit();
    } else {
      showToast(`🗝 열쇠 조각 +1 (${state.keyFragments.length}/${state.totalRequired})`);
    }
  }, 2400);
}

function gameOver() {
  if (state.timeExpired) return;

// 디버그: 특정 스테이지로 바로 워프 (Alt+1/2/3) - 테스트용
function warpToStage(n) {
  if (!state.userId) return;   // 게임 입장 후에만
  n = Math.max(1, Math.min(state.maxStage, n));
  state.stage = n;
  state.pendingResume = null;
  escapeShown = false; state.ended = false; state.endingAnim = false; state.timeExpired = false;
  guard.active = false; guardPending = false; guardTriggered = false;
  state.inClassroom = false; state.finalTestPassed = false;
  state.wantWakeIntro = false;
  companion.active = (n >= 2);            // 수아: 스테이지1에서 합류
  boy.active = (n >= 3);                  // 리온: 스테이지2에서 합류
  state.companionIntroDone = (n >= 2);
  state.boyIntroDone = (n >= 3);
  if (n >= 3) hideCutsceneDone = true;    // 챕터1→2 숨기 컷신은 이미 본 것으로
  showOverlay(false);
  initGame();
  showToast(`⚙ 디버그: STAGE ${state.stage} (${stageCfg().name}) 로 이동`, { duration: 2200 });
}

// 엔딩 사진용 픽셀아트 아침 풍경 배경 (작게 그려 확대 → 픽셀이 쪼개진 도트 느낌)
function endingPhotoBg() {
  const cv = document.createElement("canvas");
  cv.width = 240; cv.height = 140;
  const g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;
  // 하늘 그라데이션
  const sky = g.createLinearGradient(0, 0, 0, 140);
  sky.addColorStop(0, "#8ec7ff"); sky.addColorStop(0.55, "#bfe3ff"); sky.addColorStop(1, "#eef8ff");
  g.fillStyle = sky; g.fillRect(0, 0, 240, 140);
  // 해 + 햇살
  g.strokeStyle = "#ffe680"; g.lineWidth = 3;
  for (let a = 0; a < 8; a++) { const ang = a * Math.PI / 4;
    g.beginPath(); g.moveTo(42 + Math.cos(ang) * 19, 34 + Math.sin(ang) * 19);
    g.lineTo(42 + Math.cos(ang) * 27, 34 + Math.sin(ang) * 27); g.stroke(); }
  g.fillStyle = "#ffd84d"; g.beginPath(); g.arc(42, 34, 15, 0, Math.PI * 2); g.fill();
  // 구름 (픽셀 블록)
  const cloud = (x, y, s) => { g.fillStyle = "#ffffff";
    [[0,6],[6,3],[12,1],[18,3],[24,6],[6,6],[12,6],[18,6]].forEach(([dx,dy]) =>
      g.fillRect(x + dx * s, y + dy * s, 7 * s, 6 * s)); };
  cloud(118, 16, 1); cloud(185, 44, 0.8);
  // 잔디 언덕
  g.fillStyle = "#8fd06a"; g.fillRect(0, 102, 240, 38);
  g.fillStyle = "#7ac257";
  g.beginPath(); g.moveTo(0, 108); g.quadraticCurveTo(70, 94, 130, 106);
  g.quadraticCurveTo(190, 116, 240, 102); g.lineTo(240, 140); g.lineTo(0, 140); g.fill();
  // 학교 건물
  g.fillStyle = "#ecbb84"; g.fillRect(150, 68, 74, 40);
  g.fillStyle = "#cf9258"; g.fillRect(148, 62, 78, 8);          // 지붕
  g.fillStyle = "#cf9258"; g.fillRect(182, 56, 10, 8);          // 가운데 첨탑
  g.fillStyle = "#86b6e6";                                       // 창문
  for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) g.fillRect(156 + c * 16, 76 + r * 14, 9, 9);
  g.fillStyle = "#9c6b3a"; g.fillRect(181, 94, 12, 14);         // 정문
  // 나무 두 그루
  const tree = (x) => { g.fillStyle = "#7a4a28"; g.fillRect(x - 2, 84, 6, 22);
    g.fillStyle = "#5fa850"; g.beginPath(); g.arc(x + 1, 80, 13, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#6fb860"; g.beginPath(); g.arc(x - 4, 84, 7, 0, Math.PI * 2); g.fill(); };
  tree(30); tree(232);
  return cv.toDataURL();
}

// 엔딩 애니메이션: 주인공이 자리에서 일어나 자동으로 문까지 걸어가 밖으로 나간다 (조작 불필요).
function startEndingAnim() {
  state.timerActive = false;
  state.exitUnlocked = true;
  companion.active = false;
  state.endingAnim = true;
  state.endingAnimT = 0;
  state.phase = PHASE.EXPLORATION;
  // 자리(스폰)에서 일어선다
  const sc = stageCfg();
  const spawn = sc.spawn || { tx: 24, ty: 12 };
  player.x = spawn.tx * TILE + TILE / 2;
  player.y = spawn.ty * TILE + TILE / 2;
  player.dir = 'down';
  // 목표 = 출구 문(정문)
  if (stageExitDoors.length) {
    let sx = 0, sy = 0;
    for (const d of stageExitDoors) { sx += d.tx; sy += d.ty; }
    state.endTargetX = (sx / stageExitDoors.length) * TILE + TILE / 2;
    state.endTargetY = (sy / stageExitDoors.length) * TILE + TILE / 2;
  } else {
    state.endTargetX = player.x;
    state.endTargetY = player.y + TILE * 6;
  }
  showOverlay(false);
}

// 매 프레임 호출 - 일어서기 → 문으로 이동 → 문 통과 → 엔딩 화면.
function updateEndingAnim(dt) {
  state.endingAnimT += dt;
  if (state.endingAnimT < 0.7) { player.dir = 'down'; return; }   // 잠깐 일어서는 연출
  const spd = 210 * dt;
  const tx = state.endTargetX, ty = state.endTargetY;
  if (player.x < tx - 4) { player.x += Math.min(spd, tx - player.x); player.dir = 'right'; }
  else if (player.x > tx + 4) { player.x -= Math.min(spd, player.x - tx); player.dir = 'left'; }
  else if (player.y < ty + TILE * 2) { player.y += spd; player.dir = 'down'; }  // 문에 정렬 후 아래로 통과
  else { state.endingAnim = false; finalEnding(); }
}

// 정문을 통과하면 끝 - 집으로.
function finalEnding() {
  if (state.ended) return;
  state.ended = true;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

// 인트로 중 E 입력 (탐험 트리거/문 대신 가로챔)
function handleIntroInteract() {
  if (intro.step !== "approach") return;   // 대화·이동 중엔 무시
  const ptx = Math.floor(player.x / TILE), pty = Math.floor(player.y / TILE);
  const ctx_ = Math.floor(companion.x / TILE), cty = Math.floor(companion.y / TILE);
  const d = Math.max(Math.abs(ptx - ctx_), Math.abs(pty - cty));
  if (d > 1) { showToast("조금 더 가까이 가서 [E]를 누르자", { duration: 1800 }); return; }

  // E 연타로 흔들어 깨우기 - 5번쯤 누르면 깨어난다
  const NEED = 5;
  companion.wakeTaps = (companion.wakeTaps || 0) + 1;
  companion.shakeUntil = Date.now() + 320;   // 흔들림 시작
  if (companion.wakeTaps >= NEED) {
    beginWakeDialogue();
    return;
  }
  const msgs = [
    "쿨… 수아는 미동도 없다.",
    "수아가 살짝 뒤척인다…",
    "“으응…” 수아가 몸을 움츠린다.",
    "수아가 눈을 비비기 시작한다!",
  ];
  const i = Math.min(companion.wakeTaps - 1, msgs.length - 1);
  showToast(`${msgs[i]}  [E 연타!  ${companion.wakeTaps}/${NEED}]`, { duration: 1100 });
}

// 수아를 깨운 뒤의 대화 → 문으로 이동 → 문 잠김 확인 → 게임 시작
function beginWakeDialogue() {
  companion.asleep = false;          // 잠에서 깬다
  introDialog([
    { who: "수아", body: "어… 뭐야.. 학교야?\n야자하다 잠깐 잠들었나,," },
    { who: "나",   body: "수아야, 일단 나가야 할 것 같은데…\n문이 안 열려,," },
    { who: "수아", body: "어? 거짓말,,,", next: "문으로 가보기 ▼" },
  ], () => {
    // 수아가 의자에서 일어나 문으로 걸어간다 (게임 화면에서 실제 이동)
    showOverlay(false);
    state.phase = PHASE.EXPLORATION;
    intro.step = "walk";
    intro.walkTX = 24; intro.walkTY = 21;   // 잠긴 정문(24,22) 바로 앞
    intro.onArrive = () => {
      introDialog([
        { who: "수아", body: "(문을 흔든다)\n어떡해, 진짜 안 열려…!" },
        { who: "수아", body: "…잠깐, 저기 칠판!\n칠판에 문제가 떠오르고 있어.\n저걸 풀면 문이 열릴지도 몰라!", next: "게임 시작 ▶" },
      ], finishIntro);
    };
  });
}

// 수아가 목표(문 앞)로 한 걸음씩 이동 - 도착하면 onArrive 호출
function updateIntroWalk(dt) {
  const m = currentMap();
  const tx = (intro.walkTX + 0.5) * TILE, ty = (intro.walkTY + 0.5) * TILE;
  stepToward(companion, tx, ty, 165 * dt, m);
  const dx = companion.x - tx, dy = companion.y - ty;
  if (dx * dx + dy * dy < (TILE * 0.2) ** 2) {
    companion.x = tx; companion.y = ty; companion.dir = "down";
    intro.step = "talk";
    const cb = intro.onArrive; intro.onArrive = null;
    if (cb) cb();
  }
}

  intro.active = false; intro.step = "";

}

// 새 방향을 골라 잠깐 그쪽으로 걷는다 (가끔 멈춰서 두리번 = 찾는 시늉)
function companionPickDir() {
  const keys = ["up", "down", "left", "right"];
  companion.dir = keys[Math.floor(Math.random() * keys.length)];
  companion.moveTimer = 0.45 + Math.random() * 1.0;
  companion.pause = (Math.random() < 0.28) ? (0.4 + Math.random() * 0.8) : 0;
}

// 방향키로 움직이는 캐릭터처럼 - 한 방향으로 걷다가 벽/시간이 되면 방향을 바꾼다.
// 주어진 월드 좌표에서 가장 가까운 청소도구함(TILE_HIDE) 타일
function nearestHideTile(wx, wy) {
  const m = currentMap();
  let best = null, bestD = Infinity;
  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      if (m[r][c] !== TILE_HIDE) continue;
      const cx = (c + 0.5) * TILE, cy = (r + 0.5) * TILE;
      const d = (cx - wx) ** 2 + (cy - wy) ** 2;
      if (d < bestD) { bestD = d; best = { tx: c, ty: r }; }
    }
  }
  return best;
}

function updateCompanion(dt) {
  if (!companion.active || companion.frozen) return;   // 컷신 중엔 스크립트가 직접 제어
  const m = currentMap();

  // 경비원이 깨어나면 3초 뒤 수아도 가까운 청소도구함에 숨는다
  if (guard.active) {
    if (!companion.hideArmed) { companion.hideArmed = true; companion.hideTimer = 3; companion.hideSpot = null; }
    if (companion.hideTimer > 0) {
      companion.hideTimer -= dt;
      if (companion.hideTimer <= 0) {
        companion.hideSpot = nearestHideTile(companion.x, companion.y);
        showToast("수아도 숨을 곳으로 달려간다!", { duration: 2500 });
      }
      // 카운트다운 동안은 평소처럼 배회 (아래 로직 진행)
    } else {
      // 청소도구함으로 이동해 숨는다 (도착하면 그 자리에 정지)
      if (companion.hideSpot) {
        const tx = (companion.hideSpot.tx + 0.5) * TILE, ty = (companion.hideSpot.ty + 0.5) * TILE;
        stepToward(companion, tx, ty, 240 * dt, m);
        const dx = companion.x - tx, dy = companion.y - ty;
        companion.hidden = (dx * dx + dy * dy) < (TILE * 0.3) ** 2;
        if (companion.hidden) companion.dir = "up";
      }
      return;   // 숨는 동안 일반 배회 정지
    }
  } else if (companion.hideArmed) {
    // 경비원이 물러가면 숨기 해제 → 평소대로
    companion.hideArmed = false; companion.hidden = false; companion.hideSpot = null;
  }

  if (companion.pause > 0) { companion.pause -= dt; return; }   // 멈춰서 두리번
  companion.moveTimer -= dt;
  if (companion.moveTimer <= 0) { companionPickDir(); return; }
  const d = COMPANION_DIRS[companion.dir] || COMPANION_DIRS.down;
  const spd = 230 * dt;        // 플레이어보다 살짝 느리게
  const r = companion.size;
  let moved = false;
  // X축 (플레이어 tryMove 와 동일한 4코너 충돌 검사)
  const nx = companion.x + d.dx * spd;
  if (d.dx !== 0 &&
      !isSolidAt(m, nx - r, companion.y - r) && !isSolidAt(m, nx + r, companion.y - r) &&
      !isSolidAt(m, nx - r, companion.y + r) && !isSolidAt(m, nx + r, companion.y + r)) {
    companion.x = nx; moved = true;
  }
  // Y축
  const ny = companion.y + d.dy * spd;
  if (d.dy !== 0 &&
      !isSolidAt(m, companion.x - r, ny - r) && !isSolidAt(m, companion.x + r, ny - r) &&
      !isSolidAt(m, companion.x - r, ny + r) && !isSolidAt(m, companion.x + r, ny + r)) {
    companion.y = ny; moved = true;
  }
  if (!moved) companionPickDir();   // 벽에 막히면 즉시 방향 전환
}

// 남자애(도현)도 같은 방식으로 배회
function wandererPickDir(c) {
  const keys = ["up", "down", "left", "right"];
  c.dir = keys[Math.floor(Math.random() * keys.length)];
  c.moveTimer = 0.45 + Math.random() * 1.0;
  c.pause = (Math.random() < 0.28) ? (0.4 + Math.random() * 0.8) : 0;
}
function updateBoy(dt) {
  const c = boy;
  if (!c.active) return;
  const m = currentMap();

  // 경비원이 깨어나면 3초 뒤 리온도 가까운 청소도구함에 숨는다 (수아와 동일)
  if (guard.active) {
    if (!c.hideArmed) { c.hideArmed = true; c.hideTimer = 3; c.hideSpot = null; }
    if (c.hideTimer > 0) {
      c.hideTimer -= dt;
      if (c.hideTimer <= 0) c.hideSpot = nearestHideTile(c.x, c.y);
      // 카운트다운 동안은 평소처럼 배회 (아래 로직 진행)
    } else {
      if (c.hideSpot) {
        const tx = (c.hideSpot.tx + 0.5) * TILE, ty = (c.hideSpot.ty + 0.5) * TILE;
        stepToward(c, tx, ty, 240 * dt, m);
        const dx = c.x - tx, dy = c.y - ty;
        c.hidden = (dx * dx + dy * dy) < (TILE * 0.3) ** 2;
      }
      return;   // 숨는 동안 일반 배회 정지
    }
  } else if (c.hideArmed) {
    c.hideArmed = false; c.hidden = false; c.hideSpot = null;
  }

  if (c.pause > 0) { c.pause -= dt; return; }
  c.moveTimer -= dt;
  if (c.moveTimer <= 0) { wandererPickDir(c); return; }
  const d = COMPANION_DIRS[c.dir] || COMPANION_DIRS.down;
  const spd = 230 * dt, r = c.size;
  let moved = false;
  const nx = c.x + d.dx * spd;
  if (d.dx !== 0 &&
      !isSolidAt(m, nx - r, c.y - r) && !isSolidAt(m, nx + r, c.y - r) &&
      !isSolidAt(m, nx - r, c.y + r) && !isSolidAt(m, nx + r, c.y + r)) { c.x = nx; moved = true; }
  const ny = c.y + d.dy * spd;
  if (d.dy !== 0 &&
      !isSolidAt(m, c.x - r, ny - r) && !isSolidAt(m, c.x + r, ny - r) &&
      !isSolidAt(m, c.x - r, ny + r) && !isSolidAt(m, c.x + r, ny + r)) { c.y = ny; moved = true; }
  if (!moved) wandererPickDir(c);
}

// ──────────────────────────────────────────
// 경비원(추격자) + 숨기
// ──────────────────────────────────────────
// 플레이어가 숨는 곳(TILE_HIDE) 위에 있는지
function isHideAt(wx, wy) {
  const tx = Math.floor(wx / TILE), ty = Math.floor(wy / TILE);
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return false;
  return currentMap()[ty][tx] === TILE_HIDE;
}

// 4코너 충돌 검사 (엔티티 중심 x,y / 반경 r)
function cornersSolid(m, x, y, r) {
  return isSolidAt(m, x - r, y - r) || isSolidAt(m, x + r, y - r) ||
         isSolidAt(m, x - r, y + r) || isSolidAt(m, x + r, y + r);
}

// 목표(tx,ty)를 향해 한 칸 이동 - 주축이 막히면 보조축으로 우회 (열린 방에서 충분)
// 목표 근처에서 한 스텝을 넘겨 오버슈트→되돌아오기(위아래 떨림)를 막기 위해
// DEAD 거리 이내인 축은 정지하고, 이동량은 남은 거리로 클램프한다.
function stepToward(c, tx, ty, spd, m) {
  const r = c.size;
  const ddx = tx - c.x, ddy = ty - c.y;
  const adx = Math.abs(ddx), ady = Math.abs(ddy);
  const DEAD = 2;   // 이 거리 이내면 그 축은 도착으로 간주 (떨림 방지)
  const sx = adx > DEAD ? Math.sign(ddx) : 0;
  const sy = ady > DEAD ? Math.sign(ddy) : 0;
  const tryX = () => { if (sx !== 0) { const nx = c.x + sx * Math.min(spd, adx); if (!cornersSolid(m, nx, c.y, r)) { c.x = nx; c.dir = sx > 0 ? 'right' : 'left'; return true; } } return false; };
  const tryY = () => { if (sy !== 0) { const ny = c.y + sy * Math.min(spd, ady); if (!cornersSolid(m, c.x, ny, r)) { c.y = ny; c.dir = sy > 0 ? 'down' : 'up'; return true; } } return false; };
  if (adx >= ady) { if (tryX()) return true; if (tryY()) return true; }
  else { if (tryY()) return true; if (tryX()) return true; }
  return false;
}

// 경비원 등장 - 플레이어에게서 가장 먼 통행 가능한 칸에 나타난다.
function spawnGuard(silent) {
  const m = currentMap();
  let best = null, bestD = -1;
  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      const t = m[r][c];
      if (t === TILE_VOID || SOLID.has(t)) continue;
      const wx = c * TILE + TILE / 2, wy = r * TILE + TILE / 2;
      const d = (wx - player.x) ** 2 + (wy - player.y) ** 2;
      if (d > bestD) { bestD = d; best = { wx, wy }; }
    }
  }
  if (!best) best = { wx: player.x, wy: player.y - TILE * 4 };
  guard.x = best.wx; guard.y = best.wy;
  guard.active = true; guard.mode = 'chase';
  guard.lastX = player.x; guard.lastY = player.y;
  guard.grace = 1.1; guard.dir = 'down'; guard.wanderTimer = 0;
  guard.giveupTimer = 0; guard.leaving = false; guard.exitTile = null; guard.leaveTimeout = 0;
  guard.searchedLast = false; guard.patrolTarget = null;
  guardTriggered = true;
  if (!silent) showToast("🚨 경비원이 깨어났다! 청소도구함에 숨어 피해라!", { warn: true, duration: 4500 });
}

// 순찰용 무작위 도달 가능 타일 - 현재 위치에서 어느 정도 떨어진 곳 우선 (멀리 돌아다니게)
function randomPatrolTile(wx, wy) {
  const m = currentMap();
  const cands = [];
  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      const t = m[r][c];
      if (t === TILE_VOID || SOLID.has(t)) continue;
      cands.push({ tx: c, ty: r });
    }
  }
  if (!cands.length) return null;
  const far = cands.filter(p => ((p.tx + 0.5) * TILE - wx) ** 2 + ((p.ty + 0.5) * TILE - wy) ** 2 > (TILE * 4) ** 2);
  const pool = far.length ? far : cands;
  return pool[Math.floor(Math.random() * pool.length)];
}

// 경비원이 퇴장할 가장 가까운 문 타일 (잠긴문/나무문/일반문/현관)
function nearestGuardExit(wx, wy) {
  const m = currentMap();
  const DOORS = new Set([TILE_DOOR, TILE_LOCKED_DOOR, TILE_WOODDOOR, TILE_ENTRANCE]);
  let best = null, bestD = Infinity;
  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      if (!DOORS.has(m[r][c])) continue;
      const cx = (c + 0.5) * TILE, cy = (r + 0.5) * TILE;
      const d = (cx - wx) ** 2 + (cy - wy) ** 2;
      if (d < bestD) { bestD = d; best = { tx: c, ty: r }; }
    }
  }
  return best;
}

function updateGuard(dt) {
  if (!guard.active) return;
  if (guard.grace > 0) { guard.grace -= dt; return; }   // 등장 직후 잠깐 멈칫
  const m = currentMap();

  // 포기하고 문으로 퇴장하는 중
  if (guard.leaving) {
    guard.leaveTimeout -= dt;
    const tgt = guard.exitTile;
    if (tgt) {
      const tx = (tgt.tx + 0.5) * TILE, ty = (tgt.ty + 0.5) * TILE;
      stepToward(guard, tx, ty, 300 * dt, m);
      const dx = guard.x - tx, dy = guard.y - ty;
      if (dx * dx + dy * dy < (TILE * 1.1) ** 2 || guard.leaveTimeout <= 0) {
        guard.active = false; guard.leaving = false;
        guardTriggered = false; guardPending = false;   // 떠났으니 위협 해제
      }
    } else {
      guard.active = false; guard.leaving = false;
    }
    return;
  }

  // 플레이어가 숨어있는 동안 포기 타이머 누적 → 10초면 "없네,,,," 하고 퇴장
  if (player.hidden) {
    guard.giveupTimer += dt;
    if (guard.giveupTimer >= 10) {
      guard.leaving = true;
      guard.exitTile = nearestGuardExit(guard.x, guard.y);
      guard.leaveTimeout = 6;
      showToast('경비원: "없네,,,,"', { duration: 3200 });
      return;
    }
  } else {
    guard.giveupTimer = 0;   // 다시 들키면 포기 타이머 리셋
  }

  if (!player.hidden) {
    guard.mode = 'chase';
    guard.lastX = player.x; guard.lastY = player.y;    // 보이는 동안 위치 갱신
  } else if (guard.mode === 'chase') {
    guard.mode = 'search';                              // 막 숨었다 → 마지막 위치로
    guard.searchedLast = false; guard.patrolTarget = null;
  }
  const speed = (guard.mode === 'chase' ? 330 : 235) * dt;
  if (guard.mode === 'chase') {
    stepToward(guard, player.x, player.y, speed, m);
  } else {
    // 수색: 마지막 본 위치를 한 번 확인한 뒤, 그 앞에서 죽치지 않고 맵을 순찰하며 돌아다닌다
    if (!guard.searchedLast) {
      stepToward(guard, guard.lastX, guard.lastY, speed, m);
      const dd = (guard.x - guard.lastX) ** 2 + (guard.y - guard.lastY) ** 2;
      if (dd < (TILE * 0.6) ** 2) guard.searchedLast = true;
    } else {
      // 무작위 순찰 지점으로 이동 - 도착하거나 막히면 다음 지점 (한 곳에 머물지 않음)
      if (!guard.patrolTarget) guard.patrolTarget = randomPatrolTile(guard.x, guard.y);
      const pt = guard.patrolTarget;
      if (pt) {
        const px = (pt.tx + 0.5) * TILE, py = (pt.ty + 0.5) * TILE;
        const moved = stepToward(guard, px, py, speed, m);
        const arrived = (guard.x - px) ** 2 + (guard.y - py) ** 2 < (TILE * 0.5) ** 2;
        if (arrived || !moved) guard.patrolTarget = randomPatrolTile(guard.x, guard.y);
      }
    }
  }
  // 잡힘 판정 - 숨어있지 않을 때만
  if (!player.hidden) {
    const dx = guard.x - player.x, dy = guard.y - player.y;
    if (dx * dx + dy * dy < (TILE * 0.5) ** 2) caughtByGuard();
  }
}

// 오답 다이얼로그에 표시할 누적 오답/경비원 경고 문구

  }

  return `<p style="font-size:13px;color:var(--warn)">누적 오답 ${n}/3 · 3번 틀리면 경비원이 깨어난다</p>`;

// ──────────────────────────────────────────
// 시작
// ──────────────────────────────────────────
let gameInitialized = false;
let loopStarted = false;   // 게임 루프는 앱 전체에서 딱 한 번만 시작 (중복 방지)
function initGame() {
  resizeCanvas();
  const isResume = !!state.pendingResume;
  applyStageDifficulty();   // 교실→복도→중앙 으로 갈수록 난이도 상승
  if (!gameInitialized) {
    buildSprites();
    gameInitialized = true;
  }
  // 매번 새로 빌드 (재시작 대응)
  triggers.length = 0;
  traps.length = 0;
  stairLinks.length = 0;
  buildMaps();
  mapCacheDirty = true;   // 새 스테이지 맵을 캐시에 다시 그림
  // 열쇠 개수는 스테이지마다 무작위 (문제 1개당 열쇠 1개). 최소 3 ~ 최대 트리거 수
  const reusableTrigger = triggers.find(t => t.reusable);
  if (reusableTrigger) {
    // 문제 교실이 하나뿐인 스테이지(복도) - 그 교실에서 3문제를 풀면 탈출
    state.totalRequired = 3;
  } else {
    const avail = triggers.length;
    state.totalRequired = avail <= 3 ? avail
      : 3 + Math.floor(Math.random() * (avail - 2));
  }
  state.keyFragments = [];
  // 스테이지마다 제한 시간 20분을 새로 부여 (이어하기는 저장된 남은 시간을 그대로 유지)
  if (!state.pendingResume) {
    state.timeLeft = state.timeLimit;
    state.timeExpired = false;
  }
  state.exitUnlocked = false;  // 시작부터 잠긴 상태 (스테이지마다 다른 출구)
  state.entered = true;         // 이미 학교 안 - 운동장 진입 시퀀스 없음
  state.solved = 0;
  state.currentFloor = 1;
  state.inClassroom = false;    // 스테이지 시작은 항상 교실 밖(복도/교실/중앙홀)
  escapeShown = false;
  // 스테이지별 스폰 위치
  const sc = stageCfg();
  const spawn = sc.spawn || { tx: 25, ty: 16 };
  player.x = spawn.tx * TILE + TILE/2;
  player.y = spawn.ty * TILE + TILE/2;
  player.dir = 'down';
  // 스테이지 색감 - 캔버스 요소에 CSS 필터로 한 번만 적용 (GPU 가속, 매 프레임 비용 없음)
  canvas.style.filter = sc.tile_filter ? sc.tile_filter : "none";
  state.phase = PHASE.EXPLORATION;   // 스테이지 전환 후 반드시 탐험 단계로 복귀 (없으면 못 움직임)

  // 이어하기: 저장된 스테이지 내부 진행(모은 열쇠·위치)을 그대로 복원
  if (state.pendingResume) {
    const pr = state.pendingResume;
    state.pendingResume = null;
    if (typeof pr.total === "number" && pr.total > 0) {
      state.totalRequired = triggers.length ? Math.min(pr.total, triggers.length) : pr.total;
    }
    // 모았던 열쇠 개수만큼 조각 복원
    const fragCount = Math.max(0, Math.min(pr.fragments | 0, state.totalRequired));
    const reuse = triggers.find(t => t.reusable);
    if (reuse) {
      // 반복 출제 교실: 모았던 조각 수만큼 복원하고, 다 못 모았으면 계속 풀 수 있게
      for (let i = 0; i < fragCount; i++) state.keyFragments.push({ label: reuse.label });
      if (state.keyFragments.length < state.totalRequired) reuse.used = false;
    } else {
      let marked = 0;
      for (const t of triggers) {
        if (marked >= fragCount) break;
        t.used = true;
        state.keyFragments.push({ label: t.label });
        marked++;
      }
    }
    state.solved = pr.solved | 0;
    // 위치 복원 - 단, 저장 좌표가 현재 층(복도/교실 밖)의 통행 가능한 칸일 때만.
    // 교실(2층) 안에서 저장했거나 좌표가 허공/벽이면 스테이지 스폰 지점으로 되돌린다 (허공 고정 버그 방지).
    let posRestored = false;
    if (typeof pr.px === "number" && typeof pr.py === "number" && pr.floor !== 2) {
      const ptx = Math.floor(pr.px / TILE), pty = Math.floor(pr.py / TILE);
      if (pty >= 0 && pty < MAP_H && ptx >= 0 && ptx < MAP_W) {
        const tile = currentMap()[pty][ptx];
        if (tile !== TILE_VOID && !SOLID.has(tile)) {
          player.x = pr.px; player.y = pr.py; posRestored = true;
        }
      }
    }
    if (!posRestored) {
      const sp = stageCfg().spawn || { tx: 25, ty: 16 };
      player.x = sp.tx * TILE + TILE / 2;
      player.y = sp.ty * TILE + TILE / 2;
    }
    // 모든 조각을 이미 모았던 상태면 출구를 열어 둔 채로 재개
    if (state.keyFragments.length >= state.totalRequired) unlockExit();
  }

  // 합류한 동행 친구는 모든 스테이지에서 플레이어 옆에서 함께 출발
  if (companion.active) {
    companion.x = player.x - TILE;
    companion.y = player.y;
    companion.pause = 0;
    companionPickDir();
  }
  if (boy.active) {
    boy.x = player.x + TILE;
    boy.y = player.y;
    boy.pause = 0;
    wandererPickDir(boy);
  }
  // 경비원: 새 스테이지 시작마다 초기화. 이미 깨어난 상태면 이 맵에도 다시 등장.
  guard.active = false;
  player.hidden = false;
  guardPending = guardTriggered;

  document.getElementById("key-inv").style.display = "block";
  updateKeyInventory();
  updateHud(); renderMinimap();   // 진입 즉시 HUD·미니맵 1회 표시 (throttle 대기 없이)
  saveGame();   // 스테이지 시작 시점 저장 - 이어하기가 이 스테이지를 가리키게

  // 스테이지1 새 게임이면 수아 깨우기 컷신을 먼저 재생 (스테이지 안내 토스트는 컷신 후에)
  const playWakeIntro = state.stage === 1 && state.wantWakeIntro && !isResume;

  if (!playWakeIntro) {
    showToast(`★ STAGE ${state.stage} — ${sc.name} ★\n${sc.subtitle}\n${sc.intro_toast || ""}`, { duration: 6000 });
    setTimeout(() => {
      showToast("노란 ✦ 반짝임에 다가가 [E] 를 누르세요", { duration: 4000 });
    }, 6500);
  }
  // 탐험을 시작하는 순간부터 제한 시간이 흐른다. (시간 값은 새 게임=가득, 이어하기=복원, 스테이지 전환=유지)
  state.timerActive = !playWakeIntro;   // 컷신 동안은 시간 정지
  updateTimerHud();
  lastTime = performance.now();
  // 루프는 한 번만 시작 - 스테이지 전환마다 중복 등록되면 입력이 여러 번 처리돼 버벅임/릴레이 발생
  if (!loopStarted) { loopStarted = true; requestAnimationFrame(loop); }

  if (playWakeIntro) startWakeCutscene();   // 수아 깨우기 컷신 (기존 "같이 찾아볼래?" 대체)
  // 복도(스테이지 2)에서 남자애를 만난다
  else if (state.stage === 2 && !state.boyIntroDone && !isResume) showBoyIntro();
}

// 종료 버튼 → 확인창
document.getElementById("quit-btn").onclick = () => renderQuitConfirm();

// 게임 종료 후 "다시 시작/처음으로" 등 의도적 새로고침 — 확인창 없이 바로 넘어가기
let intentionalNav = false;
function goHome() { intentionalNav = true; location.reload(); }
// 창/탭을 닫기 직전 자동 저장 + 떠날지 확인 (탐험 중일 때만, 의도적 이동은 제외)
window.addEventListener("beforeunload", (e) => {
  if (!intentionalNav && state.userId && state.phase >= PHASE.EXPLORATION) {
    saveGame();
    e.preventDefault();
    e.returnValue = "";   // 브라우저 기본 "나가시겠습니까?" 확인 표시
  }
});
// 실제로 페이지가 사라질 때(닫기/이동) 한 번 더 저장 - beforeunload보다 확실
window.addEventListener("pagehide", () => { if (state.userId) saveGame(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && state.userId) saveGame(); });

// 첫 화면 = 자동 로그인(기억된 계정) 또는 로그인 화면
function boot() {
  let last = null;
  try { last = localStorage.getItem("lastUser"); } catch(e) {}
  const accs = getAccounts();
  if (last && accs[last]) {
    // 지난번 로그인한 계정으로 바로 입장 (회원가입/로그인 정보 유지)
    const acc = accs[last];
    state.userId = last;
    state.grade = acc.grade || "중1";
    state.gender = acc.gender || "남";
    state.difficulty = GRADE_DIFF[state.grade] || "NORMAL";
    setApiKey(acc.apiKey || "");
    advancePhase(PHASE.NEW_OR_CONTINUE); renderNewOrContinue();
  } else {
    renderLogin();
  }
}
boot();
</script>
